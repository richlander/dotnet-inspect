version: 2

# Security updates are driven by Dependabot alerts and do not need an entry
# here. These entries add scheduled version updates, so a dependency is already
# current when an advisory lands rather than needing an upgrade under pressure.
#
# Minor and patch updates are grouped per ecosystem to keep the PR volume low.
# Major updates stay ungrouped: they are the ones that need to be read.
updates:
  - package-ecosystem: npm
    directory: /inspect-web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /prototypes/annotated-source-viewer
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Versions are centrally managed in Directory.Packages.props, but Dependabot
  # only proposes an update for a package it can see referenced. Discovery from
  # `/` expands dotnet-inspect.slnx. Among tracked projects outside that
  # solution, the one with a unique centrally managed package is listed
  # explicitly:
  #
  #   eng/CiChangeDetection     the only referrer of the centrally managed
  #                             YamlDotNet version; `/` does not discover this
  #                             standalone project.
  # The remaining standalone projects reference no package that an in-solution
  # project does not already reference, so `/` covers their versions.
  - package-ecosystem: nuget
    directories:
      - /
      - /eng/CiChangeDetection
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nuget-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
