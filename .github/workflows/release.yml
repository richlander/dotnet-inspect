name: Publish

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'CI workflow run ID to publish from'
        required: true
      confirm:
        description: 'Type "publish" to confirm NuGet release'
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  # Resolve the exact commit the CI run was built from so the Windows/macOS
  # packages we build here match the Linux packages produced by that run.
  resolve:
    runs-on: ubuntu-26.04
    if: github.event.inputs.confirm == 'publish'
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Resolve CI run commit
        id: sha
        run: |
          SHA=$(gh run view ${{ github.event.inputs.run_id }} \
            --repo ${{ github.repository }} --json headSha -q .headSha)
          echo "Resolved CI run ${{ github.event.inputs.run_id }} -> $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build the RID-specific Native AOT packages that used to be built in CI.
  # These run only at publish time to keep Windows/macOS off the per-PR path.
  build-native:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: win-arm64
            os: windows-latest
          - rid: osx-arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Pack RID-specific package
        run: dotnet pack src/dotnet-inspect -c Release -r ${{ matrix.rid }} -p:OfficialAotBuild=true

      - name: Upload RID package
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.rid }}
          path: artifacts/package/release/*.nupkg
          if-no-files-found: error

  publish:
    needs: [resolve, build-native]
    runs-on: ubuntu-26.04
    if: github.event.inputs.confirm == 'publish'
    environment: nuget
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      
      - name: Download Linux/any/pointer packages from CI run
        uses: actions/download-artifact@v8
        with:
          path: packages
          pattern: package-*
          merge-multiple: true
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Windows/macOS packages built in this run
        uses: actions/download-artifact@v8
        with:
          path: packages
          pattern: package-*
          merge-multiple: true
      
      - name: List packages
        run: ls -la packages/

      # Reach guard (issue #240): the non-AOT "any" fallback must target the LTS
      # floor so it installs on machines without the latest runtime, and the
      # pointer must stay TFM-agnostic. Fail the publish before pushing if either
      # regresses. Kept here (publish-time) to keep PR CI cheap.
      - name: Validate reach packaging
        run: |
          set -euo pipefail

          settings_path() {
            unzip -l "$1" | grep -oE 'tools/[^[:space:]]*DotnetToolSettings.xml' | head -1
          }

          any_pkg=$(ls packages/dotnet-inspect.any.*.nupkg)
          any_path=$(settings_path "$any_pkg")
          echo "any package:     $any_pkg -> $any_path"
          case "$any_path" in
            tools/net10.0/*) echo "OK: any package targets net10.0 (LTS reach floor)";;
            *) echo "ERROR: any package must target net10.0 for reach, found: $any_path"; exit 1;;
          esac

          pointer_pkg=$(ls packages/dotnet-inspect.[0-9]*.nupkg)
          pointer_path=$(settings_path "$pointer_pkg")
          echo "pointer package: $pointer_pkg -> $pointer_path"
          case "$pointer_path" in
            tools/any/any/*) echo "OK: pointer is TFM-agnostic (tools/any/any)";;
            *) echo "ERROR: pointer must be TFM-agnostic (tools/any/any), found: $pointer_path"; exit 1;;
          esac
        shell: bash

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'
      
      - name: NuGet login (OIDC → temp API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      
      # Publish RID-specific packages first, then any package, then pointer package last
      - name: Publish packages
        run: |
          # 1. Publish RID-specific AOT packages first
          for pkg in packages/dotnet-inspect.win-*.nupkg packages/dotnet-inspect.linux-*.nupkg packages/dotnet-inspect.osx-*.nupkg; do
            if [[ -f "$pkg" ]]; then
              echo "Publishing $pkg"
              dotnet nuget push "$pkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
            fi
          done
          
          # 2. Publish any (non-AOT) package
          for pkg in packages/dotnet-inspect.any.*.nupkg; do
            if [[ -f "$pkg" ]]; then
              echo "Publishing any package: $pkg"
              dotnet nuget push "$pkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
            fi
          done
          
          # 3. Publish pointer package last (references all RID-specific packages)
          for pkg in packages/dotnet-inspect.[0-9]*.nupkg; do
            if [[ -f "$pkg" ]]; then
              echo "Publishing pointer package: $pkg"
              dotnet nuget push "$pkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
            fi
          done
        shell: bash
      
      - name: Get version
        id: version
        run: |
          VERSION=$(grep -oP '(?<=<VersionPrefix>)[^<]+' src/dotnet-inspect/dotnet-inspect.csproj)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: packages/*.nupkg
          generate_release_notes: true
