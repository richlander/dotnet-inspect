name: Publish

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Successful main CI run identifying the commit to publish'
        required: true
      certification_run_id:
        description: 'Fresh successful Deep Inspect test run certifying this commit or an ancestor'
        required: true
      allow_later_commit:
        description: 'Allow publishing a later main commit without exact certification'
        required: true
        default: false
        type: boolean
      confirm:
        description: 'Type "publish" to confirm NuGet release'
        required: true

permissions:
  actions: read
  contents: write
  id-token: write

jobs:
  # Resolve and validate the exact commit to publish. A fresh Deep Inspect run
  # certifies the same commit by default. The operator may explicitly publish a
  # later descendant with successful main CI after reviewing the intervening
  # changes; a divergent or older commit is never accepted.
  resolve:
    runs-on: ubuntu-26.04
    if: github.event.inputs.confirm == 'publish'
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Validate certification and resolve commit
        id: sha
        shell: bash
        env:
          CERTIFICATION_RUN_ID: ${{ inputs.certification_run_id }}
          TARGET_RUN_ID: ${{ inputs.run_id }}
          ALLOW_LATER_COMMIT: ${{ inputs.allow_later_commit }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash eng/validate-release-evidence.sh \
            "$CERTIFICATION_RUN_ID" \
            "$TARGET_RUN_ID" \
            "$ALLOW_LATER_COMMIT" \
            36 \
            "$GITHUB_OUTPUT"

  build-native:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: win-arm64
            os: windows-latest
          - rid: osx-arm64
            os: macos-latest
          - rid: linux-x64
            os: ubuntu-26.04
          - rid: linux-arm64
            os: ubuntu-26.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Pack RID-specific package
        run: dotnet pack src/dotnet-inspect -c Release -r ${{ matrix.rid }} -p:OfficialAotBuild=true

      - name: Upload RID package
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.rid }}
          path: artifacts/package/release/*.nupkg
          if-no-files-found: error

  # Build the RID-neutral packages: the non-AOT "any" fallback and the
  # TFM-agnostic pointer. These used to come from CI's pack job; they are now
  # built here at publish time so CI never produces release artifacts.
  build-portable:
    needs: resolve
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Pack pointer package
        # SelfContained=true forces the pack TFM segment to 'any', so the pointer
        # manifest lands at tools/any/any/DotnetToolSettings.xml. The pointer
        # carries no implementation, so SelfContained pulls in no runtime.
        # RID-specific packages are built by build-native; disabling inner RID
        # packs keeps this portable job pointer-only on .NET 11 Preview 7+.
        run: dotnet pack src/dotnet-inspect -c Release -p:SelfContained=true -p:OfficialBuild=true -p:CreateRidSpecificToolPackages=false

      - name: Upload pointer package
        uses: actions/upload-artifact@v7
        with:
          name: package-pointer
          path: artifacts/package/release/*.nupkg
          if-no-files-found: error

      - name: Pack any (non-AOT) package
        # TFM is pinned to net10.0 structurally via Directory.Build.props so this
        # fallback stays installable on the LTS runtime. See issue #240.
        run: dotnet pack src/dotnet-inspect -c Release -r any -p:PublishAot=false -p:OfficialBuild=true

      - name: Upload any package
        uses: actions/upload-artifact@v7
        with:
          name: package-any
          path: artifacts/package/release/*.nupkg
          if-no-files-found: error

  publish:
    needs: [resolve, build-native, build-portable]
    runs-on: ubuntu-26.04
    if: github.event.inputs.confirm == 'publish'
    environment: nuget
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      
      - name: Download all packages built in this run
        uses: actions/download-artifact@v8
        with:
          path: packages
          pattern: package-*
          merge-multiple: true
      
      - name: List packages
        run: ls -la packages/

      # Reach guard (issue #240): the non-AOT "any" fallback must target the LTS
      # floor so it installs on machines without the latest runtime, and the
      # pointer must stay TFM-agnostic. Fail the publish before pushing if either
      # regresses. Kept here (publish-time) to keep PR CI cheap.
      - name: Validate reach packaging
        run: |
          set -euo pipefail

          settings_path() {
            unzip -l "$1" | grep -oE 'tools/[^[:space:]]*DotnetToolSettings.xml' | head -1
          }

          any_pkg=$(ls packages/dotnet-inspect.any.*.nupkg)
          any_path=$(settings_path "$any_pkg")
          echo "any package:     $any_pkg -> $any_path"
          case "$any_path" in
            tools/net10.0/*) echo "OK: any package targets net10.0 (LTS reach floor)";;
            *) echo "ERROR: any package must target net10.0 for reach, found: $any_path"; exit 1;;
          esac

          pointer_pkg=$(ls packages/dotnet-inspect.[0-9]*.nupkg)
          pointer_path=$(settings_path "$pointer_pkg")
          echo "pointer package: $pointer_pkg -> $pointer_path"
          case "$pointer_path" in
            tools/any/any/*) echo "OK: pointer is TFM-agnostic (tools/any/any)";;
            *) echo "ERROR: pointer must be TFM-agnostic (tools/any/any), found: $pointer_path"; exit 1;;
          esac
        shell: bash

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Revalidate certification before publish
        env:
          CERTIFICATION_RUN_ID: ${{ inputs.certification_run_id }}
          TARGET_RUN_ID: ${{ inputs.run_id }}
          ALLOW_LATER_COMMIT: ${{ inputs.allow_later_commit }}
          RESOLVED_SHA: ${{ needs.resolve.outputs.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash eng/validate-release-evidence.sh \
            "$CERTIFICATION_RUN_ID" \
            "$TARGET_RUN_ID" \
            "$ALLOW_LATER_COMMIT" \
            36 \
            "$RUNNER_TEMP/revalidated-evidence" \
            "$RESOLVED_SHA"
      
      - name: NuGet login (OIDC → temp API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      
      # Publish RID-specific packages first, then any package, then pointer package last
      - name: Publish packages
        run: |
          # 1. Publish RID-specific AOT packages first
          for pkg in packages/dotnet-inspect.win-*.nupkg packages/dotnet-inspect.linux-*.nupkg packages/dotnet-inspect.osx-*.nupkg; do
            if [[ -f "$pkg" ]]; then
              echo "Publishing $pkg"
              dotnet nuget push "$pkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
            fi
          done
          
          # 2. Publish any (non-AOT) package
          for pkg in packages/dotnet-inspect.any.*.nupkg; do
            if [[ -f "$pkg" ]]; then
              echo "Publishing any package: $pkg"
              dotnet nuget push "$pkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
            fi
          done
          
          # 3. Publish pointer package last (references all RID-specific packages)
          for pkg in packages/dotnet-inspect.[0-9]*.nupkg; do
            if [[ -f "$pkg" ]]; then
              echo "Publishing pointer package: $pkg"
              dotnet nuget push "$pkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
            fi
          done
        shell: bash
      
      - name: Get version
        id: version
        run: |
          VERSION=$(grep -oP '(?<=<VersionPrefix>)[^<]+' src/dotnet-inspect/dotnet-inspect.csproj)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ needs.resolve.outputs.sha }}
          files: packages/*.nupkg
          generate_release_notes: true
