name: Publish

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: 'Nightly release-candidate run to publish unchanged'
        required: true
      candidate_attempt:
        description: 'Exact complete workflow attempt selected by the operator'
        required: true
      accept_certification_concerns:
        description: 'Accept every disclosed completed non-success certification outcome'
        required: true
        default: false
        type: boolean
      confirm:
        description: 'Type "publish" to confirm packages, GitHub release, and production site'
        required: true

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  DOTNET_SDK_VERSION: '11.0.100-rc.1.26425.128'

jobs:
  resolve:
    name: Validate selected candidate
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      checks: read
      contents: read
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      run_attempt: ${{ steps.candidate.outputs.run_attempt }}
      artifact_id: ${{ steps.candidate.outputs.artifact_id }}
      artifact_digest: ${{ steps.candidate.outputs.artifact_digest }}
      concerns_accepted: ${{ steps.candidate.outputs.concerns_accepted }}
    steps:
      - name: Require main dispatch
        shell: bash
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Publication must be dispatched from main." >&2
            exit 1
          fi
          if [ "$CONFIRM" != publish ]; then
            echo "::error::Type publish to confirm coordinated publication." >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Validate candidate identity and evidence
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_ATTEMPT: ${{ inputs.candidate_attempt }}
          ACCEPT_CERTIFICATION_CONCERNS: ${{ inputs.accept_certification_concerns }}
        run: |
          eng/validate-release-candidate.sh \
            "$CANDIDATE_RUN_ID" \
            "$CANDIDATE_ATTEMPT" \
            "$ACCEPT_CERTIFICATION_CONCERNS" \
            "$GITHUB_OUTPUT"

  publish:
    name: Publish packages and GitHub release
    needs: resolve
    runs-on: ubuntu-26.04
    environment: nuget
    permissions:
      actions: read
      checks: read
      contents: write
      id-token: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Revalidate selected candidate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_ATTEMPT: ${{ inputs.candidate_attempt }}
          ACCEPT_CERTIFICATION_CONCERNS: ${{ inputs.accept_certification_concerns }}
          EXPECTED_SHA: ${{ needs.resolve.outputs.sha }}
          EXPECTED_ARTIFACT_ID: ${{ needs.resolve.outputs.artifact_id }}
          EXPECTED_DIGEST: ${{ needs.resolve.outputs.artifact_digest }}
          EXPECTED_CONCERNS_ACCEPTED: ${{ needs.resolve.outputs.concerns_accepted }}
        run: |
          eng/validate-release-candidate.sh \
            "$CANDIDATE_RUN_ID" \
            "$CANDIDATE_ATTEMPT" \
            "$ACCEPT_CERTIFICATION_CONCERNS" \
            "$RUNNER_TEMP/revalidated-candidate" \
            "$EXPECTED_SHA" \
            "$EXPECTED_ARTIFACT_ID" \
            "$EXPECTED_DIGEST" \
            "$EXPECTED_CONCERNS_ACCEPTED"

      - name: Download selected candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.resolve.outputs.artifact_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          path: artifacts/release-candidate
          digest-mismatch: error

      - name: Verify retained candidate bytes
        shell: bash
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_ATTEMPT: ${{ inputs.candidate_attempt }}
          EXPECTED_SHA: ${{ needs.resolve.outputs.sha }}
          EXPECTED_DIGEST: ${{ needs.resolve.outputs.artifact_digest }}
        run: |
          eng/verify-release-candidate-artifact.sh \
            artifacts/release-candidate \
            "$CANDIDATE_RUN_ID" \
            "$CANDIDATE_ATTEMPT" \
            "$EXPECTED_SHA" \
            "$EXPECTED_DIGEST"

      - name: Read retained version
        id: version
        shell: bash
        run: |
          version=$(jq -er .version artifacts/release-candidate/release-candidate.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify NuGet retry identity
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          packages=artifacts/release-candidate/packages
          retry_args=()
          for pkg in "$packages"/*.nupkg; do
            file=${pkg##*/}
            id=${file%."$VERSION".nupkg}
            lower_id=${id,,}
            url="https://api.nuget.org/v3-flatcontainer/$lower_id/$VERSION/$lower_id.$VERSION.nupkg"
            published="$RUNNER_TEMP/$lower_id.$VERSION.nupkg"
            status=$(curl -sS -L -o "$published" -w '%{http_code}' "$url")
            case "$status" in
              200)
                retry_args+=("$pkg" "$published")
                ;;
              404)
                ;;
              *)
                echo "::error::NuGet identity query for $id returned HTTP $status." >&2
                exit 1
                ;;
            esac
          done
          if (( ${#retry_args[@]} > 0 )); then
            dotnet run eng/verify-nuget-retry-package.cs -- "${retry_args[@]}"
          fi

      - name: NuGet login (OIDC to temporary API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish retained packages
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          packages=artifacts/release-candidate/packages

          for pkg in \
            "$packages"/dotnet-inspect.win-*.nupkg \
            "$packages"/dotnet-inspect.linux-*.nupkg \
            "$packages"/dotnet-inspect.osx-*.nupkg; do
            echo "Publishing $pkg"
            dotnet nuget push "$pkg" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

          for pkg in "$packages"/dotnet-inspect.any.*.nupkg; do
            echo "Publishing managed fallback $pkg"
            dotnet nuget push "$pkg" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

          for pkg in "$packages"/dotnet-inspect.[0-9]*.nupkg; do
            echo "Publishing pointer $pkg"
            dotnet nuget push "$pkg" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: Create GitHub release from retained packages
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          EXPECTED_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          packages=artifacts/release-candidate/packages
          release_json="$RUNNER_TEMP/existing-release.json"
          release_error="$RUNNER_TEMP/existing-release.error"
          if gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/$tag" \
            > "$release_json" 2> "$release_error"; then
            target=$(jq -er .target_commitish "$release_json")
            if [ "$target" != "$EXPECTED_SHA" ]; then
              echo "::error::Release $tag targets $target, not $EXPECTED_SHA." >&2
              exit 1
            fi
            gh release upload "$tag" "$packages"/*.nupkg --clobber
          elif grep -Fq '(HTTP 404)' "$release_error"; then
            tag_json="$RUNNER_TEMP/existing-tag.json"
            tag_error="$RUNNER_TEMP/existing-tag.error"
            if gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" \
              > "$tag_json" 2> "$tag_error"; then
              tag_type=$(jq -er .object.type "$tag_json")
              tag_sha=$(jq -er .object.sha "$tag_json")
              if [ "$tag_type" = tag ]; then
                tag_sha=$(gh api \
                  "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" \
                  --jq .object.sha)
              elif [ "$tag_type" != commit ]; then
                echo "::error::Tag $tag resolves to unsupported object $tag_type." >&2
                exit 1
              fi
              if [ "$tag_sha" != "$EXPECTED_SHA" ]; then
                echo "::error::Tag $tag targets $tag_sha, not $EXPECTED_SHA." >&2
                exit 1
              fi
            elif ! grep -Fq '(HTTP 404)' "$tag_error"; then
              cat "$tag_error" >&2
              exit 1
            fi
            gh release create "$tag" \
              --target "$EXPECTED_SHA" \
              --generate-notes \
              "$packages"/*.nupkg
          else
            cat "$release_error" >&2
            exit 1
          fi

  deploy:
    name: Deploy retained production site
    needs:
      - resolve
      - publish
    environment:
      name: inspect-web-production-promotion
      url: https://dotnet-inspect.net
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Revalidate selected candidate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_ATTEMPT: ${{ inputs.candidate_attempt }}
          ACCEPT_CERTIFICATION_CONCERNS: ${{ inputs.accept_certification_concerns }}
          EXPECTED_SHA: ${{ needs.resolve.outputs.sha }}
          EXPECTED_ARTIFACT_ID: ${{ needs.resolve.outputs.artifact_id }}
          EXPECTED_DIGEST: ${{ needs.resolve.outputs.artifact_digest }}
          EXPECTED_CONCERNS_ACCEPTED: ${{ needs.resolve.outputs.concerns_accepted }}
        run: |
          eng/validate-release-candidate.sh \
            "$CANDIDATE_RUN_ID" \
            "$CANDIDATE_ATTEMPT" \
            "$ACCEPT_CERTIFICATION_CONCERNS" \
            "$RUNNER_TEMP/revalidated-candidate" \
            "$EXPECTED_SHA" \
            "$EXPECTED_ARTIFACT_ID" \
            "$EXPECTED_DIGEST" \
            "$EXPECTED_CONCERNS_ACCEPTED"

      - name: Download selected candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.resolve.outputs.artifact_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          path: artifacts/release-candidate
          digest-mismatch: error

      - name: Verify retained candidate bytes
        shell: bash
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_ATTEMPT: ${{ inputs.candidate_attempt }}
          EXPECTED_SHA: ${{ needs.resolve.outputs.sha }}
          EXPECTED_DIGEST: ${{ needs.resolve.outputs.artifact_digest }}
        run: |
          eng/verify-release-candidate-artifact.sh \
            artifacts/release-candidate \
            "$CANDIDATE_RUN_ID" \
            "$CANDIDATE_ATTEMPT" \
            "$EXPECTED_SHA" \
            "$EXPECTED_DIGEST"

      - name: Deploy to production
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_INSPECT_WEB_PRODUCTION }}
          action: upload
          app_location: artifacts/release-candidate/site/wwwroot
          api_location: artifacts/release-candidate/site/api
          output_location: ''
          skip_app_build: true
          skip_api_build: true
