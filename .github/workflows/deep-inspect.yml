name: Explain 9774 NativeAOT corroboration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  explain-native:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_INSPECT_TIPS: q
    steps:
      - uses: actions/checkout@v7
        with:
          path: harness
      - uses: actions/checkout@v7
        with:
          ref: 479f3536e153b5f90e5cc78d07a0920b33c9d664
          path: base
      - uses: actions/checkout@v7
        with:
          ref: 0f7fb94b679f847249fb3d0f59c67cfaa22577b3
          path: head
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.100-rc.1.26425.128'
      - name: Publish exact production binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          dotnet --info > reports/sdk.txt
          uname -a > reports/host.txt
          nproc >> reports/host.txt
          lscpu >> reports/host.txt
          git -C base rev-parse HEAD > reports/base-sha.txt
          git -C head rev-parse HEAD > reports/head-sha.txt
          cd base
          dotnet publish src/DotnetInspect.Cli -c Release -r linux-x64 -p:PublishAot=true -o ../binaries/base > ../reports/base-publish.txt 2>&1
          cd ../head
          dotnet publish src/DotnetInspect.Cli -c Release -r linux-x64 -p:PublishAot=true -o ../binaries/head > ../reports/head-publish.txt 2>&1
      - name: Verify selected reading tasks
        shell: bash
        run: |
          set -euo pipefail
          cd head
          python3 tools/ExplainReadingScenarios/compare-selected.py --cli ../binaries/head/dotnet-inspect --output ../reports/selected > ../reports/selected.txt 2>&1
      - name: Compare NativeAOT terminals
        shell: bash
        run: |
          set -euo pipefail
          ps -eo pid,pcpu,comm > reports/processes-before.txt
          python3 harness/eng/explain-9774-native-compare.py --base "$PWD/binaries/base/dotnet-inspect" --head "$PWD/binaries/head/dotnet-inspect" --base-sha 479f3536e153b5f90e5cc78d07a0920b33c9d664 --head-sha 0f7fb94b679f847249fb3d0f59c67cfaa22577b3 --output reports/native-linux.json > reports/native-linux.txt
          ps -eo pid,pcpu,comm > reports/processes-after.txt
          cp harness/eng/explain-9774-native-compare.py reports/
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: explain-9774-native-linux
          path: reports/
          if-no-files-found: error
