name: Deep Inspect

on:
  workflow_call:
    inputs:
      lane:
        description: 'Which opt-in lane to run'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      lane:
        description: 'Which opt-in lane to run'
        required: true
        default: test
        type: choice
        options:
          - test
          - census
          - package-sweep
          - authored-corpus
          - platform-test
          - inspect-web
          - release-candidate
          - nightly
          - all
  schedule:
    # Daily authored-corpus regression detection, separate from certification.
    - cron: '0 9 * * *'
    # Full Linux test coverage after the authored-corpus window.
    - cron: '30 11 * * *'
    # Browser, facade, and published-application breadth after the test window.
    - cron: '0 13 * * *'
    # Weekly discovery: current packages.
    - cron: '0 9 * * 1'

# Least privilege by default. Jobs needing more declare it themselves; a
# job-level block replaces this default rather than adding to it.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_INSPECT_TIPS: q

concurrency:
  group: deep-inspect-${{ github.ref }}-${{ github.event.schedule || inputs.lane }}
  cancel-in-progress: false

jobs:
  package-sweep:
    name: NuGet package discovery sweep
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 9 * * 1') ||
      inputs.lane == 'package-sweep'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.100-rc.1.26425.128'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-package-sweep-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/*.slnx') }}
          restore-keys: |
            nuget-package-sweep-${{ runner.os }}-${{ runner.arch }}-
            nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Build managed tool
        run: dotnet build src/DotnetInspect.Cli -c Release -p:PublishAot=false

      - name: Prepare top-package slice
        id: acquisition
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/package-sweep
          # --resolve-latest on purpose: this lane is current-package discovery
          # evidence, so it wants what ships today, not the pinned pool the EVIL
          # corpus measures. The pin exists to make the corpus reproducible
          # (#3353); honoring it here would quietly turn discovery into a replay.
          dotnet run \
            eng/prepare-decompiler-package-sweep.cs -- \
            artifacts/package-sweep 1 10 --resolve-latest \
            | tee artifacts/package-sweep/acquisition.txt

      - name: Run bounded library report
        id: library_report
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mapfile -t assemblies < artifacts/package-sweep/assemblies.txt
          dotnet run --project tools/DecompilerHarness -c Release -- "${assemblies[@]}" \
            --library-report \
            --corpus-method-cap 250 \
            --compile-cap 25 \
            --top-patterns 25 \
            --max-examples 3 \
            | tee artifacts/package-sweep/report.md

      - name: Compare signature and body Type leverage
        if: ${{ !cancelled() && steps.acquisition.outcome == 'success' }}
        run: >-
          dotnet run -c Release
          eng/census-library-type-leverage.cs --
          artifacts/package-sweep/manifest.json
          artifacts/package-sweep/type-leverage.json
          artifacts/package-sweep/type-leverage.md

      - name: Check bounded library report result
        if: >-
          ${{
            !cancelled()
            && steps.acquisition.outcome == 'success'
            && steps.library_report.outcome != 'success'
          }}
        run: |
          echo "::error::The bounded library report failed; the independent Type-leverage census still ran." >&2
          exit 1

      - name: Upload package sweep artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deep-inspect-package-sweep
          path: artifacts/package-sweep/
          if-no-files-found: warn
          overwrite: true

  test:
    name: Test lane
    permissions:
      contents: read
      packages: read
    # Linux is the exhaustive Deep Inspect host. It runs every slow or
    # host-neutral suite once, while the platform matrix below concentrates on
    # fast CLI behavior and code with real OS, filesystem, runtime-layout, or
    # external-tool boundaries.
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '30 11 * * *') ||
      inputs.lane == 'test' ||
      inputs.lane == 'release-candidate' ||
      inputs.lane == 'all'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.100-rc.1.26425.128'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/*.slnx') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Build solution (tool + fixtures)
        id: build
        run: dotnet build dotnet-inspect.slnx -c Release

      - name: Install ilasm/ildasm/mdv
        id: iltools
        continue-on-error: true
        shell: bash
        run: eng/restore-iltools.sh --rid linux-x64 --mdv --native-paths >> "$GITHUB_PATH"

      - name: Run CLI tests (including slow integration)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project tests/DotnetInspect.Cli.Tests -c Release

      - name: Run CSharpText tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project tests/CSharpText.Tests -c Release

      - name: Run artifact contract tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project tests/Inspector.Artifacts.Tests -c Release

      - name: Run ecosystem registry tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project tests/DotnetInspector.Ecosystems.Tests -c Release

      - name: Run ecosystem consumer tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project tests/DotnetInspector.Ecosystems.Consumer.Tests -c Release

      - name: Run decompiler tests (slow gates except the multi-hour corpus sweep)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project tests/ILInspector.Decompiler.Tests -c Release -- --gate no-corpus

      - name: Discover expected decompiler gate tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          dotnet run --project tests/ILInspector.Decompiler.Tests -c Release --no-build --
          --gate-discovery-receipt "$RUNNER_TEMP/decompiler-gates-discovery.jsonl"
          --gate pre-merge --pre-enumerate-theories on --no-ansi

      - name: Run bounded decompiler receipt
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        id: gates
        continue-on-error: true
        timeout-minutes: 5
        env:
          DOTNET_INSPECT_DECOMPILER_TEST_RECEIPT: ${{ runner.temp }}/decompiler-gates-execution.jsonl
        run: >-
          dotnet run --project tests/ILInspector.Decompiler.Tests -c Release --no-build --
          --gate pre-merge --pre-enumerate-theories on --no-ansi
          --auto-reporters off --report-xunit-xml
          --report-xunit-xml-filename decompiler-gates.xml
          --results-directory "$RUNNER_TEMP"

      - name: Compare bounded decompiler receipt against known-red
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          dotnet run eng/check-decompiler-gate.cs --
          "$RUNNER_TEMP/decompiler-gates.xml"
          "$RUNNER_TEMP/decompiler-gates-execution.jsonl"
          eng/decompiler-gate-known-red.txt
          eng/decompiler-gate-expected-classes.txt
          "$RUNNER_TEMP/decompiler-gates-discovery.jsonl"

      - name: Upload bounded decompiler receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deep-inspect-decompiler-gates-report
          path: |
            ${{ runner.temp }}/decompiler-gates.xml
            ${{ runner.temp }}/decompiler-gates-execution.jsonl
            ${{ runner.temp }}/decompiler-gates-discovery.jsonl
          if-no-files-found: warn

      - name: Run NuGetFetch tests (offline)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project tests/NuGetFetch.Tests -c Release -- --filter-not-trait "Network=Live"

      - name: Run metadata tests
        id: metadata
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          DOTNET_INSPECT_D3_REPORT: ${{ github.workspace }}/artifacts/custom-attribute-d3/result.json
        run: dotnet run --project tests/ILInspector.Metadata.Tests -c Release -- --long-running 60 --xunit-diagnostics on

      - name: Upload custom-attribute D3 evidence
        if: ${{ !cancelled() && (steps.metadata.outcome == 'success' || steps.metadata.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: custom-attribute-d3-linux-x64
          path: artifacts/custom-attribute-d3/result.json
          if-no-files-found: error
          overwrite: true

      - name: Run services tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project tests/DotnetInspector.Services.Tests -c Release

      - name: Run query tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project tests/DotnetInspector.Queries.Tests -c Release

      - name: Run presentation tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project tests/DotnetInspector.Presentation.Tests -c Release

      # These complete suites were previously selected in the PR test matrix.
      # Run them on the scheduled Linux lane after the shared Release build.
      - name: Run Dependency policy tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project eng/DependencyPolicy.Tests -c Release

      - name: Run CSharp tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project tests/ILInspector.CSharp.Tests -c Release

      - name: Run Graph contract tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project tests/Inspector.Graph.Tests -c Release

      - name: Run Library contract tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project tests/DotnetInspector.Libraries.Tests -c Release

      - name: Run Resource ownership contract tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project tests/Inspector.Resources.Tests -c Release

      - name: Run Platform target and manifest tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project tests/DotnetInspector.Platforms.Tests -c Release

      - name: Run Dependency manifest tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project tests/DotnetInspector.DependencyManifests.Tests -c Release

      - name: Run PlatformHouse tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project tests/DotnetInspector.PlatformHouse.Tests -c Release

      - name: Run Local PlatformHouse adapter tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project tests/DotnetInspector.PlatformHouse.Local.Tests -c Release

      - name: Run Portable query tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project tests/DotnetInspector.PortableQueries.Tests -c Release

      - name: Run Row selection tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project tests/DotnetInspector.RowSelection.Tests -c Release

      - name: Run Performance oracle tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project tests/DotnetInspector.PerformanceOracles.Tests -c Release

      - name: Run Decoded text tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project tests/Inspector.Text.Tests -c Release

      - name: Run Source selection tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project tests/DotnetInspector.SourceSelection.Tests -c Release

      - name: Run Source delegation tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project tests/DotnetInspector.SourceDelegation.Tests -c Release

      - name: Run SourceHouse tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project tests/DotnetInspector.SourceHouse.Tests -c Release

      - name: Run Section row tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project tests/DotnetInspector.Sections.Tests -c Release

      - name: Run Instruction substrate tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project tests/ILInspector.Instructions.Tests -c Release

      - name: Run IL diff tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project tests/ILInspector.ILDiff.Tests -c Release

      - name: Run Fixture catalog tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project tests/DotnetInspector.FixtureInfrastructure.Tests -c Release

      - name: Run Network access tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project tests/NetworkAccess.Tests -c Release

      - name: Run Binary fetch tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project tests/BinaryFetch.Tests -c Release

      - name: Run Zip fetch tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project tests/ZipFetch.Tests -c Release

      - name: Run Untrusted documents tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project tests/UntrustedDocuments.Tests -c Release

      - name: Run Networking tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project tests/DotnetInspector.Networking.Tests -c Release

      - name: Run Cache tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project tests/DotnetInspector.Cache.Tests -c Release

      - name: Run Packages tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project tests/DotnetInspector.Packages.Tests -c Release

      - name: Run JSExport surface tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project tests/ILInspector.JsExportSurface.Tests -c Release

      - name: Run runfaster tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project tests/runfaster.Tests -c Release

      - name: Run Research tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project tests/ILInspector.Research.Tests -c Release -- --fail-skips on

      - name: Run analysis tests (including slow)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project tests/ILInspector.Analysis.Tests -c Release

      - name: Run package-backed Platform tests (including real reference packs)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project tests/DotnetInspector.PlatformHouse.Packages.Tests -c Release

      - name: Restore vendored ILAssembler
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bash eng/restore-ilassembler.sh

      - name: Run IL round-trip tests (including slow sweep)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project tests/DotnetInspector.ILRoundtrip.Tests -c Release

      # Specialized probes and receipts retain the exact PR gate shape on the
      # daily Linux lane, including non-vacuous fixture checks.
      - name: Self-test Library Type-leverage census
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          dotnet run -c Release
          eng/census-library-type-leverage.cs --
          --self-test

      - name: Test CLI runtime flavor across publish modes
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bash eng/test-runtime-flavor.sh linux-x64

      - name: Run MethodSemantics NativeAOT probe
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: eng/run-method-semantics-platform-probe.sh nativeaot linux-x64

      - name: Run local-path admission NativeAOT probe
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: eng/run-local-path-admission-platform-probe.sh nativeaot linux-x64

      - name: Prepare PR decompiler corpus
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          mkdir -p artifacts/decompiler-pr-corpus
          bash eng/prepare-decompiler-pr-corpus.sh artifacts/decompiler-pr-corpus/assemblies.txt

      - name: Run PR decompiler corpus sensor
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        id: decompiler_pr_corpus
        continue-on-error: true
        shell: bash
        run: |
          mapfile -t assemblies < artifacts/decompiler-pr-corpus/assemblies.txt
          set +e
          dotnet run --project tools/DecompilerHarness -c Release -- "${assemblies[@]}" \
            --emit-corpus-snapshot artifacts/decompiler-pr-corpus/snapshot.json \
            --diff-corpus-baseline tools/DecompilerHarness/corpus/pr-quick-baseline.json \
            --quality-diff-card \
            --corpus-method-cap 100 \
            --compile-cap 0 \
            --corpus-fidelity-cap 0 \
            --corpus-fidelity-oracle compile-back \
            --max-examples 3 \
            | tee artifacts/decompiler-pr-corpus/quality-diff-card.md
          status=${PIPESTATUS[0]}
          echo "$status" > artifacts/decompiler-pr-corpus/exit-code.txt
          exit "$status"

      - name: Upload PR decompiler corpus artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: decompiler-pr-corpus
          path: artifacts/decompiler-pr-corpus/
          if-no-files-found: error

      - name: Check PR decompiler corpus result
        if: ${{ !cancelled() && steps.decompiler_pr_corpus.outcome == 'failure' }}
        run: exit 1

      - name: Run GitHub Packages fixture test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        id: package_fixture
        continue-on-error: true
        shell: bash
        env:
          DOTNET_INSPECT_PACKAGE_FIXTURE_USER: ${{ github.actor }}
          DOTNET_INSPECT_PACKAGE_FIXTURE_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          results_dir="$RUNNER_TEMP"
          results_name="package-fixture-tests.xml"
          results="$results_dir/$results_name"
          dotnet run --project tests/DotnetInspect.Cli.Tests -c Release --no-build -- \
            --filter-method '*Package_Manifest_RendersToolManifestRows*' \
            --report-xunit-xml \
            --report-xunit-xml-filename "$results_name" \
            --results-directory "$results_dir" \
            --minimum-expected-tests 1
          if ! grep -Eq '<assembly[^>]+skipped="0"' "$results"; then
            echo "::error::Package fixture test skipped authenticated execution." >&2
            exit 1
          fi

      - name: Check GitHub Packages fixture result
        if: ${{ !cancelled() && steps.package_fixture.outcome == 'failure' }}
        run: |
          echo "::error::The authenticated GitHub Packages fixture test failed." >&2
          echo "This lane cannot certify hosted fixture consumption. See the fixture test step." >&2
          exit 1

      - name: Check Subject Relations constructed-generic oracle
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >
          dotnet run --project tools/SubjectRelationsScorecard -c Release
          --no-build -- check
          'tests/ILInspector.Metadata.Tests/bin/Release/net11.0/PinnedArtifacts/System.Private.CoreLib.dll|interface|System.Collections.Generic.IEnumerable`1'

      - name: Exercise Catalog research probe (offline)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run tools/CatalogChangeBenchmark.cs -c Release -- --self-test

      - name: Exercise package assembly-query benchmark (offline)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run tools/PackageAssemblyQueryBenchmark.cs -c Release -- --self-test

      - name: Run JSExport runtime-async wire gates
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          results_dir="$RUNNER_TEMP"
          results_name="jsexport-runtime-async-wire-tests.xml"
          results="$results_dir/$results_name"
          dotnet run --project tests/ILInspector.JsExportSurface.Tests \
            -c Release --no-build -- \
            --filter-method '*Build_ProducesEqualWireFactsAcrossAsyncLoweringsForDirectSerializerResult*' \
            --filter-method '*Build_ProducesEqualWireFactsAcrossAsyncLoweringsForSerializerStoredAcrossSuspension*' \
            --filter-method '*Build_RejectsConditionalSerializerStoreAcrossAsyncLowerings*' \
            --filter-method '*RuntimeAsync*' \
            --report-xunit-xml \
            --report-xunit-xml-filename "$results_name" \
            --results-directory "$results_dir"
          if ! grep -Eq 'total="[1-9][0-9]*"' "$results"; then
            echo "::error::JSExport runtime-async wire test filters selected no tests." >&2
            exit 1
          fi
          for method in \
            Build_ProducesEqualWireFactsAcrossAsyncLoweringsForDirectSerializerResult \
            Build_ProducesEqualWireFactsAcrossAsyncLoweringsForSerializerStoredAcrossSuspension \
            Build_RejectsConditionalSerializerStoreAcrossAsyncLowerings
          do
            if ! grep -Fq "method=\"$method\"" "$results"; then
              echo "::error::JSExport runtime-async wire gate '$method' did not run." >&2
              exit 1
            fi
          done

      - name: Run ts-jsexport generator acceptance gates
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          results_dir="$RUNNER_TEMP"
          results_name="ts-jsexport-generator-tests.xml"
          results="$results_dir/$results_name"
          dotnet run --project tests/ILInspector.JsExportSurface.Tests \
            -c Release --no-build -- \
            --filter-class 'ILInspector.JsExportSurface.Tests.JsonNamingPoliciesTests' \
            --filter-class 'ILInspector.JsExportSurface.Tests.JsExportContextLoaderTests' \
            --filter-class 'ILInspector.JsExportSurface.Tests.TypeScriptFacadeEmitterTests' \
            --filter-class 'ILInspector.JsExportSurface.Tests.TsJsExportContractsTests' \
            --filter-class 'ILInspector.JsExportSurface.Tests.TsJsExportCommandTests' \
            --report-xunit-xml \
            --report-xunit-xml-filename "$results_name" \
            --results-directory "$results_dir"
          for class in \
            ILInspector.JsExportSurface.Tests.JsonNamingPoliciesTests \
            ILInspector.JsExportSurface.Tests.JsExportContextLoaderTests \
            ILInspector.JsExportSurface.Tests.TypeScriptFacadeEmitterTests \
            ILInspector.JsExportSurface.Tests.TsJsExportContractsTests \
            ILInspector.JsExportSurface.Tests.TsJsExportCommandTests
          do
            if ! grep -Fq "type=\"$class\"" "$results"; then
              echo "::error::ts-jsexport generator gate '$class' selected no tests." >&2
              exit 1
            fi
          done
          negative_results_name="ts-jsexport-negative-tests.xml"
          negative_results="$results_dir/$negative_results_name"
          dotnet run --project tests/ILInspector.JsExportSurface.Tests \
            -c Release --no-build -- \
            --filter-method '*Emit_DoesNotApplyDictionarySemanticsToLookalikeType*' \
            --filter-method '*Emit_RejectsUnresolvedStructuredProducerWithIntrinsicSpelling*' \
            --filter-method '*GeneratorLoader_ReadsOneImageForMetadataAndBodyEvidence*' \
            --report-xunit-xml \
            --report-xunit-xml-filename "$negative_results_name" \
            --results-directory "$results_dir"
          for method in \
            Emit_DoesNotApplyDictionarySemanticsToLookalikeType \
            Emit_RejectsUnresolvedStructuredProducerWithIntrinsicSpelling \
            GeneratorLoader_ReadsOneImageForMetadataAndBodyEvidence
          do
            if ! grep -Fq "method=\"$method\"" "$negative_results"; then
              echo "::error::ts-jsexport negative gate '$method' did not run." >&2
              exit 1
            fi
          done

      - name: Run ts-jsexport context NativeAOT gate
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: eng/test-ts-jsexport-context-aot.sh "linux-x64"

      - name: Run Debug dependency sidecar contracts (Release)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          dotnet run --project tests/DotnetInspect.Cli.Tests -c Release
          --no-restore -p:DefineConstants=DEBUG --
          --filter-class 'DotnetInspect.Cli.Tests.DependsAssetCommandTests'
          --filter-not-trait "Speed=Slow"

      # Deliberately last: the suites above still report their results when
      # acquisition fails, but the lane must not go green after replacing its
      # oracle comparisons with skips.
      - name: Check ilasm/ildasm/mdv result
        if: steps.iltools.outcome != 'success'
        run: |
          echo "::error::Restoring ilasm/ildasm/mdv failed, so every test that uses them skipped." >&2
          echo "This lane cannot certify oracle-backed results. See the 'Install ilasm/ildasm/mdv' step." >&2
          exit 1

      # Build the shipped non-AOT fallback against its net10 LTS floor after
      # every net11 test has consumed the solution build's outputs.
      - name: Build tool for net10.0 fallback
        run: dotnet build src/DotnetInspect.Cli -c Release -p:DefaultTargetFramework=net10.0 -p:PublishAot=false

      - name: Pack pointer package
        run: dotnet pack src/DotnetInspect.Cli -c Release -p:SelfContained=true -p:OfficialBuild=true -p:CreateRidSpecificToolPackages=false -p:DotnetInspectWebsiteUrl=https://dotnet-inspect.net

      - name: Pack any (non-AOT) package
        run: dotnet pack src/DotnetInspect.Cli -c Release -r any -p:PublishAot=false -p:OfficialBuild=true -p:DotnetInspectWebsiteUrl=https://dotnet-inspect.net

      - name: Pack linux-x64 AOT package
        run: dotnet pack src/DotnetInspect.Cli -c Release -r linux-x64 -p:OfficialAotBuild=true -p:DotnetInspectWebsiteUrl=https://dotnet-inspect.net

      - name: Install tool from local packages
        run: dotnet tool install --global dotnet-inspect --source ./artifacts/package/release --no-cache

      - name: Smoke test - version
        run: |
          OUTPUT=$(dotnet-inspect --version)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'

      - name: Smoke test - help
        run: |
          OUTPUT=$(dotnet-inspect --help)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "dotnet-inspect"

      - name: Smoke test - production share URL
        run: |
          PACKET=eyJmIjoxLCJ0IjpbWyI6UGxhdGZvcm0iLCIxMC4wLjEwIiwibmV0MTAuMCIsbnVsbF0sWyJTeXN0ZW0uVGV4dC5Kc29uIiwiMTAuMC4wIiwibmV0MTAuMCIsbnVsbF1dLCJnIjpbWzAsMV1dLCJhIjoxLCJ4IjowLCJ2IjoiYXBpIiwieSI6IlN5c3RlbS5UZXh0Lkpzb24uSnNvblNlcmlhbGl6ZXIiLCJsIjpbIlN5c3RlbS5UZXh0Lkpzb24iXX0
          OUTPUT=$(dotnet-inspect workspace packet decode "$PACKET" | dotnet-inspect workspace packet encode - --url)
          echo "$OUTPUT"
          test "$OUTPUT" = "https://dotnet-inspect.net/?w=$PACKET"

      - name: Smoke test - package quiet
        run: |
          dotnet-inspect package System.Text.Json@10.0.0 -v:q > smoke-package.txt
          cat smoke-package.txt
          grep -q "System.Text.Json" smoke-package.txt
          grep -q "System.Text.Json.dll" smoke-package.txt

      - name: Smoke test - package normal
        run: |
          dotnet-inspect package System.Text.Json@10.0.0 -v:n \
            -S "Package Info,Signature" > smoke-package-normal.md
          cat smoke-package-normal.md
          grep -q "## Package Info" smoke-package-normal.md
          grep -q "## Signature" smoke-package-normal.md
          grep -q "Library" smoke-package-normal.md

      - name: Smoke test - type command (table output)
        run: |
          dotnet-inspect type --package System.Text.Json@10.0.0 -t JsonSerializer --table > smoke-type.txt
          cat smoke-type.txt
          grep -q "JsonSerializer" smoke-type.txt

      - name: Smoke test - member command (table output)
        run: |
          dotnet-inspect member JsonSerializer --package System.Text.Json@10.0.0 -m Serialize --table > smoke-member.txt
          cat smoke-member.txt
          grep -q "Serialize" smoke-member.txt

      - name: Smoke test - type command (markdown)
        run: |
          dotnet-inspect type --package System.Text.Json@10.0.0 -v:m -t JsonSerializer > smoke-type.md
          cat smoke-type.md
          grep -q "JsonSerializer" smoke-type.md

      - name: Smoke test - member command (markdown)
        run: |
          dotnet-inspect member JsonSerializer --package System.Text.Json@10.0.0 -v:m -m Serialize > smoke-member.md
          cat smoke-member.md
          grep -q "JsonSerializer" smoke-member.md
          grep -q "Serialize" smoke-member.md

      - name: Smoke test - platform library
        run: |
          dotnet-inspect library System.Private.CoreLib -v:q --json > smoke-platform.json
          cat smoke-platform.json
          jq -e '
            .source == "Platform"
            and .assembly_info.assembly_name == "System.Private.CoreLib"
          ' smoke-platform.json > /dev/null

      - name: Validate markdown output
        run: |
          npm install -g markdownlint-cli
          markdownlint --config .markdownlint.yaml smoke-*.md

      - name: Uninstall tool
        run: dotnet tool uninstall --global dotnet-inspect

  platform-test:
    name: Platform test (${{ matrix.rid }})
    # Windows and macOS run the fast CLI population plus suites with real OS,
    # filesystem, runtime-layout, or external-tool boundaries. Linux owns the
    # exhaustive and host-neutral work above; repeating its full CLI and
    # decompiler populations here spent hours without adding another host.
    #
    # The retained suites preserve Windows-only CLI and Query failures,
    # path-sensitive Artifact/NuGet/Metadata/Services behavior, Research's
    # filesystem capability checks, and a cheap decompiler boundary canary.
    # Slow CLI and decompiler gates, CSharpText, ecosystem, presentation,
    # corpus, analysis, IL round-trip, and packaging execute once on Linux.
    if: >-
      inputs.lane == 'test' ||
      inputs.lane == 'platform-test' ||
      inputs.lane == 'release-candidate' ||
      inputs.lane == 'all'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    # Exact-head run 36287209816 measured the reduced jobs at 46 minutes on
    # Windows and 61 minutes on macOS. Two hours preserves substantial runner
    # variance while preventing accidental reintroduction of multi-hour work.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.100-rc.1.26425.128'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/*.slnx') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Build
        id: build
        run: dotnet build dotnet-inspect.slnx -c Release

      # GitHub's Windows image supplies Git Bash to workflow steps without
      # exposing it to child .NET processes. Publish its native path so the
      # activation tests invoke Git Bash rather than the WSL launcher.
      #
      # continue-on-error preserves the other platform results during a feed
      # outage. The terminal check below still makes lost oracle coverage red.
      - name: Install ilasm/ildasm/mdv
        id: iltools
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            printf 'ILTOOLS_BASH=%s\n' "$(cygpath -w "$(command -v bash)")" >> "$GITHUB_ENV"
          fi
          eng/restore-iltools.sh --rid ${{ matrix.rid }} --mdv --native-paths >> "$GITHUB_PATH"

      # Run every suite after a successful build even if an earlier suite
      # fails. Platform breaks commonly share one fixture-level cause, and
      # reporting every affected suite makes the scheduled failure actionable.
      - name: Run CLI tests (fast platform surface)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project tests/DotnetInspect.Cli.Tests -c Release -- --filter-not-trait "Speed=Slow"

      - name: Run artifact contract tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project tests/Inspector.Artifacts.Tests -c Release

      - name: Run Graph contract tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project tests/Inspector.Graph.Tests -c Release

      - name: Run decompiler unit tests (fast)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project tests/ILInspector.Decompiler.Tests -c Release -- --filter-not-trait "Speed=Slow"

      - name: Run NuGetFetch tests (offline)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project tests/NuGetFetch.Tests -c Release -- --filter-not-trait "Network=Live"

      - name: Run metadata tests
        id: metadata
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          DOTNET_INSPECT_D3_REPORT: ${{ github.workspace }}/artifacts/custom-attribute-d3/result.json
        run: dotnet run --project tests/ILInspector.Metadata.Tests -c Release -- --long-running 60 --xunit-diagnostics on

      - name: Upload custom-attribute D3 evidence
        if: ${{ !cancelled() && (steps.metadata.outcome == 'success' || steps.metadata.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: custom-attribute-d3-${{ matrix.rid }}
          path: artifacts/custom-attribute-d3/result.json
          if-no-files-found: error
          overwrite: true

      - name: Run services tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project tests/DotnetInspector.Services.Tests -c Release

      - name: Run query tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project tests/DotnetInspector.Queries.Tests -c Release

      - name: Run Research tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project tests/ILInspector.Research.Tests -c Release -- --fail-skips on

      - name: Check ilasm/ildasm/mdv result
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.iltools.outcome != 'success' }}
        shell: bash
        run: |
          echo "::error::Restoring ilasm/ildasm/mdv for ${{ matrix.rid }} failed or timed out, so oracle tests skipped." >&2
          echo "This lane cannot certify oracle-backed results. See the 'Install ilasm/ildasm/mdv' step." >&2
          exit 1

  decompiler-corpus:
    name: Decompiler corpus lane
    # Split out of the test lane so the multi-hour corpus sweep gets its own
    # 6h job budget instead of sharing the test job's budget with the other
    # slow gates (which previously pushed the combined job past its timeout).
    # Runs alongside the test lane for daily and on-demand certification.
    if: >-
      inputs.lane == 'test' ||
      inputs.lane == 'release-candidate' ||
      inputs.lane == 'all'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.100-rc.1.26425.128'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/*.slnx') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Build solution (tool + fixtures)
        run: dotnet build dotnet-inspect.slnx -c Release

      - name: Run decompiler corpus sweep
        run: dotnet run --project tests/ILInspector.Decompiler.Tests -c Release -- --gate corpus

  release-certification:
    name: Release certification
    needs: [test, platform-test, decompiler-corpus]
    if: >-
      always() &&
      (
        inputs.lane == 'test' ||
        inputs.lane == 'release-candidate' ||
        inputs.lane == 'all'
      )
    runs-on: ubuntu-24.04
    steps:
      - name: Certify slow validation
        env:
          TEST_RESULT: ${{ needs.test.result }}
          PLATFORM_RESULT: ${{ needs.platform-test.result }}
          CORPUS_RESULT: ${{ needs.decompiler-corpus.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$TEST_RESULT" != success ] ||
             [ "$PLATFORM_RESULT" != success ] ||
             [ "$CORPUS_RESULT" != success ]; then
            echo "::error::Release certification requires successful test, platform-test, and decompiler-corpus jobs."
            echo "test=$TEST_RESULT platform-test=$PLATFORM_RESULT decompiler-corpus=$CORPUS_RESULT"
            exit 1
          fi
          echo "Release certification passed for $GITHUB_SHA"

  inspect-web:
    name: Inspect Web comprehensive
    # Complete facade, canary, browser, and published evidence runs daily and
    # on demand. PR CI keeps focused platform and API tests.
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 13 * * *') ||
      inputs.lane == 'inspect-web' ||
      inputs.lane == 'release-candidate' ||
      inputs.lane == 'all'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: inspect-web/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.100-rc.1.26425.128'

      - name: Install browser Wasm workload
        run: dotnet workload install wasm-experimental

      - name: Build browser frontend
        working-directory: inspect-web
        run: |
          npm ci
          npm run facades
          npm run analyze:generated
          npm run build:generated

      - name: Test browser frontend
        working-directory: inspect-web
        run: node --test

      - name: Test annotated-source viewer
        working-directory: prototypes/annotated-source-viewer
        run: npm test

      - name: Test browser engine
        env:
          MSBuildEnableWorkloadResolver: 'false'
        run: dotnet run --project tests/DotnetInspect.Web.Tests -c Release

      - name: Check complete generated facade contract
        run: eng/generate-inspect-web-engine-facade.sh --check

      - name: Test complete shared-runtime multi-facade canary
        run: eng/test-inspect-web-multi-facade-canary.sh

      - name: Test complete managed-operation bridge canary
        run: eng/test-inspect-web-managed-operation-bridge-canary.sh

      - name: Typecheck generated ts-jsexport facade
        run: eng/test-ts-jsexport-typescript.sh

      - name: Install Firefox
        working-directory: inspect-web
        run: npx playwright install --with-deps firefox

      - name: Test browser UI in Firefox
        working-directory: inspect-web
        run: npm run test:browser:generated

      - name: Publish browser application
        run: >-
          dotnet publish src/DotnetInspect.Web/DotnetInspect.Web.csproj
          -c Release --output artifacts/inspect-web-publish
          -p:InspectWebIncludeFrontend=true

      - name: Publish Inspect Web managed API
        run: >-
          dotnet publish src/MsdlProxy/MsdlProxy.csproj
          -c Release --output artifacts/inspect-web-publish/api

      - name: Verify published site artifact
        run: eng/verify-inspect-web-site-artifact.sh artifacts/inspect-web-publish

      - name: Test published browser application
        run: eng/test-inspect-web-published-application.sh

  census:
    name: Census lane
    if: >-
      inputs.lane == 'census' ||
      inputs.lane == 'release-candidate' ||
      inputs.lane == 'all'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.100-rc.1.26425.128'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/*.slnx') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Build managed tool
        run: dotnet build src/DotnetInspect.Cli -c Release -p:PublishAot=false

      - name: Prepare real-world corpus
        run: |
          mkdir -p artifacts/deep-inspect
          bash eng/prepare-decompiler-corpus.sh artifacts/deep-inspect/corpus-assemblies.txt

      - name: Run AssemblyRef supplier routing census
        shell: bash
        run: |
          set -o pipefail
          dotnet run -c Release eng/census-assemblyref-supplier-routing.cs -- \
            artifacts/deep-inspect/assemblyref-supplier-routing.json 1 100 \
            Microsoft.Azure.SignalR@1.33.1/net8.0 \
            2>&1 | tee artifacts/deep-inspect/assemblyref-supplier-routing.txt

      - name: Run real-world corpus sensor
        shell: bash
        run: |
          set -o pipefail
          mapfile -t assemblies < artifacts/deep-inspect/corpus-assemblies.txt
          mkdir -p artifacts/deep-inspect
          dotnet run --project tools/DecompilerHarness -c Release -- "${assemblies[@]}" \
            --emit-corpus-snapshot artifacts/deep-inspect/corpus-snapshot.json \
            --diff-corpus-baseline tools/DecompilerHarness/corpus/real-world-baseline.json \
            --compile-cap 4000 \
            --corpus-fidelity-cap 50 \
            --corpus-fidelity-oracle rts-cutover \
            --max-examples 3 \
            2>&1 | tee artifacts/deep-inspect/corpus-sensor.txt

      - name: Build classic state-machine corpus fixture
        run: dotnet build fixtures/decompiler/ILInspector.Decompiler.Fixtures.ClassicStateMachines -c Release

      - name: Run classic state-machine corpus sensor
        shell: bash
        run: |
          mkdir -p artifacts/deep-inspect
          dotnet run --project tools/DecompilerHarness -c Release -- \
            artifacts/bin/ILInspector.Decompiler.Fixtures.ClassicStateMachines/release/ILInspector.Decompiler.Fixtures.ClassicStateMachines.dll \
            --corpus-profile classic-state-machines \
            --emit-corpus-snapshot artifacts/deep-inspect/classic-state-machines-snapshot.json \
            --diff-corpus-baseline tools/DecompilerHarness/corpus/classic-state-machines-baseline.json \
            --corpus-fidelity-oracle compile-back \
            --max-examples 10

      - name: Run return-address equivalence census
        shell: bash
        run: |
          set -o pipefail
          mapfile -t assemblies < artifacts/deep-inspect/corpus-assemblies.txt
          mkdir -p artifacts/deep-inspect
          dotnet run --project tools/DecompilerHarness -c Release -- "${assemblies[@]}" \
            --emit-return-address-snapshot artifacts/deep-inspect/return-address-snapshot.json \
            --diff-return-address-baseline tools/DecompilerHarness/corpus/return-address-baseline.json \
            --max-examples 10 \
            2>&1 | tee artifacts/deep-inspect/return-address-census.txt

      - name: Run not-my-type equivalence census
        shell: bash
        run: |
          set -o pipefail
          mapfile -t assemblies < artifacts/deep-inspect/corpus-assemblies.txt
          mkdir -p artifacts/deep-inspect
          dotnet run --project tools/DecompilerHarness -c Release -- "${assemblies[@]}" \
            --emit-not-my-type-snapshot artifacts/deep-inspect/not-my-type-snapshot.json \
            --diff-not-my-type-baseline tools/DecompilerHarness/corpus/not-my-type-baseline.json \
            --max-examples 10 \
            2>&1 | tee artifacts/deep-inspect/not-my-type-census.txt

      - name: Run signature fuzzer
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/deep-inspect
          # Self-contained: generates adversarial signature blobs and drives them through
          # SignatureBlobGuard + a real SRM decode. A guard gap aborts the process; finishing is
          # the pass. Deterministic per seed, so a crash reproduces with --fuzz-seed.
          dotnet run --project tools/DecompilerHarness -c Release -- \
            --fuzz-signatures --fuzz-iterations 1000000 --fuzz-seed 1 --fuzz-log-every 50000 \
            2>&1 | tee artifacts/deep-inspect/signature-fuzz.txt

      - name: Run validity predicate scan
        shell: bash
        run: |
          set -o pipefail
          mapfile -t assemblies < artifacts/deep-inspect/corpus-assemblies.txt
          mkdir -p artifacts/deep-inspect
          dotnet run --project tools/DecompilerHarness -c Release -- "${assemblies[@]}" \
            --validity-predicate-scan \
            --max-examples 10 \
            | tee artifacts/deep-inspect/validity-predicate-scan.txt

      - name: Run uncapped validity sweep
        shell: bash
        run: |
          set -o pipefail
          mapfile -t assemblies < artifacts/deep-inspect/corpus-assemblies.txt
          mkdir -p artifacts/deep-inspect
          dotnet run --project tools/DecompilerHarness -c Release -- "${assemblies[@]}" \
            --validity-check \
            --compile-cap all \
            --max-examples 10 \
            | tee artifacts/deep-inspect/validity-check-uncapped.txt

      - name: Run assertion scan coverage report
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p artifacts/assertion-scan
          bash eng/prepare-decompiler-assertion-corpus.sh artifacts/assertion-scan/assemblies.txt
          mapfile -t assertion_assemblies < artifacts/assertion-scan/assemblies.txt
          set +e
          dotnet run --project tools/DecompilerHarness -c Release -- "${assertion_assemblies[@]}" \
            --assertion-scan \
            --assertion-fixture-guarantee \
            --max-examples 10 \
            | tee artifacts/assertion-scan/assertion-scan.txt
          status=${PIPESTATUS[0]}
          echo "$status" > artifacts/assertion-scan/exit-code.txt
          exit 0

      - name: Run analysis corpus sensor
        shell: bash
        run: |
          mkdir -p artifacts/analysis-census
          dotnet run --project tools/AnalysisHarness -c Release -- \
            --corpus-list artifacts/deep-inspect/corpus-assemblies.txt \
            --emit-corpus-snapshot artifacts/analysis-census/analysis-corpus-snapshot.json \
            --diff-corpus-baseline tools/AnalysisHarness/corpus/analysis-baseline.json

      - name: Run analysis paydirt recall
        run: |
          dotnet run --project tools/AnalysisHarness -c Release -- \
            --paydirt-recall artifacts/bin/ILInspector.Decompiler/release/ILInspector.Decompiler.dll \
            --reference tools/AnalysisHarness/corpus/paydirt-reference.json

      - name: Upload deep inspect artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deep-inspect-census
          path: |
            artifacts/deep-inspect/
            artifacts/assertion-scan/
            artifacts/analysis-census/
          if-no-files-found: warn
          overwrite: true

  nightly:
    name: Nightly SDK lane
    # Intentionally not included in "all": this lane uses daily SDK bits and is
    # for opt-in compiler/runtime validation before the next preview ships.
    if: inputs.lane == 'nightly'
    runs-on: ubuntu-26.04
    env:
      DOTNETUP_CHANNEL: 11.0-daily
      DOTNET_ROOT: ${{ github.workspace }}/.dotnet-nightly
      DOTNET_DOTNETUP_DATA_DIR: ${{ github.workspace }}/artifacts/.dotnetup
    steps:
      - uses: actions/checkout@v7

      - name: Install nightly .NET SDK with dotnetup
        shell: bash
        run: |
          set -euo pipefail

          dotnetup_dir="$RUNNER_TEMP/dotnetup"
          getter_script="$RUNNER_TEMP/get-dotnetup.sh"

          mkdir -p "$dotnetup_dir" "$DOTNET_ROOT" "$DOTNET_DOTNETUP_DATA_DIR"
          curl -fsSL --retry 3 https://aka.ms/dotnetup/get-dotnetup.sh -o "$getter_script"
          bash "$getter_script" --install-dir "$dotnetup_dir"

          "$dotnetup_dir/dotnetup" --version
          "$dotnetup_dir/dotnetup" sdk install "$DOTNETUP_CHANNEL" \
            --install-path "$DOTNET_ROOT" \
            --untracked \
            --set-default-install false \
            --interactive false
          nightly_sdk="$("$DOTNET_ROOT/dotnet" --list-sdks | awk 'END { print $1 }')"
          test -n "$nightly_sdk"

          pinned_sdk="$(bash eng/prepare-decompiler-opt-in-corpus.sh print-pinned-sdk)"
          "$dotnetup_dir/dotnetup" sdk install "$pinned_sdk" \
            --install-path "$DOTNET_ROOT" \
            --untracked \
            --set-default-install false \
            --interactive false

          cat > global.json <<EOF
          {
            "sdk": {
              "version": "$nightly_sdk",
              "rollForward": "disable",
              "allowPrerelease": true
            }
          }
          EOF

          echo "$dotnetup_dir" >> "$GITHUB_PATH"
          echo "$DOTNET_ROOT" >> "$GITHUB_PATH"
          test "$("$DOTNET_ROOT/dotnet" --version)" = "$nightly_sdk"
          "$DOTNET_ROOT/dotnet" --info

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-nightly-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/*.slnx') }}
          restore-keys: |
            nuget-nightly-${{ runner.os }}-${{ runner.arch }}-

      - name: Write nightly NuGet config
        shell: bash
        run: |
          set -euo pipefail

          nightly_nuget_config="$RUNNER_TEMP/NuGet.Config"
          echo "NIGHTLY_NUGET_CONFIG=$nightly_nuget_config" >> "$GITHUB_ENV"

          cat > "$nightly_nuget_config" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="dotnet11" value="https://dnceng.pkgs.visualstudio.com/public/_packaging/dotnet11/nuget/v3/index.json" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
            <packageSourceMapping>
              <!--
                These pack IDs must map to both sources. NuGet source mapping is
                package-ID based, not version-aware: net11 daily runtime/AOT/linker
                packs come from the dotnet11 feed, while net10 packs used by some
                fixture projects still come from nuget.org.
              -->
              <packageSource key="dotnet11">
                <package pattern="Microsoft.AspNetCore.App.*" />
                <package pattern="Microsoft.DotNet.ILCompiler" />
                <package pattern="Microsoft.NET.ILLink.Tasks" />
                <package pattern="Microsoft.NETCore.App.*" />
                <package pattern="runtime.*.Microsoft.DotNet.ILCompiler" />
              </packageSource>
              <packageSource key="nuget.org">
                <package pattern="*" />
                <package pattern="Microsoft.AspNetCore.App.*" />
                <package pattern="Microsoft.DotNet.ILCompiler" />
                <package pattern="Microsoft.NET.ILLink.Tasks" />
                <package pattern="Microsoft.NETCore.App.*" />
                <package pattern="runtime.*.Microsoft.DotNet.ILCompiler" />
              </packageSource>
            </packageSourceMapping>
          </configuration>
          EOF

      - name: Probe unsafe expression compiler support
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          check="$RUNNER_TEMP/unsafe-expression.cs"
          cat > "$check" <<'EOF'
          #:property LangVersion=preview
          #:property AllowUnsafeBlocks=true
          #:property Features=updated-memory-safety-rules

          int value = 42;
          nint address = (nint)unsafe(&value);
          System.Console.WriteLine(address != 0);
          EOF

          dotnet run "$check"

      - name: Restore with nightly package feeds
        run: dotnet restore dotnet-inspect.slnx --configfile "$NIGHTLY_NUGET_CONFIG"

      - name: Build with nightly SDK
        run: dotnet build dotnet-inspect.slnx -c Release --no-restore

      - name: Run unsafe decompiler tests with nightly SDK
        run: dotnet run --project tests/ILInspector.Decompiler.Tests -c Release --no-restore -- --filter-query "/*/*/UnsafeEmitterTests/*"

      - name: Gate net11 opt-in feature corpus
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts/opt-in-corpus
          bash eng/prepare-decompiler-opt-in-corpus.sh \
            pinned artifacts/opt-in-corpus/pinned-assemblies.txt
          mapfile -t assemblies < artifacts/opt-in-corpus/pinned-assemblies.txt
          dotnet run --project tools/DecompilerHarness -c Release -- "${assemblies[@]}" \
            --corpus-profile opt-in-net11 \
            --emit-corpus-snapshot artifacts/opt-in-corpus/snapshot.json \
            --diff-corpus-baseline tools/DecompilerHarness/corpus/opt-in-net11-baseline.json \
            --quality-diff-card \
            --compile-cap 25 \
            --corpus-fidelity-cap 25 \
            --corpus-fidelity-oracle compile-back \
            --max-examples 3 \
            | tee artifacts/opt-in-corpus/quality-diff-card.md

      - name: Report opt-in compiler lowering drift
        shell: bash
        run: |
          set -o pipefail
          bash eng/report-decompiler-opt-in-corpus-drift.sh \
            | tee artifacts/opt-in-corpus/compiler-drift.md

      - name: Upload opt-in corpus artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deep-inspect-opt-in-corpus
          path: artifacts/opt-in-corpus/
          if-no-files-found: warn
          overwrite: true

  authored-corpus-ratchet:
    name: Authored-corpus ratchet lane
    # The first caller this benchmark has ever had. Before this job nothing ran it:
    # no workflow referenced it, so its exit code — the headline quality metric —
    # was never read by anything (#3245).
    #
    # This is a *periodic* gate, not a merge gate. The run needs the vendored EVIL
    # corpus (an orphan branch) plus a 100-package NuGet sweep, so it is far too
    # expensive for the PR lane.
    #
    # This lane passes --ratchet-baseline, which it could not do until now. The pool is
    # pinned (docs/data/nuget-top-packages.lock.json, #3353) so a fresh sweep reproduces
    # the same assemblies and its pool identity is stable, and the trend store now holds
    # two rows measured over that pinned pool — the first pair a run can be compared
    # against. Before them every recorded row predated the pin, nothing was comparable,
    # and the ratchet would skip; a skip fails.
    #
    # Note what must NOT be done instead: merely omitting --ratchet-baseline selects the
    # historical perfection contract (invalid == 0), which this ~5,200-invalid corpus
    # cannot satisfy, so the job would fail every night and file a scheduled-failure
    # issue every time. Permanently red reports exactly as much as permanently green.
    # --integrity-only, which this lane carried until the bootstrap was crossed, claims
    # only that the measurement was sound and declines to judge quality at all.
    #
    # The integrity half still applies underneath the ratchet: unmatched rows, malformed
    # corpus rows, a non-closing partition, drift, unsupported targets, and unrecognized
    # outcomes all fail regardless of movement, because they mean the run measured less
    # than it claimed and a quality metric on such a run is meaningless. It also archives
    # the run JSON, which is the input to appending a trend-store row.
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 9 * * *') ||
      inputs.lane == 'authored-corpus' ||
      inputs.lane == 'all'
    runs-on: ubuntu-26.04
    # The complete lane measured 59 minutes on main. The budget stays deliberately
    # loose for restore and runner variance.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.100-rc.1.26425.128'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/*.slnx') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Build solution (tool + fixtures)
        run: dotnet build dotnet-inspect.slnx -c Release

      - name: Restore the vendored authored-source corpus
        run: bash eng/restore-authored-source-corpus.sh

      - name: Prepare the source-oracle assembly pool
        run: bash eng/prepare-authored-source-oracles.sh "$RUNNER_TEMP/source-oracle-assemblies.txt"

      - name: Run the whole-file source-oracle gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/deep-inspect
          mapfile -t oracle_assemblies < "$RUNNER_TEMP/source-oracle-assemblies.txt"
          dotnet run --project tools/DecompilerHarness -c Release -- \
            --benchmark-authored-corpus external/authored-source-corpus/oracle/corpus.jsonl \
            --source-oracle-manifest external/authored-source-corpus/oracle/manifest.json \
            --json "${oracle_assemblies[@]}" \
            > artifacts/deep-inspect/source-oracle-run.json

      - name: Prepare the EVIL assembly pool
        run: bash eng/prepare-evil-corpus.sh "$RUNNER_TEMP/evil-pool"

      - name: Run the authored-corpus benchmark (regression ratchet)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/deep-inspect
          mapfile -t assemblies < "$RUNNER_TEMP/evil-pool/assemblies.txt"
          dotnet run --project tools/DecompilerHarness -c Release -- \
            --benchmark-authored-corpus external/authored-source-corpus/evil/corpus.jsonl \
            --ratchet-baseline tools/DecompilerHarness/corpus/evil-runs/history.jsonl \
            --json "${assemblies[@]}" \
            > artifacts/deep-inspect/authored-corpus-run.json

      - name: Upload the run JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deep-inspect-authored-corpus
          path: |
            artifacts/deep-inspect/authored-corpus-run.json
            artifacts/deep-inspect/source-oracle-run.json
          if-no-files-found: warn
          overwrite: true

  report-scheduled-failure:
    name: Report scheduled failure
    # Deep Inspect has no interactive watcher, so a failed *scheduled* run would
    # otherwise go unnoticed. Open (or comment on) a tracking issue when any
    # scheduled slow lane fails. Manual dispatches are watched by the dispatcher
    # and are intentionally excluded.
    needs:
      - package-sweep
      - test
      - platform-test
      - decompiler-corpus
      - release-certification
      - inspect-web
      - census
      - authored-corpus-ratchet
    if: ${{ github.event_name == 'schedule' && failure() }}
    runs-on: ubuntu-26.04
    permissions:
      issues: write
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_LABEL: nightly-failure
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          title="Deep Inspect scheduled run failed"
          num=$(gh issue list --repo "${{ github.repository }}" \
            --state open --search "$title in:title" \
            --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$num" ]; then
            label_status=0
            if gh api --method POST \
              "repos/${{ github.repository }}/issues/$num/labels" \
              -f "labels[]=$ISSUE_LABEL" >/dev/null; then
              :
            else
              label_status=$?
            fi
            gh issue comment --repo "${{ github.repository }}" "$num" \
              --body "Another scheduled Deep Inspect run failed: $RUN_URL"
            if [ "$label_status" -ne 0 ]; then
              echo "::error::Failed to restore $ISSUE_LABEL on issue #$num"
              exit "$label_status"
            fi
          else
            gh issue create --repo "${{ github.repository }}" \
              --title "$title" \
              --label "$ISSUE_LABEL" \
              --body $'A scheduled Deep Inspect run failed.\n\nRun: '"$RUN_URL"$'\n\nThe failed lane(s) are visible on the run. This issue was opened automatically; it will not auto-close, so close it once the failure is triaged.'
          fi
