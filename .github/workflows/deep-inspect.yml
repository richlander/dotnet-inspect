name: Deep Inspect

on:
  workflow_dispatch:
    inputs:
      lane:
        description: 'Which opt-in lane to run'
        required: true
        default: test
        type: choice
        options:
          - test
          - census
          - package-sweep
          - authored-corpus
          - platform-test
          - nightly
          - all
  schedule:
    # Daily release certification: full slow tests, the decompiler corpus, and
    # Windows/macOS/latest-Ubuntu compatibility.
    - cron: '0 6 * * *'
    # Daily authored-corpus regression detection, separate from certification.
    - cron: '0 9 * * *'
    # Weekly discovery: current packages.
    - cron: '0 9 * * 1'

# Least privilege by default. Jobs needing more declare it themselves; a
# job-level block replaces this default rather than adding to it.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_INSPECT_TIPS: q

concurrency:
  group: deep-inspect-${{ github.ref }}-${{ github.event.schedule || inputs.lane }}
  cancel-in-progress: true

jobs:
  package-sweep:
    name: NuGet package discovery sweep
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 9 * * 1') ||
      inputs.lane == 'package-sweep'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-package-sweep-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/*.slnx') }}
          restore-keys: |
            nuget-package-sweep-${{ runner.os }}-${{ runner.arch }}-
            nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Build managed tool
        run: dotnet build src/dotnet-inspect -c Release -p:PublishAot=false

      - name: Prepare top-package slice
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/package-sweep
          # --resolve-latest on purpose: this lane is current-package discovery
          # evidence, so it wants what ships today, not the pinned pool the EVIL
          # corpus measures. The pin exists to make the corpus reproducible
          # (#3353); honoring it here would quietly turn discovery into a replay.
          dotnet run -p:NoWarn=NU1507 -p:NuGetAudit=false \
            eng/prepare-decompiler-package-sweep.cs -- \
            artifacts/package-sweep 1 10 --resolve-latest \
            | tee artifacts/package-sweep/acquisition.txt

      - name: Run bounded library report
        shell: bash
        run: |
          set -o pipefail
          mapfile -t assemblies < artifacts/package-sweep/assemblies.txt
          dotnet run --project tools/DecompilerHarness -c Release -- "${assemblies[@]}" \
            --library-report \
            --corpus-method-cap 250 \
            --compile-cap 25 \
            --top-patterns 25 \
            --max-examples 3 \
            | tee artifacts/package-sweep/report.md

      - name: Upload package sweep artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deep-inspect-package-sweep
          path: artifacts/package-sweep/
          if-no-files-found: warn

  test:
    name: Test lane
    # Runs daily to certify a releasable main commit, and on manual dispatch.
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 6 * * *') ||
      inputs.lane == 'test' ||
      inputs.lane == 'all'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/*.slnx') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Build solution (tool + fixtures)
        run: dotnet build dotnet-inspect.slnx -c Release

      - name: Install ilasm/ildasm
        id: iltools
        continue-on-error: true
        shell: bash
        run: eng/restore-iltools.sh --rid linux-x64 >> "$GITHUB_PATH"

      - name: Run CLI tests (including slow integration)
        run: dotnet run --project src/dotnet-inspect.Tests -c Release

      - name: Run decompiler tests (slow gates except the multi-hour corpus sweep)
        run: dotnet run --project src/ILInspector.Decompiler.Tests -c Release -- --gate no-corpus

      - name: Run analysis tests (including slow)
        run: dotnet run --project src/ILInspector.Analysis.Tests -c Release

      - name: Restore vendored ILAssembler
        run: bash eng/restore-ilassembler.sh

      - name: Run IL round-trip tests (including slow sweep)
        run: dotnet run --project tests/DotnetInspector.ILRoundtrip.Tests -c Release

      # Deliberately last: the suites above still report their results when
      # acquisition fails, but the lane must not go green after replacing its
      # oracle comparisons with skips.
      - name: Check ilasm/ildasm result
        if: steps.iltools.outcome != 'success'
        run: |
          echo "::error::Restoring ilasm/ildasm failed, so every test that uses them skipped." >&2
          echo "This lane cannot certify oracle-backed results. See the 'Install ilasm/ildasm' step." >&2
          exit 1

  platform-test:
    name: Platform test (${{ matrix.rid }})
    # The reduced platform suite runs daily rather than on every PR. Windows is
    # materially slower than Linux, and platform-specific failures should be
    # discovered by scheduled platform agents instead of holding the primary
    # development fleet. macOS and Ubuntu 26.04 run the same suite for
    # symmetric coverage across all three operating systems.
    #
    # The selected suites preserve the Windows-only failures recorded in
    # #3445, #3496, #3509, #3519, #3526, and #3542 plus path-sensitive
    # PluginDiscoveryTests. Slow decompiler gates, the corpus sensor, IL
    # round-trip, and packaging remain with their owning daily or release jobs.
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 6 * * *') ||
      inputs.lane == 'test' ||
      inputs.lane == 'platform-test' ||
      inputs.lane == 'all'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
          - os: ubuntu-26.04
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    # Windows has measured as high as 57 minutes (#4350). The initial macOS
    # lane gets the same larger budget until its runtime variance is known.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/*.slnx') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Build
        id: build
        run: dotnet build dotnet-inspect.slnx -c Release

      # GitHub's Windows image supplies Git Bash to workflow steps without
      # exposing it to child .NET processes. Publish its native path so the
      # activation tests invoke Git Bash rather than the WSL launcher.
      #
      # continue-on-error preserves the other platform results during a feed
      # outage. The terminal check below still makes lost oracle coverage red.
      - name: Install ilasm/ildasm/mdv
        id: iltools
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            printf 'ILTOOLS_BASH=%s\n' "$(cygpath -w "$(command -v bash)")" >> "$GITHUB_ENV"
          fi
          eng/restore-iltools.sh --rid ${{ matrix.rid }} --mdv --native-paths >> "$GITHUB_PATH"

      # Run every suite after a successful build even if an earlier suite
      # fails. Platform breaks commonly share one fixture-level cause, and
      # reporting every affected suite makes the scheduled failure actionable.
      - name: Run CLI tests (all)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project src/dotnet-inspect.Tests -c Release

      - name: Run CSharpText tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project tests/CSharpText.Tests -c Release

      - name: Run artifact contract tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project src/DotnetInspector.Artifacts.Tests -c Release

      - name: Run decompiler unit tests (fast)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project src/ILInspector.Decompiler.Tests -c Release -- -trait- "Speed=Slow"

      - name: Run NuGetFetch tests (offline)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project src/NuGetFetch.Tests -c Release -- -trait- "Network=Live"

      - name: Run metadata tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project tests/ILInspector.Metadata.Tests -c Release -- -longRunning 60

      - name: Run services tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project src/DotnetInspector.Services.Tests -c Release

      - name: Run query tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project src/DotnetInspector.Queries.Tests -c Release

      - name: Run Research tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project src/ILInspector.Research.Tests -c Release -- -failSkips

      - name: Check ilasm/ildasm/mdv result
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.iltools.outcome != 'success' }}
        shell: bash
        run: |
          echo "::error::Restoring ilasm/ildasm/mdv for ${{ matrix.rid }} failed or timed out, so oracle tests skipped." >&2
          echo "This lane cannot certify oracle-backed results. See the 'Install ilasm/ildasm/mdv' step." >&2
          exit 1

  decompiler-corpus:
    name: Decompiler corpus lane
    # Split out of the test lane so the multi-hour corpus sweep gets its own
    # 6h job budget instead of sharing the test job's budget with the other
    # slow gates (which previously pushed the combined job past its timeout).
    # Runs alongside the test lane for daily and on-demand certification.
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 6 * * *') ||
      inputs.lane == 'test' ||
      inputs.lane == 'all'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/*.slnx') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Build solution (tool + fixtures)
        run: dotnet build dotnet-inspect.slnx -c Release

      - name: Run decompiler corpus sweep
        run: dotnet run --project src/ILInspector.Decompiler.Tests -c Release -- --gate corpus

  release-certification:
    name: Release certification
    needs: [test, platform-test, decompiler-corpus]
    if: >-
      always() &&
      (
        (github.event_name == 'schedule' && github.event.schedule == '0 6 * * *') ||
        inputs.lane == 'test' ||
        inputs.lane == 'all'
      )
    runs-on: ubuntu-24.04
    steps:
      - name: Certify slow validation
        env:
          TEST_RESULT: ${{ needs.test.result }}
          PLATFORM_RESULT: ${{ needs.platform-test.result }}
          CORPUS_RESULT: ${{ needs.decompiler-corpus.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$TEST_RESULT" != success ] ||
             [ "$PLATFORM_RESULT" != success ] ||
             [ "$CORPUS_RESULT" != success ]; then
            echo "::error::Release certification requires successful test, platform-test, and decompiler-corpus jobs."
            echo "test=$TEST_RESULT platform-test=$PLATFORM_RESULT decompiler-corpus=$CORPUS_RESULT"
            exit 1
          fi
          echo "Release certification passed for $GITHUB_SHA"

  census:
    name: Census lane
    if: inputs.lane == 'census' || inputs.lane == 'all'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/*.slnx') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Build managed tool
        run: dotnet build src/dotnet-inspect -c Release -p:PublishAot=false

      - name: Prepare real-world corpus
        run: bash eng/prepare-decompiler-corpus.sh corpus-assemblies.txt

      - name: Run real-world corpus sensor
        shell: bash
        run: |
          mapfile -t assemblies < corpus-assemblies.txt
          mkdir -p artifacts/deep-inspect
          dotnet run --project tools/DecompilerHarness -c Release -- "${assemblies[@]}" \
            --emit-corpus-snapshot artifacts/deep-inspect/corpus-snapshot.json \
            --diff-corpus-baseline tools/DecompilerHarness/corpus/real-world-baseline.json \
            --compile-cap 4000 \
            --corpus-fidelity-cap 50 \
            --max-examples 3

      - name: Build classic state-machine corpus fixture
        run: dotnet build src/ILInspector.Decompiler.Fixtures.ClassicStateMachines -c Release

      - name: Run classic state-machine corpus sensor
        shell: bash
        run: |
          mkdir -p artifacts/deep-inspect
          dotnet run --project tools/DecompilerHarness -c Release -- \
            artifacts/bin/ILInspector.Decompiler.Fixtures.ClassicStateMachines/release/ILInspector.Decompiler.Fixtures.ClassicStateMachines.dll \
            --corpus-profile classic-state-machines \
            --emit-corpus-snapshot artifacts/deep-inspect/classic-state-machines-snapshot.json \
            --diff-corpus-baseline tools/DecompilerHarness/corpus/classic-state-machines-baseline.json \
            --max-examples 10

      - name: Run return-address equivalence census
        shell: bash
        run: |
          set -o pipefail
          mapfile -t assemblies < corpus-assemblies.txt
          mkdir -p artifacts/deep-inspect
          dotnet run --project tools/DecompilerHarness -c Release -- "${assemblies[@]}" \
            --emit-return-address-snapshot artifacts/deep-inspect/return-address-snapshot.json \
            --diff-return-address-baseline tools/DecompilerHarness/corpus/return-address-baseline.json \
            --max-examples 10 \
            2>&1 | tee artifacts/deep-inspect/return-address-census.txt

      - name: Run not-my-type equivalence census
        shell: bash
        run: |
          set -o pipefail
          mapfile -t assemblies < corpus-assemblies.txt
          mkdir -p artifacts/deep-inspect
          dotnet run --project tools/DecompilerHarness -c Release -- "${assemblies[@]}" \
            --emit-not-my-type-snapshot artifacts/deep-inspect/not-my-type-snapshot.json \
            --diff-not-my-type-baseline tools/DecompilerHarness/corpus/not-my-type-baseline.json \
            --max-examples 10 \
            2>&1 | tee artifacts/deep-inspect/not-my-type-census.txt

      - name: Run signature fuzzer
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/deep-inspect
          # Self-contained: generates adversarial signature blobs and drives them through
          # SignatureBlobGuard + a real SRM decode. A guard gap aborts the process; finishing is
          # the pass. Deterministic per seed, so a crash reproduces with --fuzz-seed.
          dotnet run --project tools/DecompilerHarness -c Release -- \
            --fuzz-signatures --fuzz-iterations 1000000 --fuzz-seed 1 --fuzz-log-every 50000 \
            2>&1 | tee artifacts/deep-inspect/signature-fuzz.txt

      - name: Run validity predicate scan
        shell: bash
        run: |
          set -o pipefail
          mapfile -t assemblies < corpus-assemblies.txt
          mkdir -p artifacts/deep-inspect
          dotnet run --project tools/DecompilerHarness -c Release -- "${assemblies[@]}" \
            --validity-predicate-scan \
            --max-examples 10 \
            | tee artifacts/deep-inspect/validity-predicate-scan.txt

      - name: Run uncapped validity sweep
        shell: bash
        run: |
          set -o pipefail
          mapfile -t assemblies < corpus-assemblies.txt
          mkdir -p artifacts/deep-inspect
          dotnet run --project tools/DecompilerHarness -c Release -- "${assemblies[@]}" \
            --validity-check \
            --compile-cap all \
            --max-examples 10 \
            | tee artifacts/deep-inspect/validity-check-uncapped.txt

      - name: Run assertion scan coverage report
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p artifacts/assertion-scan
          bash eng/prepare-decompiler-assertion-corpus.sh artifacts/assertion-scan/assemblies.txt
          mapfile -t assertion_assemblies < artifacts/assertion-scan/assemblies.txt
          set +e
          dotnet run --project tools/DecompilerHarness -c Release -- "${assertion_assemblies[@]}" \
            --assertion-scan \
            --assertion-fixture-guarantee \
            --max-examples 10 \
            | tee artifacts/assertion-scan/assertion-scan.txt
          status=${PIPESTATUS[0]}
          echo "$status" > artifacts/assertion-scan/exit-code.txt
          exit 0

      - name: Run analysis corpus sensor
        shell: bash
        run: |
          mkdir -p artifacts/analysis-census
          dotnet run --project tools/AnalysisHarness -c Release -- \
            --corpus-list corpus-assemblies.txt \
            --emit-corpus-snapshot artifacts/analysis-census/analysis-corpus-snapshot.json \
            --diff-corpus-baseline tools/AnalysisHarness/corpus/analysis-baseline.json

      - name: Run analysis paydirt recall
        run: |
          dotnet run --project tools/AnalysisHarness -c Release -- \
            --paydirt-recall artifacts/bin/ILInspector.Decompiler/release/ILInspector.Decompiler.dll \
            --reference tools/AnalysisHarness/corpus/paydirt-reference.json

      - name: Upload deep inspect artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deep-inspect-census
          path: |
            artifacts/deep-inspect/
            artifacts/assertion-scan/
            artifacts/analysis-census/
          if-no-files-found: warn

  nightly:
    name: Nightly SDK lane
    # Intentionally not included in "all": this lane uses daily SDK bits and is
    # for opt-in compiler/runtime validation before the next preview ships.
    if: inputs.lane == 'nightly'
    runs-on: ubuntu-26.04
    env:
      DOTNETUP_CHANNEL: 11.0-daily
      DOTNET_ROOT: ${{ github.workspace }}/.dotnet-nightly
      DOTNET_DOTNETUP_DATA_DIR: ${{ github.workspace }}/artifacts/.dotnetup
    steps:
      - uses: actions/checkout@v7

      - name: Install nightly .NET SDK with dotnetup
        shell: bash
        run: |
          set -euo pipefail

          dotnetup_dir="$RUNNER_TEMP/dotnetup"
          getter_script="$RUNNER_TEMP/get-dotnetup.sh"

          mkdir -p "$dotnetup_dir" "$DOTNET_ROOT" "$DOTNET_DOTNETUP_DATA_DIR"
          curl -fsSL --retry 3 https://aka.ms/dotnetup/get-dotnetup.sh -o "$getter_script"
          bash "$getter_script" --install-dir "$dotnetup_dir"

          "$dotnetup_dir/dotnetup" --version
          "$dotnetup_dir/dotnetup" sdk install "$DOTNETUP_CHANNEL" \
            --install-path "$DOTNET_ROOT" \
            --untracked \
            --set-default-install false \
            --interactive false
          pinned_sdk="$(bash eng/prepare-decompiler-opt-in-corpus.sh print-pinned-sdk)"
          "$dotnetup_dir/dotnetup" sdk install "$pinned_sdk" \
            --install-path "$DOTNET_ROOT" \
            --untracked \
            --set-default-install false \
            --interactive false

          echo "$dotnetup_dir" >> "$GITHUB_PATH"
          echo "$DOTNET_ROOT" >> "$GITHUB_PATH"
          "$DOTNET_ROOT/dotnet" --info

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-nightly-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/*.slnx') }}
          restore-keys: |
            nuget-nightly-${{ runner.os }}-${{ runner.arch }}-

      - name: Write nightly NuGet config
        shell: bash
        run: |
          set -euo pipefail

          nightly_nuget_config="$RUNNER_TEMP/NuGet.Config"
          echo "NIGHTLY_NUGET_CONFIG=$nightly_nuget_config" >> "$GITHUB_ENV"

          cat > "$nightly_nuget_config" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="dotnet11" value="https://dnceng.pkgs.visualstudio.com/public/_packaging/dotnet11/nuget/v3/index.json" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
            <packageSourceMapping>
              <!--
                These pack IDs must map to both sources. NuGet source mapping is
                package-ID based, not version-aware: net11 daily runtime/AOT/linker
                packs come from the dotnet11 feed, while net10 packs used by some
                fixture projects still come from nuget.org.
              -->
              <packageSource key="dotnet11">
                <package pattern="Microsoft.AspNetCore.App.*" />
                <package pattern="Microsoft.DotNet.ILCompiler" />
                <package pattern="Microsoft.NET.ILLink.Tasks" />
                <package pattern="Microsoft.NETCore.App.*" />
                <package pattern="runtime.*.Microsoft.DotNet.ILCompiler" />
              </packageSource>
              <packageSource key="nuget.org">
                <package pattern="*" />
                <package pattern="Microsoft.AspNetCore.App.*" />
                <package pattern="Microsoft.DotNet.ILCompiler" />
                <package pattern="Microsoft.NET.ILLink.Tasks" />
                <package pattern="Microsoft.NETCore.App.*" />
                <package pattern="runtime.*.Microsoft.DotNet.ILCompiler" />
              </packageSource>
            </packageSourceMapping>
          </configuration>
          EOF

      - name: Probe unsafe expression compiler support
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          check="$RUNNER_TEMP/unsafe-expression.cs"
          cat > "$check" <<'EOF'
          #:property LangVersion=preview
          #:property AllowUnsafeBlocks=true
          #:property Features=updated-memory-safety-rules

          int value = 42;
          nint address = (nint)unsafe(&value);
          System.Console.WriteLine(address != 0);
          EOF

          dotnet run "$check"

      - name: Restore with nightly package feeds
        run: dotnet restore dotnet-inspect.slnx --configfile "$NIGHTLY_NUGET_CONFIG"

      - name: Build with nightly SDK
        run: dotnet build dotnet-inspect.slnx -c Release --no-restore

      - name: Run unsafe decompiler tests with nightly SDK
        run: dotnet run --project src/ILInspector.Decompiler.Tests -c Release --no-restore -- -filter "/*/*/UnsafeEmitterTests/*"

      - name: Gate net11 opt-in feature corpus
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts/opt-in-corpus
          bash eng/prepare-decompiler-opt-in-corpus.sh \
            pinned artifacts/opt-in-corpus/pinned-assemblies.txt
          mapfile -t assemblies < artifacts/opt-in-corpus/pinned-assemblies.txt
          dotnet run --project tools/DecompilerHarness -c Release -- "${assemblies[@]}" \
            --corpus-profile opt-in-net11 \
            --emit-corpus-snapshot artifacts/opt-in-corpus/snapshot.json \
            --diff-corpus-baseline tools/DecompilerHarness/corpus/opt-in-net11-baseline.json \
            --quality-diff-card \
            --compile-cap 25 \
            --corpus-fidelity-cap 25 \
            --max-examples 3 \
            | tee artifacts/opt-in-corpus/quality-diff-card.md

      - name: Report opt-in compiler lowering drift
        shell: bash
        run: |
          set -o pipefail
          bash eng/report-decompiler-opt-in-corpus-drift.sh \
            | tee artifacts/opt-in-corpus/compiler-drift.md

      - name: Upload opt-in corpus artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deep-inspect-opt-in-corpus
          path: artifacts/opt-in-corpus/
          if-no-files-found: warn

  authored-corpus-ratchet:
    name: Authored-corpus ratchet lane
    # The first caller this benchmark has ever had. Before this job nothing ran it:
    # no workflow referenced it, so its exit code — the headline quality metric —
    # was never read by anything (#3245).
    #
    # This is a *periodic* gate, not a merge gate. The run needs the vendored EVIL
    # corpus (an orphan branch) plus a 100-package NuGet sweep, so it is far too
    # expensive for the PR lane.
    #
    # This lane passes --ratchet-baseline, which it could not do until now. The pool is
    # pinned (docs/data/nuget-top-packages.lock.json, #3353) so a fresh sweep reproduces
    # the same assemblies and its pool identity is stable, and the trend store now holds
    # two rows measured over that pinned pool — the first pair a run can be compared
    # against. Before them every recorded row predated the pin, nothing was comparable,
    # and the ratchet would skip; a skip fails.
    #
    # Note what must NOT be done instead: merely omitting --ratchet-baseline selects the
    # historical perfection contract (invalid == 0), which this ~5,200-invalid corpus
    # cannot satisfy, so the job would fail every night and file a scheduled-failure
    # issue every time. Permanently red reports exactly as much as permanently green.
    # --integrity-only, which this lane carried until the bootstrap was crossed, claims
    # only that the measurement was sound and declines to judge quality at all.
    #
    # The integrity half still applies underneath the ratchet: unmatched rows, malformed
    # corpus rows, a non-closing partition, drift, unsupported targets, and unrecognized
    # outcomes all fail regardless of movement, because they mean the run measured less
    # than it claimed and a quality metric on such a run is meaningless. It also archives
    # the run JSON, which is the input to appending a trend-store row.
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 9 * * *') ||
      inputs.lane == 'authored-corpus' ||
      inputs.lane == 'all'
    runs-on: ubuntu-26.04
    # The complete lane measured 59 minutes on main. The budget stays deliberately
    # loose for restore and runner variance.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/*.slnx') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Build solution (tool + fixtures)
        run: dotnet build dotnet-inspect.slnx -c Release

      - name: Restore the vendored authored-source corpus
        run: bash eng/restore-authored-source-corpus.sh

      - name: Prepare the source-oracle assembly pool
        run: bash eng/prepare-authored-source-oracles.sh "$RUNNER_TEMP/source-oracle-assemblies.txt"

      - name: Run the whole-file source-oracle gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/deep-inspect
          mapfile -t oracle_assemblies < "$RUNNER_TEMP/source-oracle-assemblies.txt"
          dotnet run --project tools/DecompilerHarness -c Release -- \
            --benchmark-authored-corpus external/authored-source-corpus/oracle/corpus.jsonl \
            --source-oracle-manifest external/authored-source-corpus/oracle/manifest.json \
            --json "${oracle_assemblies[@]}" \
            > artifacts/deep-inspect/source-oracle-run.json

      - name: Prepare the EVIL assembly pool
        run: bash eng/prepare-evil-corpus.sh "$RUNNER_TEMP/evil-pool"

      - name: Run the authored-corpus benchmark (regression ratchet)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/deep-inspect
          mapfile -t assemblies < "$RUNNER_TEMP/evil-pool/assemblies.txt"
          dotnet run --project tools/DecompilerHarness -c Release -- \
            --benchmark-authored-corpus external/authored-source-corpus/evil/corpus.jsonl \
            --ratchet-baseline tools/DecompilerHarness/corpus/evil-runs/history.jsonl \
            --json "${assemblies[@]}" \
            > artifacts/deep-inspect/authored-corpus-run.json

      - name: Upload the run JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deep-inspect-authored-corpus
          path: |
            artifacts/deep-inspect/authored-corpus-run.json
            artifacts/deep-inspect/source-oracle-run.json
          if-no-files-found: warn

  report-scheduled-failure:
    name: Report scheduled failure
    # Deep Inspect has no interactive watcher, so a failed *scheduled* run would
    # otherwise go unnoticed. Open (or comment on) a tracking issue when any
    # scheduled slow lane fails. Manual dispatches are watched by the dispatcher
    # and are intentionally excluded.
    needs:
      - package-sweep
      - test
      - platform-test
      - decompiler-corpus
      - release-certification
      - authored-corpus-ratchet
    if: ${{ github.event_name == 'schedule' && failure() }}
    runs-on: ubuntu-26.04
    permissions:
      issues: write
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          title="Deep Inspect scheduled run failed"
          num=$(gh issue list --repo "${{ github.repository }}" \
            --state open --search "$title in:title" \
            --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$num" ]; then
            gh issue comment --repo "${{ github.repository }}" "$num" \
              --body "Another scheduled Deep Inspect run failed: $RUN_URL"
          else
            gh issue create --repo "${{ github.repository }}" \
              --title "$title" \
              --body $'A scheduled Deep Inspect run failed.\n\nRun: '"$RUN_URL"$'\n\nThe failed lane(s) are visible on the run. This issue was opened automatically; it will not auto-close, so close it once the failure is triaged.'
          fi
