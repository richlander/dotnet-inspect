name: Build and Release

on:
  push:
    branches: [main, release]
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Detect what changed to determine which jobs to run
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - '*.props'
              - '*.sln'
              - '.github/workflows/**'
            docs:
              - '**/*.md'
              - 'docs/**'

  # Lint markdown files
  markdownlint:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: '**/*.md'

  # Build the pointer package (once, on any platform)
  build-pointer:
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      
      - name: Build
        run: dotnet build src/dotnet-inspect -c Release
      
      - name: Run unit tests
        run: dotnet test src/dotnet-inspect.Tests -c Release --no-build
      
      - name: Pack pointer package
        run: dotnet pack src/dotnet-inspect -c Release -p:OfficialBuild=true
      
      - name: Upload pointer package
        uses: actions/upload-artifact@v4
        with:
          name: package-pointer
          path: artifacts/package/release/*.nupkg
          if-no-files-found: error

  # Build RID-specific Native AOT packages
  build-rid:
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.ref == 'refs/heads/release'
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            aot: true
          - rid: win-arm64
            os: windows-latest
            aot: true
          - rid: linux-x64
            os: ubuntu-latest
            aot: true
          - rid: linux-arm64
            os: ubuntu-24.04-arm
            aot: true
          - rid: osx-arm64
            os: macos-latest
            aot: true
          - rid: any
            os: ubuntu-latest
            aot: false
    
    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      
      - name: Pack RID-specific package
        run: dotnet pack src/dotnet-inspect -c Release -r ${{ matrix.rid }} -p:PublishAot=${{ matrix.aot }} -p:OfficialBuild=true
      
      - name: Upload RID package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.rid }}
          path: artifacts/package/release/*.nupkg
          if-no-files-found: error

  # Smoke test installed tool on each platform
  smoke-test:
    needs: [changes, build-pointer, build-rid]
    if: needs.changes.outputs.code == 'true' || github.ref == 'refs/heads/release'
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-24.04-arm
          - rid: osx-arm64
            os: macos-latest
    
    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: packages
          pattern: package-*
          merge-multiple: true
      
      - name: List packages
        run: ls -la packages/
        shell: bash
      
      - name: Install tool from local packages
        run: dotnet tool install --global dotnet-inspect --add-source ./packages --no-cache
      
      - name: Smoke test - version
        run: |
          OUTPUT=$(dotnet-inspect --version)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'
        shell: bash
      
      - name: Smoke test - help
        run: |
          OUTPUT=$(dotnet-inspect --help)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "dotnet-inspect"
        shell: bash
      
      - name: Smoke test - package info
        run: |
          dotnet-inspect System.Text.Json 10.0.0 -v:q > smoke-package.md
          cat smoke-package.md
          grep -q "System.Text.Json" smoke-package.md
          grep -q "Library" smoke-package.md
        shell: bash
      
      - name: Smoke test - api command
        run: |
          dotnet-inspect api JsonSerializer --package System.Text.Json@10.0.0 -n 5 > smoke-api.md
          cat smoke-api.md
          grep -q "JsonSerializer" smoke-api.md
          grep -q "Serialize" smoke-api.md
          grep -q "Deserialize" smoke-api.md
        shell: bash
      
      - name: Smoke test - platform command
        run: |
          dotnet-inspect platform > smoke-platform.md
          cat smoke-platform.md
          grep -q "runtime" smoke-platform.md
        shell: bash
      
      - name: Validate markdown output
        run: |
          npm install -g markdownlint-cli2
          # Use relaxed rules for tool output (bare URLs, list spacing, table alignment are OK)
          echo '{"MD013":false,"MD032":false,"MD034":false,"MD060":false}' > .markdownlint-cli2.jsonc
          markdownlint-cli2 smoke-*.md
        shell: bash
      
      - name: Uninstall tool
        run: dotnet tool uninstall --global dotnet-inspect

  # Publish to NuGet (only on release branch, after all tests pass)
  publish:
    if: github.ref == 'refs/heads/release'
    needs: [smoke-test]
    runs-on: ubuntu-latest
    environment: nuget-publish
    
    steps:
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: packages
          pattern: package-*
          merge-multiple: true
      
      - name: List packages
        run: ls -la packages/
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      
      # Publish RID-specific packages first, then pointer package last
      - name: Publish packages
        run: |
          # Publish RID-specific packages first (any package with a RID in the name)
          for pkg in packages/dotnet-inspect.win-*.nupkg packages/dotnet-inspect.linux-*.nupkg packages/dotnet-inspect.osx-*.nupkg packages/dotnet-inspect.any.*.nupkg; do
            if [[ -f "$pkg" ]]; then
              echo "Publishing $pkg"
              dotnet nuget push "$pkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
            fi
          done
          
          # Publish pointer package last (the one without a RID, just version number)
          for pkg in packages/dotnet-inspect.[0-9]*.nupkg; do
            if [[ -f "$pkg" ]]; then
              echo "Publishing pointer package: $pkg"
              dotnet nuget push "$pkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
            fi
          done
        shell: bash

  # Create GitHub Release (on release branch after publishing)
  release:
    if: github.ref == 'refs/heads/release'
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Get version
        id: version
        run: |
          VERSION=$(grep -oP '(?<=<VersionPrefix>)[^<]+' src/dotnet-inspect/dotnet-inspect.csproj)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: packages
          pattern: package-*
          merge-multiple: true
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: packages/*.nupkg
          generate_release_notes: true
