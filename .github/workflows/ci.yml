          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Build IL Diff harness and fixtures
        run: |
          dotnet build tools/IlDiffHarness/IlDiffHarness.csproj -c Release
          dotnet build src/DiffFixtures.V1/DiffFixtures.V1.csproj -c Release
          dotnet build src/DiffFixtures.V2/DiffFixtures.V2.csproj -c Release

      - name: Run IL Diff baseline smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/il-diff-smoke
          old=artifacts/bin/DiffFixtures.V1/release/DiffFixtureSample.dll
          new=artifacts/bin/DiffFixtures.V2/release/DiffFixtureSample.dll

          dotnet run --project tools/IlDiffHarness -c Release --no-build -- \
            "$old" "$new" \
            --emit-snapshot artifacts/il-diff-smoke/snapshot.json \
            --format jsonl \
            --max-examples 0 \
            > artifacts/il-diff-smoke/snapshot.jsonl

          dotnet run --project tools/IlDiffHarness -c Release --no-build -- \
            "$old" "$new" \
            --diff-baseline artifacts/il-diff-smoke/snapshot.json \
            --format jsonl \
            --max-examples 0 \
            > artifacts/il-diff-smoke/exact.jsonl

          cat > /tmp/il-diff-mutate-baseline.cs <<'CS'
          using System.Text.Json.Nodes;
          var node = JsonNode.Parse(File.ReadAllText(args[0]))!.AsObject();
          node["Summary"]!["FailureCount"] = 0;
          node["FailureBuckets"] = new JsonArray();
          File.WriteAllText(args[1], node.ToJsonString(new System.Text.Json.JsonSerializerOptions { WriteIndented = true }) + Environment.NewLine);
          CS
          dotnet run /tmp/il-diff-mutate-baseline.cs -- \
            artifacts/il-diff-smoke/snapshot.json \
            artifacts/il-diff-smoke/regression-baseline.json

          set +e
          dotnet run --project tools/IlDiffHarness -c Release --no-build -- \
            "$old" "$new" \
            --diff-baseline artifacts/il-diff-smoke/regression-baseline.json \
            --format jsonl \
            --max-examples 0 \
            > artifacts/il-diff-smoke/regression.jsonl
          status=$?
          set -e
          test "$status" -eq 1

          cat > /tmp/il-diff-parse-jsonl.cs <<'CS'
          using System.Text.Json;
          foreach (var path in args)
          {
              foreach (var line in File.ReadLines(path))
              {
                  if (string.IsNullOrWhiteSpace(line))
                      continue;
                  JsonDocument.Parse(line).Dispose();
              }
          }
          CS
          dotnet run /tmp/il-diff-parse-jsonl.cs -- \
            artifacts/il-diff-smoke/snapshot.jsonl \
            artifacts/il-diff-smoke/exact.jsonl \
            artifacts/il-diff-smoke/regression.jsonl

      - name: Upload IL Diff smoke artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: il-diff-smoke
          path: artifacts/il-diff-smoke/
          if-no-files-found: warn

  # Pack and smoke test on Ubuntu. This is a packaging smoke test only: it
  # validates the pointer package, the any fallback, one RID-specific AOT pack,
  # and local tool install/smoke. It is NOT the source of release artifacts
  # (release.yml builds those itself at publish time), so it runs only on PRs
  # that touch build/packaging configuration. Most PRs (e.g. decompiler raises)
  # skip it, which removes packaging work from the hot PR path.
  pack:
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).validations.pack
    runs-on: ubuntu-26.04
    env:
      DOTNET_INSPECT_TIPS: q
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Pack pointer package
        # SelfContained=true forces the pack TFM segment to 'any', so the pointer
        # manifest lands at tools/any/any/DotnetToolSettings.xml instead of
        # tools/netX.0/any/. This makes the pointer TFM-agnostic: any SDK that
        # understands RID-specific tools can read it, regardless of TFM. The
        # pointer carries no implementation, so SelfContained pulls in no runtime.
        # RID-specific packages are built by their dedicated steps; disabling
        # inner RID packs keeps this step pointer-only on .NET 11 Preview 7+.
        run: dotnet pack src/dotnet-inspect -c Release -p:SelfContained=true -p:OfficialBuild=true -p:CreateRidSpecificToolPackages=false

      - name: Upload pointer package
        uses: actions/upload-artifact@v7
        with:
          name: package-pointer
          path: artifacts/package/release/*.nupkg
          if-no-files-found: error

      - name: Pack any (non-AOT) package
        # TFM is pinned to net10.0 structurally via Directory.Build.props
        # (OfficialBuild + non-AOT) so this fallback stays installable on the LTS
        # runtime even though dev/AOT builds use the latest runtime. See issue #240.
        run: dotnet pack src/dotnet-inspect -c Release -r any -p:PublishAot=false -p:OfficialBuild=true

      - name: Upload any package
        uses: actions/upload-artifact@v7
        with:
          name: package-any
          path: artifacts/package/release/*.nupkg
          if-no-files-found: error

      - name: Pack linux-x64 AOT package
        run: dotnet pack src/dotnet-inspect -c Release -r linux-x64 -p:OfficialAotBuild=true

      - name: Upload linux-x64 package
        uses: actions/upload-artifact@v7
        with:
          name: package-linux-x64
          path: artifacts/package/release/*.nupkg
          if-no-files-found: error

      - name: Install tool from local packages
        run: dotnet tool install --global dotnet-inspect --source ./artifacts/package/release --no-cache

      - name: Smoke test - version
        run: |
          OUTPUT=$(dotnet-inspect --version)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'

      - name: Smoke test - help
        run: |
          OUTPUT=$(dotnet-inspect --help)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "dotnet-inspect"

      - name: Smoke test - package quiet
        run: |
          dotnet-inspect package System.Text.Json@10.0.0 -v:q > smoke-package.md
          cat smoke-package.md
          grep -q "System.Text.Json" smoke-package.md
          grep -q "Library" smoke-package.md

      - name: Smoke test - package normal
        run: |
          dotnet-inspect package System.Text.Json@10.0.0 -v:n > smoke-package-normal.md
          cat smoke-package-normal.md
          grep -q "## Package Info" smoke-package-normal.md
          grep -q "## Dependencies" smoke-package-normal.md
          grep -q "Library" smoke-package-normal.md

      - name: Smoke test - type command (table output)
        run: |
          dotnet-inspect type --package System.Text.Json@10.0.0 -t JsonSerializer --table > smoke-type.txt
          cat smoke-type.txt
          grep -q "JsonSerializer" smoke-type.txt

      - name: Smoke test - member command (table output)
        run: |
          dotnet-inspect member JsonSerializer --package System.Text.Json@10.0.0 -m Serialize --table > smoke-member.txt
          cat smoke-member.txt
          grep -q "Serialize" smoke-member.txt

      - name: Smoke test - type command (markdown)
        run: |
          dotnet-inspect type --package System.Text.Json@10.0.0 -v:m -t JsonSerializer > smoke-type.md
          cat smoke-type.md
          grep -q "JsonSerializer" smoke-type.md

      - name: Smoke test - member command (markdown)
        run: |
          dotnet-inspect member JsonSerializer --package System.Text.Json@10.0.0 -v:m -m Serialize > smoke-member.md
          cat smoke-member.md
          grep -q "JsonSerializer" smoke-member.md
          grep -q "Serialize" smoke-member.md

      - name: Smoke test - platform library
        run: |
          dotnet-inspect library System.Private.CoreLib -v:q --json > smoke-platform.json
          cat smoke-platform.json
          jq -e '
            .source == "Platform"
            and .assembly_info.assembly_name == "System.Private.CoreLib"
          ' smoke-platform.json > /dev/null

      - name: Validate markdown output
        run: |
          npm install -g markdownlint-cli
          markdownlint --config .markdownlint.yaml smoke-*.md

      - name: Uninstall tool
        run: dotnet tool uninstall --global dotnet-inspect

  # The one check the `main` ruleset is meant to require, and the only one that
  # safely can be.
  #
  # Every other job here is path-gated, so none of them can be required
  # directly: a required check that does not run on a given PR is reported as
  # "Expected" forever and blocks the merge permanently. This job always runs
  # and collapses the others into one result, so the ruleset has exactly one
  # stable context to name.
  #
  # Adding the `required_status_checks` rule is a repository-settings change
  # applied once this job exists on `main`; requiring it earlier would block
  # every open PR with no way forward.
  #
  # Three details carry the whole contract, and each is easy to get backwards:
  #
  # 1. `if: always()` is mandatory. Without it this job inherits the default
  #    `success()` condition, is skipped the moment any dependency fails, and a
  #    skipped required check does not block a merge -- the failure it exists to
  #    catch would be exactly what silences it.
  #
  # 2. `skipped` must pass for path-gated jobs but not for `changes`, and
  #    `cancelled` must never pass. Path-gated jobs are skipped on most PRs and
  #    that is correct. `changes` supplies every gate, so skipping it silently
  #    skips the entire matrix. A cancelled job is a job that hit its timeout,
  #    and this repository has already been burned by that distinction twice:
  #    the Deep Inspect notifier stayed silent because a cancelled job satisfies
  #    neither `failure()` nor a failed conclusion (#3432), and seven decompiler
  #    test classes sat at a 45-minute timeout unnoticed (#3489-#3493).
  #
  # 3. The check is an allow list, not a deny list. Only `success` and `skipped`
  #    pass for path-gated jobs; only `success` passes for `changes`. Anything
  #    else blocks. A deny list of `failure|cancelled` would admit any result
  #    state GitHub adds later, which is the fail-open direction.
  #
  # `changes` is in `needs` deliberately. If it fails, every downstream job is
  # skipped, so a check that looked only at the gated jobs would see nothing but
  # `skipped` and pass a PR on which no test ran at all. `changes` reporting
  # `failure` or `skipped` is what closes that path.
  #
  # Like `changes`, this always-run terminal gate uses the GA image so preview
  # capacity cannot leave an otherwise-complete PR waiting for its required
  # status. Path-gated jobs retain ubuntu-26.04 coverage.
  ci-required:
    needs:
      - changes
      - markdownlint
      - inspect-web
      - skill-gate
      - test
      - tla-plus
      # Path-gated jobs report `skipped` when their input class is absent; all
      # expensive jobs except inspect-web also skip on pushes to main. That
      # passes the gate by design; the allow list below distinguishes
      # "correctly not run" from "ran and failed".
      - build-net10
      - decompiler-gates
      - csharp-diff-smoke
      - il-diff-smoke
      - pack
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      # Defined once and consumed by both the self-test and the real check, so
      # the thing proven non-vacuous is the same thing that gates the merge.
      RESULT_FILTER: >-
        to_entries[]
        | select(
            (.key == "changes" and .value.result != "success")
            or
            (.key != "changes"
              and .value.result != "success"
              and .value.result != "skipped")
          )
        | "\(.key)=\(.value.result)"
    steps:
      - uses: actions/checkout@v6

      # A hand-maintained `needs` list is an allow list, and an allow list that
      # nothing checks goes stale silently: add a job to this workflow, forget
      # this line, and the merge gate stops covering it while still reporting
      # green. That is the same shape as #3584, where a one-directional docket
      # un-gated 46 fixture rows. So the workflow's own job list drives the
      # required set, and both directions fail -- a job missing from `needs`
      # and a `needs` entry naming a job that no longer exists.
      - name: Verify this gate depends on every other job
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          python3 -I -c '
          import json, os, sys, yaml
          with open(".github/workflows/ci.yml") as f:
              workflow = yaml.safe_load(f)
          jobs = set(workflow["jobs"])
          jobs.discard("ci-required")
          needs = set(json.loads(os.environ["NEEDS"]))
          missing = sorted(jobs - needs)
          extra = sorted(needs - jobs)
          forbidden = sorted(
              key for key in (
                  "if",
                  "continue-on-error",
                  "defaults",
                  "env",
                  "container",
                  "strategy")
              if key in workflow["jobs"]["changes"])
          self_tests = [
              step for step in workflow["jobs"]["changes"].get("steps", [])
              if isinstance(step, dict)
              and step.get("name") == "Self-test change detection"
          ]
          self_test_errors = []
          if len(self_tests) != 1:
              self_test_errors.append(
                  "expected one Self-test change detection step, "
                  f"found {len(self_tests)}")
          else:
              self_test = self_tests[0]
              if self_test.get("run") != "dotnet run eng/test-ci-change-detection.cs":
                  self_test_errors.append(
                      "Self-test change detection must run the C# gate")
              if self_test.get("shell") != "bash":
                  self_test_errors.append(
                      "Self-test change detection must use shell: bash")
              expected_env = {"BASH_ENV": ""}
              if self_test.get("env") != expected_env:
                  self_test_errors.append(
                      "Self-test change detection must clear only BASH_ENV")
              forbidden_step = sorted(
                  key for key in (
                      "if",
                      "continue-on-error",
                      "working-directory")
                  if key in self_test)
              if forbidden_step:
                  self_test_errors.append(
                      "Self-test change detection must not declare: "
                      + ", ".join(forbidden_step))
          if missing:
              print("::error::ci-required does not depend on: " + ", ".join(missing))
          if extra:
              print("::error::ci-required depends on unknown jobs: " + ", ".join(extra))
          if forbidden:
              print("::error::changes job must not declare: " + ", ".join(forbidden))
          for error in self_test_errors:
              print("::error::" + error)
          sys.exit(
              1 if missing or extra or forbidden or self_test_errors else 0)
          '
          echo "Gate covers every job in the workflow."

      # A gate that accepted everything would be indistinguishable from a green
      # run, so the filter's discrimination is asserted rather than assumed.
      # This is that assertion: if the filter stops selecting bad results, this
      # step fails even when every real job is green.
      - name: Self-test the result filter
        shell: bash
        run: |
          set -euo pipefail
          probe='{"changes":{"result":"skipped"},"ok":{"result":"success"},"gated":{"result":"skipped"},"broke":{"result":"failure"},"timeout":{"result":"cancelled"},"future":{"result":"neutral"}}'
          got=$(printf '%s' "$probe" | jq -r "$RESULT_FILTER" | paste -sd, -)
          expected='changes=skipped,broke=failure,timeout=cancelled,future=neutral'
          if [ "$got" != "$expected" ]; then
            echo "::error::Result filter no longer discriminates. Expected [$expected], got [$got]."
            exit 1
          fi
          echo "Filter discriminates correctly: [$got]"

      - name: Verify no required job failed or was cancelled
        shell: bash
        env:
          # Passed through the environment rather than interpolated into the
          # script body so job outputs can never terminate the shell string.
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS"
          blocking=$(printf '%s' "$NEEDS" | jq -r "$RESULT_FILTER")
          if [ -n "$blocking" ]; then
            echo "::error::CI is not green; these jobs did not succeed or skip:"
            printf '%s\n' "$blocking"
            exit 1
          fi
          echo "All required jobs succeeded or were correctly skipped."
