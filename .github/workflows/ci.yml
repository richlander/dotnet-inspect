name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

# Cancel superseded PR runs (e.g. when an agent pushes again to the same branch)
# so only the latest commit of a PR consumes a full CI run. Pushes to main are
# not cancelled, but they only run the lightweight changes/markdownlint legs
# (test/pack are PR-only), so there is little to cancel. release.yml
# builds all release packages fresh at publish time and does not consume CI
# artifacts.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Detect what changed to determine which jobs to run
  changes:
    runs-on: ubuntu-26.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
      csharpdiff: ${{ steps.filter.outputs.csharpdiff }}
      decompiler: ${{ steps.filter.outputs.decompiler }}
      docs: ${{ steps.filter.outputs.docs }}
      ildiff: ${{ steps.filter.outputs.ildiff }}
      ilroundtrip: ${{ steps.filter.outputs.ilroundtrip }}
      packaging: ${{ steps.filter.outputs.packaging }}
      shipped: ${{ steps.filter.outputs.shipped }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Detect changes
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=$(gh pr diff ${{ github.event.pull_request.number }} --name-only)
          else
            BEFORE=${{ github.event.before }}
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              BEFORE=HEAD~1
            fi
            FILES=$(git diff --name-only "$BEFORE"..."${{ github.sha }}")
          fi
          CODE=false
          CSHARPDIFF=false
          DECOMPILER=false
          DOCS=false
          ILDIFF=false
          ILROUNDTRIP=false
          PACKAGING=false
          SHIPPED=false
          while IFS= read -r file; do
            case "$file" in
              src/*) CODE=true ;;
              tests/*) CODE=true ;;
              tools/DecompilerHarness/*.md|tools/DecompilerHarness/*.txt) ;;
              tools/DecompilerHarness/*) CODE=true ;;
              eng/prepare-decompiler-assertion-corpus.sh) CODE=true ;;
              eng/prepare-decompiler-corpus.sh) CODE=true ;;
              eng/prepare-decompiler-opt-in-corpus.sh) CODE=true ;;
              eng/prepare-decompiler-pr-corpus.sh) CODE=true ;;
              eng/report-decompiler-opt-in-corpus-drift.sh) CODE=true ;;
              *.props|*.targets|*.sln|*.slnx) CODE=true ;;
              .github/workflows/*) CODE=true ;;
            esac
            # C# Diff smoke coverage is separate from the full test lane for the
            # same reason as IL Diff: CSharpDiffHarness-only changes get a
            # focused card/snapshot smoke instead of the entire test suite.
            case "$file" in
              tools/CSharpDiffHarness/*) CSHARPDIFF=true ;;
              src/ILInspector.Decompiler/*) CSHARPDIFF=true ;;
              src/ILInspector.Instructions/*) CSHARPDIFF=true ;;
              src/ILInspector.ControlFlow/*) CSHARPDIFF=true ;;
              src/DiffFixtures.V1/*) CSHARPDIFF=true ;;
              src/DiffFixtures.V2/*) CSHARPDIFF=true ;;
              tools/DiffHarnessCommon/*) CSHARPDIFF=true ;;
              Directory.Packages.props) CSHARPDIFF=true ;;
              *.props|*.targets|*.slnx) CSHARPDIFF=true ;;
              .github/workflows/ci.yml) CSHARPDIFF=true ;;
            esac
            # IL Diff smoke coverage is intentionally separate from the full
            # test lane: most PRs skip it, and IlDiffHarness-only changes get a
            # cheap targeted build/smoke instead of the whole test suite.
            case "$file" in
              tools/IlDiffHarness/*) ILDIFF=true ;;
              src/ILInspector.Instructions/*) ILDIFF=true ;;
              src/ILInspector.ControlFlow/*) ILDIFF=true ;;
              src/DiffFixtures.V1/*) ILDIFF=true ;;
              src/DiffFixtures.V2/*) ILDIFF=true ;;
              tools/DiffHarnessCommon/*) ILDIFF=true ;;
              Directory.Packages.props) ILDIFF=true ;;
              *.props|*.targets|*.slnx) ILDIFF=true ;;
              .github/workflows/ci.yml) ILDIFF=true ;;
            esac
            case "$file" in
              *.md|*.txt|docs/*|skills/*) DOCS=true ;;
            esac
            # The decompiler docket/byte-neutrality gates cost ~8 minutes, so
            # they run as their own job rather than in the hot `test` lane.
            #
            # This filter is deliberately broad. The first version enumerated
            # the decompiler projects, and review found it already wrong: it
            # missed ILInspector.Decompiler.Fixtures.* (the assemblies the
            # gates decompile), tools/RoundTripCompilation (the compile-back
            # harness), DiffFixtures.V*, and transitive substrate such as
            # ILInspector.MetadataPrimitives, ILInspector.Findings, and
            # ILInspector.Text. A fidelity result is a whole-pipeline
            # observation, so its true input set is the test project's
            # transitive closure, which an enumerated list cannot track without
            # rotting. Under-triggering silently disables the gate on exactly
            # the changes it exists to catch; over-triggering costs a parallel
            # job that never blocks the hot lane. Prefer the cheap error. The
            # documentation-extension arm covers only `*.md`, deliberately: a
            # `.txt` or `.jsonl` under these trees can be a corpus or baseline
            # fixture, and excluding it by extension would silently un-gate it.
            # `global.json` and `nuget.config` select the SDK and package
            # inputs, which select the compiler, which selects the IL compared.
            case "$file" in
              eng/check-decompiler-gate.cs) DECOMPILER=true ;;
              eng/decompiler-gate-known-red.txt) DECOMPILER=true ;;
              eng/decompiler-gate-expected-classes.txt) DECOMPILER=true ;;
              *.md) ;;
              src/*) DECOMPILER=true ;;
              tests/*) DECOMPILER=true ;;
              tools/*) DECOMPILER=true ;;
              global.json|nuget.config|NuGet.config|NuGet.Config) DECOMPILER=true ;;
              *.props|*.targets|*.slnx) DECOMPILER=true ;;
              .github/workflows/ci.yml) DECOMPILER=true ;;
            esac
            # The IL round-trip oracle has a fast PR subset plus a slow assembly
            # sweep. It depends on ILInspector.Metadata ->
            # { DotnetInspector.Core, ILInspector.MetadataPrimitives } plus the
            # vendored ILAssembler restore script and the test project itself.
            case "$file" in
              tests/DotnetInspector.ILRoundtrip.Tests/*) ILROUNDTRIP=true ;;
              eng/restore-ilassembler.sh) ILROUNDTRIP=true ;;
              src/ILInspector.Metadata*) ILROUNDTRIP=true ;;
              src/DotnetInspector.Core/*) ILROUNDTRIP=true ;;
              *.props|*.targets|*.sln|*.slnx) ILROUNDTRIP=true ;;
            esac
            # Packaging/pack-smoke validation only needs to run when something
            # that affects the *packaged* tool changes. The pack job runs
            # `dotnet pack src/dotnet-inspect`, so the output is determined by
            # that project's csproj plus shared build infra (root + src build
            # props/targets, global.json/nuget config) and the pack workflow
            # itself. Test/harness csproj changes and unrelated workflow edits
            # don't affect the package, so they must not trip this. Most PRs
            # (e.g. decompiler raises) touch none of these, keeping pack off the
            # hot PR path. The pack job is a PR-only packaging smoke test and
            # never produces release artifacts: release.yml builds all packages
            # fresh at publish time from the resolved commit SHA.
            case "$file" in
              src/dotnet-inspect/dotnet-inspect.csproj) PACKAGING=true ;;
              Directory.Build.props|Directory.Build.targets|Directory.Packages.props) PACKAGING=true ;;
              src/Directory.Build.props) PACKAGING=true ;;
              global.json|nuget.config|NuGet.config) PACKAGING=true ;;
              .github/workflows/ci.yml|.github/workflows/release.yml) PACKAGING=true ;;
            esac
            # net10.0 fallback build coverage. The shipped tool graph
            # (src/dotnet-inspect + its product library references) must compile
            # against the net10.0 LTS floor of the official "any" package, but
            # the full test lane builds net11 only. Fire on shipped source (any
            # non-test, non-fixture src/ project) and shared build infra; test
            # projects, fixtures, harnesses, and docs can't introduce a
            # net11-only API into the shipped tool, so they don't trip this.
            case "$file" in
              src/*Tests/*) ;;
              src/*Fixtures*/*|src/DiffFixtures*/*) ;;
              src/*) SHIPPED=true ;;
              Directory.Build.props|Directory.Build.targets|Directory.Packages.props) SHIPPED=true ;;
              src/Directory.Build.props) SHIPPED=true ;;
              global.json|nuget.config|NuGet.config) SHIPPED=true ;;
              .github/workflows/ci.yml) SHIPPED=true ;;
            esac
          done <<< "$FILES"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "csharpdiff=$CSHARPDIFF" >> "$GITHUB_OUTPUT"
          echo "decompiler=$DECOMPILER" >> "$GITHUB_OUTPUT"
          echo "docs=$DOCS" >> "$GITHUB_OUTPUT"
          echo "ildiff=$ILDIFF" >> "$GITHUB_OUTPUT"
          echo "ilroundtrip=$ILROUNDTRIP" >> "$GITHUB_OUTPUT"
          echo "packaging=$PACKAGING" >> "$GITHUB_OUTPUT"
          echo "shipped=$SHIPPED" >> "$GITHUB_OUTPUT"
          echo "Changed files:"
          echo "$FILES"
          echo "code=$CODE csharpdiff=$CSHARPDIFF decompiler=$DECOMPILER docs=$DOCS ildiff=$ILDIFF ilroundtrip=$ILROUNDTRIP packaging=$PACKAGING shipped=$SHIPPED"
        env:
          GH_TOKEN: ${{ github.token }}

  # Lint markdown files
  markdownlint:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: '**/*.md'

  # Build and test on Ubuntu only. Windows/macOS coverage was moved to the
  # Publish workflow to cut Actions minutes (those runners bill at higher
  # multipliers). This trades per-PR cross-platform test coverage for cost.
  #
  # Runs on PRs only. A pull_request build validates the PR merged into the
  # current base, so re-running the full test suite on the push to main is
  # redundant; we skip it there to cut Actions minutes (the test job is the
  # most expensive leg) and to reduce queued-job contention when many agents
  # have PRs in flight at once. Release packages are built by release.yml at
  # publish time, not here.
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_INSPECT_TIPS: q
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/*.slnx') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Build
        run: dotnet build dotnet-inspect.slnx -c Release

      - name: Prepare PR decompiler corpus
        run: |
          mkdir -p artifacts/decompiler-pr-corpus
          bash eng/prepare-decompiler-pr-corpus.sh artifacts/decompiler-pr-corpus/assemblies.txt

      - name: Run PR decompiler corpus sensor
        id: decompiler_pr_corpus
        continue-on-error: true
        shell: bash
        run: |
          mapfile -t assemblies < artifacts/decompiler-pr-corpus/assemblies.txt
          set +e
          dotnet run --project tools/DecompilerHarness -c Release -- "${assemblies[@]}" \
            --emit-corpus-snapshot artifacts/decompiler-pr-corpus/snapshot.json \
            --diff-corpus-baseline tools/DecompilerHarness/corpus/pr-quick-baseline.json \
            --quality-diff-card \
            --corpus-method-cap 100 \
            --compile-cap 0 \
            --corpus-fidelity-cap 0 \
            --max-examples 3 \
            | tee artifacts/decompiler-pr-corpus/quality-diff-card.md
          status=${PIPESTATUS[0]}
          echo "$status" > artifacts/decompiler-pr-corpus/exit-code.txt
          exit "$status"

      - name: Upload PR decompiler corpus artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: decompiler-pr-corpus
          path: artifacts/decompiler-pr-corpus/
          if-no-files-found: error

      - name: Check PR decompiler corpus result
        if: steps.decompiler_pr_corpus.outcome == 'failure'
        run: exit 1

      - name: Install ilasm/ildasm
        continue-on-error: true
        shell: bash
        run: |
          RID=${{ matrix.rid }}
          VERSION=11.0.0-preview.1.26104.118
          PACKAGES_DIR=$(mktemp -d)
          PROJ_DIR=$(mktemp -d)
          cat > "$PROJ_DIR/iltools.csproj" <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><TargetFramework>net11.0</TargetFramework></PropertyGroup>
            <ItemGroup>
              <PackageDownload Include="runtime.${RID}.Microsoft.NETCore.ILAsm" Version="[${VERSION}]" />
              <PackageDownload Include="runtime.${RID}.Microsoft.NETCore.ILDAsm" Version="[${VERSION}]" />
            </ItemGroup>
          </Project>
          EOF
          dotnet restore "$PROJ_DIR/iltools.csproj" --packages "$PACKAGES_DIR" --source https://dnceng.pkgs.visualstudio.com/public/_packaging/dotnet11/nuget/v3/index.json --source https://api.nuget.org/v3/index.json
          ILASM_DIR="$PACKAGES_DIR/runtime.$RID.microsoft.netcore.ilasm/$VERSION/runtimes/$RID/native"
          ILDASM_DIR="$PACKAGES_DIR/runtime.$RID.microsoft.netcore.ildasm/$VERSION/runtimes/$RID/native"
          chmod +x "$ILASM_DIR"/* "$ILDASM_DIR"/* 2>/dev/null || true
          echo "$ILASM_DIR" >> "$GITHUB_PATH"
          echo "$ILDASM_DIR" >> "$GITHUB_PATH"

      - name: Run CLI tests (fast)
        run: dotnet run --project src/dotnet-inspect.Tests -c Release -- -trait- "Speed=Slow"

      - name: Run instruction-substrate tests
        run: dotnet run --project src/ILInspector.Instructions.Tests -c Release

      - name: Run metadata tests
        run: dotnet run --project tests/ILInspector.Metadata.Tests -c Release

      - name: Run fixture catalog tests
        run: dotnet run --project tests/DotnetInspector.Fixtures.Tests -c Release

      - name: Run services tests
        run: dotnet run --project src/DotnetInspector.Services.Tests -c Release

      # Fast decompiler unit tests: pass logic, printer, importer facts, identity,
      # and classification regressions. Slow compile-back/recompile, corpus-sweep,
      # and fidelity tests are tagged [Trait("Speed", "Slow")] and excluded here;
      # the full suite (including those) runs in Deep Inspect / publish. Mark any
      # new Roslyn-heavy/recompile test Slow so it stays out of the PR gate.
      - name: Run decompiler unit tests (fast)
        run: dotnet run --project src/ILInspector.Decompiler.Tests -c Release -- -trait- "Speed=Slow"

      - name: Run analysis tests (fast)
        run: dotnet run --project src/ILInspector.Analysis.Tests -c Release -- -trait- "Speed=Slow"

      - name: Run runfaster tests
        run: dotnet run --project src/runfaster.Tests -c Release

      # Fast IL round-trip oracle: focused fixture and handwritten IL cases run
      # in PR CI when the round-trip tests or source dependencies change. The
      # assembly-wide sweep is tagged [Trait("Speed", "Slow")] and runs in
      # Deep Inspect / publish / full local runs.
      - name: Restore vendored ILAssembler
        if: matrix.rid == 'linux-x64' && needs.changes.outputs.ilroundtrip == 'true'
        run: bash eng/restore-ilassembler.sh

      - name: Run IL round-trip tests (fast)
        if: matrix.rid == 'linux-x64' && needs.changes.outputs.ilroundtrip == 'true'
        run: dotnet run --project tests/DotnetInspector.ILRoundtrip.Tests -c Release -- -trait- "Speed=Slow"

  # net10.0 fallback build coverage. The official non-AOT "any" package targets
  # the net10.0 LTS floor (Directory.Build.props), but the full test lane builds
  # net11 only — so net11-only API usage on the fallback path is invisible until
  # an official package build. This job compiles the shipped tool graph against
  # net10.0 so that class of regression is caught on PRs that touch shipped code
  # (#2594). Build-only and fast; the net10.0 targeting pack resolves from the
  # SDK / nuget.org.
  build-net10:
    needs: changes
    if: needs.changes.outputs.shipped == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    env:
      DOTNET_INSPECT_TIPS: q
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/*.slnx') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Build tool for net10.0 fallback
        run: dotnet build src/dotnet-inspect -c Release -p:DefaultTargetFramework=net10.0 -p:PublishAot=false

  # Decompiler docket and byte-neutrality gates, pre-merge.
  #
  # These gates carry doc comments asserting they fail CI, but every pre-merge
  # lane runs `-trait- "Speed=Slow"` and they are all Slow, so until now they
  # ran only in release.yml and the weekly Deep Inspect lane — where they were
  # exceeding the job timeout, and a *cancelled* job does not satisfy Deep
  # Inspect's `if: ... && failure()` notifier. Detection latency was unbounded,
  # not weekly (#3432). Five real regressions (#3489-#3493) accumulated unseen.
  #
  # This job runs the three gates whose failures are attributable to a specific
  # fixture and docket entry, as its own job so it never serializes with the
  # hot `test` lane. Currently-open failures are pinned in
  # eng/decompiler-gate-known-red.txt; the checker fails on any unpinned
  # failure, on any pin that starts passing, and on any gate test that neither
  # passes nor fails, so the pin list is a ratchet in both directions rather
  # than a permanent exemption.
  #
  # NOTE: this job is not merge-blocking today, because the `main` ruleset
  # declares no required status checks at all — no job in this workflow blocks
  # a merge. That is a repository-wide gap tracked separately; this job is
  # exactly as enforcing as the existing `test` job until it is closed.
  #
  # The remaining Fidelity-area classes are excluded on cost, not principle:
  # ClusterCaptureTests and PrinterPrecedenceTests alone are ~21 minutes for two
  # tests and want the #3495 type-filter treatment before they can be gated.
  decompiler-gates:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.decompiler == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      DOTNET_INSPECT_TIPS: q
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/*.slnx') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-

      # The gates decompile and recompile the fixture assemblies, so the whole
      # solution must be built: building only the test project leaves the
      # fixtures absent and the gates fail with a FileNotFoundException that
      # reads exactly like a product regression.
      - name: Build
        run: dotnet build dotnet-inspect.slnx -c Release

      # continue-on-error so the pinned known-red failures do not fail the job
      # here; eng/check-decompiler-gate.cs decides pass/fail from the report.
      #
      # The step timeout is the point, not a formality. This PR exists because
      # a *job* timeout cancels the job, and a cancelled job runs no further
      # steps and satisfies no `failure()` condition — it fails silently. A
      # step timeout well under the job timeout converts a hang into a failed
      # step that the job survives, so the checker still runs, finds a missing
      # or truncated report, and fails the job loudly. Do not raise this to the
      # job timeout.
      - name: Run decompiler gates
        id: gates
        continue-on-error: true
        timeout-minutes: 25
        run: |
          dotnet run --project src/ILInspector.Decompiler.Tests -c Release -- \
            --gate pre-merge -xml "$RUNNER_TEMP/decompiler-gates.xml"

      - name: Compare against pinned known-red
        run: |
          dotnet run eng/check-decompiler-gate.cs -- \
            "$RUNNER_TEMP/decompiler-gates.xml" \
            eng/decompiler-gate-known-red.txt \
            eng/decompiler-gate-expected-classes.txt

      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decompiler-gates-report
          path: ${{ runner.temp }}/decompiler-gates.xml
          if-no-files-found: warn

  # Cheap C# Diff harness coverage. Path-gated separately from the full test
  # lane so CSharpDiffHarness/card changes get focused snapshot/baseline JSONL
  # coverage without forcing most PRs through extra work.
  csharp-diff-smoke:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.csharpdiff == 'true'
    runs-on: ubuntu-26.04
    env:
      DOTNET_INSPECT_TIPS: q
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/*.slnx') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Build C# Diff harness and fixtures
        run: |
          dotnet build tools/CSharpDiffHarness/CSharpDiffHarness.csproj -c Release
          dotnet build src/DiffFixtures.V1/DiffFixtures.V1.csproj -c Release
          dotnet build src/DiffFixtures.V2/DiffFixtures.V2.csproj -c Release

      - name: Run C# Diff baseline smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/csharp-diff-smoke
          old=artifacts/bin/DiffFixtures.V1/release/DiffFixtureSample.dll
          new=artifacts/bin/DiffFixtures.V2/release/DiffFixtureSample.dll

          dotnet run --project tools/CSharpDiffHarness -c Release --no-build -- \
            "$old" "$new" \
            --emit-snapshot artifacts/csharp-diff-smoke/snapshot.json \
            --format jsonl \
            --max-examples 0 \
            > artifacts/csharp-diff-smoke/snapshot.jsonl

          dotnet run --project tools/CSharpDiffHarness -c Release --no-build -- \
            "$old" "$new" \
            --diff-baseline tools/CSharpDiffHarness/corpus/diff-fixtures-baseline.json \
            --format jsonl \
            --max-examples 0 \
            > artifacts/csharp-diff-smoke/baseline.jsonl

          cat > /tmp/csharp-diff-mutate-baseline.cs <<'CS'
          using System.Text.Json.Nodes;
          var node = JsonNode.Parse(File.ReadAllText(args[0]))!.AsObject();
          node["Summary"]!["FailureCount"] = 0;
          node["FailureBuckets"] = new JsonArray();
          File.WriteAllText(args[1], node.ToJsonString(new System.Text.Json.JsonSerializerOptions { WriteIndented = true }) + Environment.NewLine);
          CS
          dotnet run /tmp/csharp-diff-mutate-baseline.cs -- \
            artifacts/csharp-diff-smoke/snapshot.json \
            artifacts/csharp-diff-smoke/regression-baseline.json

          set +e
          dotnet run --project tools/CSharpDiffHarness -c Release --no-build -- \
            "$old" "$new" \
            --diff-baseline artifacts/csharp-diff-smoke/regression-baseline.json \
            --format jsonl \
            --max-examples 0 \
            > artifacts/csharp-diff-smoke/regression.jsonl
          status=$?
          set -e
          test "$status" -eq 1

          cat > /tmp/csharp-diff-parse-jsonl.cs <<'CS'
          using System.Text.Json;
          foreach (var path in args)
          {
              foreach (var line in File.ReadLines(path))
              {
                  if (string.IsNullOrWhiteSpace(line))
                      continue;
                  JsonDocument.Parse(line).Dispose();
              }
          }
          CS
          dotnet run /tmp/csharp-diff-parse-jsonl.cs -- \
            artifacts/csharp-diff-smoke/snapshot.jsonl \
            artifacts/csharp-diff-smoke/baseline.jsonl \
            artifacts/csharp-diff-smoke/regression.jsonl

      - name: Upload C# Diff smoke artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: csharp-diff-smoke
          path: artifacts/csharp-diff-smoke/
          if-no-files-found: warn

  # Cheap IL Diff harness coverage. It is path-gated separately from the full
  # test lane so most PRs do no more than their existing build/test work, while
  # IL Diff-specific changes get a focused snapshot/baseline JSONL smoke.
  il-diff-smoke:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.ildiff == 'true'
    runs-on: ubuntu-26.04
    env:
      DOTNET_INSPECT_TIPS: q
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/*.slnx') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Build IL Diff harness and fixtures
        run: |
          dotnet build tools/IlDiffHarness/IlDiffHarness.csproj -c Release
          dotnet build src/DiffFixtures.V1/DiffFixtures.V1.csproj -c Release
          dotnet build src/DiffFixtures.V2/DiffFixtures.V2.csproj -c Release

      - name: Run IL Diff baseline smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/il-diff-smoke
          old=artifacts/bin/DiffFixtures.V1/release/DiffFixtureSample.dll
          new=artifacts/bin/DiffFixtures.V2/release/DiffFixtureSample.dll

          dotnet run --project tools/IlDiffHarness -c Release --no-build -- \
            "$old" "$new" \
            --emit-snapshot artifacts/il-diff-smoke/snapshot.json \
            --format jsonl \
            --max-examples 0 \
            > artifacts/il-diff-smoke/snapshot.jsonl

          dotnet run --project tools/IlDiffHarness -c Release --no-build -- \
            "$old" "$new" \
            --diff-baseline artifacts/il-diff-smoke/snapshot.json \
            --format jsonl \
            --max-examples 0 \
            > artifacts/il-diff-smoke/exact.jsonl

          cat > /tmp/il-diff-mutate-baseline.cs <<'CS'
          using System.Text.Json.Nodes;
          var node = JsonNode.Parse(File.ReadAllText(args[0]))!.AsObject();
          node["Summary"]!["FailureCount"] = 0;
          node["FailureBuckets"] = new JsonArray();
          File.WriteAllText(args[1], node.ToJsonString(new System.Text.Json.JsonSerializerOptions { WriteIndented = true }) + Environment.NewLine);
          CS
          dotnet run /tmp/il-diff-mutate-baseline.cs -- \
            artifacts/il-diff-smoke/snapshot.json \
            artifacts/il-diff-smoke/regression-baseline.json

          set +e
          dotnet run --project tools/IlDiffHarness -c Release --no-build -- \
            "$old" "$new" \
            --diff-baseline artifacts/il-diff-smoke/regression-baseline.json \
            --format jsonl \
            --max-examples 0 \
            > artifacts/il-diff-smoke/regression.jsonl
          status=$?
          set -e
          test "$status" -eq 1

          cat > /tmp/il-diff-parse-jsonl.cs <<'CS'
          using System.Text.Json;
          foreach (var path in args)
          {
              foreach (var line in File.ReadLines(path))
              {
                  if (string.IsNullOrWhiteSpace(line))
                      continue;
                  JsonDocument.Parse(line).Dispose();
              }
          }
          CS
          dotnet run /tmp/il-diff-parse-jsonl.cs -- \
            artifacts/il-diff-smoke/snapshot.jsonl \
            artifacts/il-diff-smoke/exact.jsonl \
            artifacts/il-diff-smoke/regression.jsonl

      - name: Upload IL Diff smoke artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: il-diff-smoke
          path: artifacts/il-diff-smoke/
          if-no-files-found: warn

  # Pack and smoke test on Ubuntu. This is a packaging smoke test only: it
  # validates the pointer package, the any fallback, one RID-specific AOT pack,
  # and local tool install/smoke. It is NOT the source of release artifacts
  # (release.yml builds those itself at publish time), so it runs only on PRs
  # that touch build/packaging configuration. Most PRs (e.g. decompiler raises)
  # skip it, which removes packaging work from the hot PR path.
  pack:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.packaging == 'true'
    runs-on: ubuntu-26.04
    env:
      DOTNET_INSPECT_TIPS: q
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Pack pointer package
        # SelfContained=true forces the pack TFM segment to 'any', so the pointer
        # manifest lands at tools/any/any/DotnetToolSettings.xml instead of
        # tools/netX.0/any/. This makes the pointer TFM-agnostic: any SDK that
        # understands RID-specific tools can read it, regardless of TFM. The
        # pointer carries no implementation, so SelfContained pulls in no runtime.
        run: dotnet pack src/dotnet-inspect -c Release -p:SelfContained=true -p:OfficialBuild=true

      - name: Upload pointer package
        uses: actions/upload-artifact@v7
        with:
          name: package-pointer
          path: artifacts/package/release/*.nupkg
          if-no-files-found: error

      - name: Pack any (non-AOT) package
        # TFM is pinned to net10.0 structurally via Directory.Build.props
        # (OfficialBuild + non-AOT) so this fallback stays installable on the LTS
        # runtime even though dev/AOT builds use the latest runtime. See issue #240.
        run: dotnet pack src/dotnet-inspect -c Release -r any -p:PublishAot=false -p:OfficialBuild=true

      - name: Upload any package
        uses: actions/upload-artifact@v7
        with:
          name: package-any
          path: artifacts/package/release/*.nupkg
          if-no-files-found: error

      - name: Pack linux-x64 AOT package
        run: dotnet pack src/dotnet-inspect -c Release -r linux-x64 -p:OfficialAotBuild=true

      - name: Upload linux-x64 package
        uses: actions/upload-artifact@v7
        with:
          name: package-linux-x64
          path: artifacts/package/release/*.nupkg
          if-no-files-found: error

      - name: Install tool from local packages
        run: dotnet tool install --global dotnet-inspect --add-source ./artifacts/package/release --no-cache

      - name: Smoke test - version
        run: |
          OUTPUT=$(dotnet-inspect --version)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'

      - name: Smoke test - help
        run: |
          OUTPUT=$(dotnet-inspect --help)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "dotnet-inspect"

      - name: Smoke test - package quiet
        run: |
          dotnet-inspect package System.Text.Json@10.0.0 -v:q > smoke-package.md
          cat smoke-package.md
          grep -q "System.Text.Json" smoke-package.md
          grep -q "Library" smoke-package.md

      - name: Smoke test - package normal
        run: |
          dotnet-inspect package System.Text.Json@10.0.0 -v:n > smoke-package-normal.md
          cat smoke-package-normal.md
          grep -q "## Package Info" smoke-package-normal.md
          grep -q "## Dependencies" smoke-package-normal.md
          grep -q "Library" smoke-package-normal.md

      - name: Smoke test - type command (table output)
        run: |
          dotnet-inspect type --package System.Text.Json@10.0.0 -t JsonSerializer --table > smoke-type.txt
          cat smoke-type.txt
          grep -q "JsonSerializer" smoke-type.txt

      - name: Smoke test - member command (table output)
        run: |
          dotnet-inspect member JsonSerializer --package System.Text.Json@10.0.0 -m Serialize --table > smoke-member.txt
          cat smoke-member.txt
          grep -q "Serialize" smoke-member.txt

      - name: Smoke test - type command (markdown)
        run: |
          dotnet-inspect type --package System.Text.Json@10.0.0 -v:m -t JsonSerializer > smoke-type.md
          cat smoke-type.md
          grep -q "JsonSerializer" smoke-type.md

      - name: Smoke test - member command (markdown)
        run: |
          dotnet-inspect member JsonSerializer --package System.Text.Json@10.0.0 -v:m -m Serialize > smoke-member.md
          cat smoke-member.md
          grep -q "JsonSerializer" smoke-member.md
          grep -q "Serialize" smoke-member.md

      - name: Smoke test - platform command
        run: |
          dotnet-inspect platform list > smoke-platform.txt || true
          cat smoke-platform.txt

      - name: Validate markdown output
        run: |
          npm install -g markdownlint-cli
          markdownlint --config .markdownlint.yaml smoke-*.md

      - name: Uninstall tool
        run: dotnet tool uninstall --global dotnet-inspect
