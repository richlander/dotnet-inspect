name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Detect what changed to determine which jobs to run
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - '!src/**/*.md'
              - '!src/**/*.txt'
              - '*.props'
              - '*.sln'
              - '.github/workflows/**'
            docs:
              - '**/*.md'
              - '**/*.txt'
              - 'docs/**'

  # Lint markdown files
  markdownlint:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: '**/*.md'

  # Build, test, pack (pointer + any + linux-x64), and smoke test — all on one runner
  build-and-test:
    needs: [changes, markdownlint]
    if: always() && needs.changes.outputs.code == 'true' && needs.markdownlint.result != 'failure'
    runs-on: ubuntu-latest
    env:
      DOTNET_INSPECT_TIPS: q
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build src/dotnet-inspect -c Release

      - name: Run unit tests
        run: dotnet test src/dotnet-inspect.Tests -c Release --no-build

      - name: Pack pointer package
        run: dotnet pack src/dotnet-inspect -c Release -p:OfficialBuild=true

      - name: Upload pointer package
        uses: actions/upload-artifact@v4
        with:
          name: package-pointer
          path: artifacts/package/release/*.nupkg
          if-no-files-found: error

      - name: Pack any (non-AOT) package
        run: dotnet pack src/dotnet-inspect -c Release -r any -p:PublishAot=false -p:OfficialBuild=true

      - name: Upload any package
        uses: actions/upload-artifact@v4
        with:
          name: package-any
          path: artifacts/package/release/*.nupkg
          if-no-files-found: error

      - name: Pack linux-x64 AOT package
        run: dotnet pack src/dotnet-inspect -c Release -r linux-x64 -p:PublishAot=true -p:OfficialBuild=true

      - name: Upload linux-x64 package
        uses: actions/upload-artifact@v4
        with:
          name: package-linux-x64
          path: artifacts/package/release/*.nupkg
          if-no-files-found: error

      - name: Install tool from local packages
        run: dotnet tool install --global dotnet-inspect --add-source ./artifacts/package/release --no-cache

      - name: Smoke test - version
        run: |
          OUTPUT=$(dotnet-inspect --version)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'

      - name: Smoke test - help
        run: |
          OUTPUT=$(dotnet-inspect --help)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "dotnet-inspect"

      - name: Smoke test - package info
        run: |
          dotnet-inspect System.Text.Json 10.0.0 -v:q > smoke-package.md
          cat smoke-package.md
          grep -q "System.Text.Json" smoke-package.md
          grep -q "Library" smoke-package.md

      - name: Smoke test - api command
        run: |
          dotnet-inspect api JsonSerializer --package System.Text.Json@10.0.0 -n 5 > smoke-api.md
          cat smoke-api.md
          grep -q "JsonSerializer" smoke-api.md
          grep -q "Serialize" smoke-api.md
          grep -q "Deserialize" smoke-api.md

      - name: Smoke test - platform command
        run: |
          dotnet-inspect platform list > smoke-platform.md
          cat smoke-platform.md
          grep -q "runtime" smoke-platform.md

      - name: Validate markdown output
        run: |
          npm install -g markdownlint-cli
          markdownlint smoke-*.md

      - name: Uninstall tool
        run: dotnet tool uninstall --global dotnet-inspect

  # Build RID-specific Native AOT packages (cross-platform)
  build-rid:
    needs: [changes, markdownlint]
    if: always() && needs.changes.outputs.code == 'true' && needs.markdownlint.result != 'failure'
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: win-arm64
            os: windows-latest
          - rid: linux-arm64
            os: ubuntu-24.04-arm
          - rid: osx-arm64
            os: macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pack RID-specific package
        run: dotnet pack src/dotnet-inspect -c Release -r ${{ matrix.rid }} -p:PublishAot=true -p:OfficialBuild=true

      - name: Upload RID package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.rid }}
          path: artifacts/package/release/*.nupkg
          if-no-files-found: error
