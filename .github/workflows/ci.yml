name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Detect what changed to determine which jobs to run
  changes:
    runs-on: ubuntu-26.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
      ilroundtrip: ${{ steps.filter.outputs.ilroundtrip }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Detect changes
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=$(gh pr diff ${{ github.event.pull_request.number }} --name-only)
          else
            BEFORE=${{ github.event.before }}
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              BEFORE=HEAD~1
            fi
            FILES=$(git diff --name-only "$BEFORE"..."${{ github.sha }}")
          fi
          CODE=false
          DOCS=false
          ILROUNDTRIP=false
          while IFS= read -r file; do
            case "$file" in
              src/*) CODE=true ;;
              tools/DecompilerHarness/*) CODE=true ;;
              eng/prepare-decompiler-corpus.sh) CODE=true ;;
              eng/prepare-decompiler-pr-corpus.sh) CODE=true ;;
              *.props|*.sln) CODE=true ;;
              .github/workflows/*) CODE=true ;;
            esac
            case "$file" in
              *.md|*.txt|docs/*|skills/*) DOCS=true ;;
            esac
            # The IL round-trip oracle is also expensive (vendored ILAssembler
            # round-trip over a broad corpus). It depends on ILInspector.Metadata
            # -> { DotnetInspector.Core, ILInspector.MetadataPrimitives } plus the
            # vendored ILAssembler restore script and the test project itself.
            case "$file" in
              tests/DotnetInspector.ILRoundtrip.Tests/*) ILROUNDTRIP=true ;;
              eng/restore-ilassembler.sh) ILROUNDTRIP=true ;;
              src/ILInspector.Metadata*) ILROUNDTRIP=true ;;
              src/DotnetInspector.Core/*) ILROUNDTRIP=true ;;
              *.props|*.sln) ILROUNDTRIP=true ;;
            esac
          done <<< "$FILES"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "docs=$DOCS" >> "$GITHUB_OUTPUT"
          echo "ilroundtrip=$ILROUNDTRIP" >> "$GITHUB_OUTPUT"
          echo "Changed files:"
          echo "$FILES"
          echo "code=$CODE docs=$DOCS ilroundtrip=$ILROUNDTRIP"
        env:
          GH_TOKEN: ${{ github.token }}

  # Lint markdown files
  markdownlint:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: '**/*.md'

  # Build and test on Ubuntu only. Windows/macOS coverage was moved to the
  # Publish workflow to cut Actions minutes (those runners bill at higher
  # multipliers). This trades per-PR cross-platform test coverage for cost.
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_INSPECT_TIPS: q
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Build
        run: dotnet build src/dotnet-inspect -c Release -p:PublishAot=false

      - name: Prepare PR decompiler corpus
        run: |
          mkdir -p artifacts/decompiler-pr-corpus
          bash eng/prepare-decompiler-pr-corpus.sh artifacts/decompiler-pr-corpus/assemblies.txt

      - name: Run PR decompiler corpus sensor
        id: decompiler_pr_corpus
        continue-on-error: true
        shell: bash
        run: |
          mapfile -t assemblies < artifacts/decompiler-pr-corpus/assemblies.txt
          set +e
          dotnet run --project tools/DecompilerHarness -c Release -- "${assemblies[@]}" \
            --emit-corpus-snapshot artifacts/decompiler-pr-corpus/snapshot.json \
            --diff-corpus-baseline tools/DecompilerHarness/corpus/pr-quick-baseline.json \
            --quality-diff-card \
            --corpus-method-cap 100 \
            --compile-cap 0 \
            --corpus-fidelity-cap 0 \
            --max-examples 3 \
            | tee artifacts/decompiler-pr-corpus/quality-diff-card.md
          status=${PIPESTATUS[0]}
          echo "$status" > artifacts/decompiler-pr-corpus/exit-code.txt
          exit "$status"

      - name: Upload PR decompiler corpus artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: decompiler-pr-corpus
          path: artifacts/decompiler-pr-corpus/
          if-no-files-found: error

      - name: Check PR decompiler corpus result
        if: steps.decompiler_pr_corpus.outcome == 'failure'
        run: exit 1

      - name: Install ilasm/ildasm
        continue-on-error: true
        shell: bash
        run: |
          RID=${{ matrix.rid }}
          VERSION=11.0.0-preview.1.26104.118
          PACKAGES_DIR=$(mktemp -d)
          PROJ_DIR=$(mktemp -d)
          cat > "$PROJ_DIR/iltools.csproj" <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><TargetFramework>net11.0</TargetFramework></PropertyGroup>
            <ItemGroup>
              <PackageDownload Include="runtime.${RID}.Microsoft.NETCore.ILAsm" Version="[${VERSION}]" />
              <PackageDownload Include="runtime.${RID}.Microsoft.NETCore.ILDAsm" Version="[${VERSION}]" />
            </ItemGroup>
          </Project>
          EOF
          dotnet restore "$PROJ_DIR/iltools.csproj" --packages "$PACKAGES_DIR" --source https://dnceng.pkgs.visualstudio.com/public/_packaging/dotnet11/nuget/v3/index.json --source https://api.nuget.org/v3/index.json
          ILASM_DIR="$PACKAGES_DIR/runtime.$RID.microsoft.netcore.ilasm/$VERSION/runtimes/$RID/native"
          ILDASM_DIR="$PACKAGES_DIR/runtime.$RID.microsoft.netcore.ildasm/$VERSION/runtimes/$RID/native"
          chmod +x "$ILASM_DIR"/* "$ILDASM_DIR"/* 2>/dev/null || true
          echo "$ILASM_DIR" >> "$GITHUB_PATH"
          echo "$ILDASM_DIR" >> "$GITHUB_PATH"

      - name: Run CLI tests
        run: dotnet run --project src/dotnet-inspect.Tests -c Release

      - name: Run metadata tests
        run: dotnet run --project tests/ILInspector.Metadata.Tests -c Release

      - name: Run services tests
        run: dotnet run --project src/DotnetInspector.Services.Tests -c Release

      # The IL round-trip oracle (vendored managed ILAssembler) is
      # platform-neutral at the IL level, so one leg suffices. It is expensive,
      # so it only runs when the round-trip tests or their source dependencies
      # change (see the `ilroundtrip` filter in the changes job).
      - name: Restore vendored ILAssembler
        if: matrix.rid == 'linux-x64' && needs.changes.outputs.ilroundtrip == 'true'
        run: bash eng/restore-ilassembler.sh

      - name: Run IL round-trip tests
        if: matrix.rid == 'linux-x64' && needs.changes.outputs.ilroundtrip == 'true'
        run: dotnet run --project tests/DotnetInspector.ILRoundtrip.Tests -c Release

  # Pack and smoke test on Ubuntu
  pack:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    env:
      DOTNET_INSPECT_TIPS: q
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Pack pointer package
        # SelfContained=true forces the pack TFM segment to 'any', so the pointer
        # manifest lands at tools/any/any/DotnetToolSettings.xml instead of
        # tools/netX.0/any/. This makes the pointer TFM-agnostic: any SDK that
        # understands RID-specific tools can read it, regardless of TFM. The
        # pointer carries no implementation, so SelfContained pulls in no runtime.
        run: dotnet pack src/dotnet-inspect -c Release -p:SelfContained=true -p:OfficialBuild=true

      - name: Upload pointer package
        uses: actions/upload-artifact@v7
        with:
          name: package-pointer
          path: artifacts/package/release/*.nupkg
          if-no-files-found: error

      - name: Pack any (non-AOT) package
        # TFM is pinned to net10.0 structurally via Directory.Build.props
        # (OfficialBuild + non-AOT) so this fallback stays installable on the LTS
        # runtime even though dev/AOT builds use the latest runtime. See issue #240.
        run: dotnet pack src/dotnet-inspect -c Release -r any -p:PublishAot=false -p:OfficialBuild=true

      - name: Upload any package
        uses: actions/upload-artifact@v7
        with:
          name: package-any
          path: artifacts/package/release/*.nupkg
          if-no-files-found: error

      - name: Pack linux-x64 AOT package
        run: dotnet pack src/dotnet-inspect -c Release -r linux-x64 -p:OfficialAotBuild=true

      - name: Upload linux-x64 package
        uses: actions/upload-artifact@v7
        with:
          name: package-linux-x64
          path: artifacts/package/release/*.nupkg
          if-no-files-found: error

      - name: Install tool from local packages
        run: dotnet tool install --global dotnet-inspect --add-source ./artifacts/package/release --no-cache

      - name: Smoke test - version
        run: |
          OUTPUT=$(dotnet-inspect --version)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'

      - name: Smoke test - help
        run: |
          OUTPUT=$(dotnet-inspect --help)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "dotnet-inspect"

      - name: Smoke test - package quiet
        run: |
          dotnet-inspect package System.Text.Json@10.0.0 -v:q > smoke-package.md
          cat smoke-package.md
          grep -q "System.Text.Json" smoke-package.md
          grep -q "Library" smoke-package.md

      - name: Smoke test - package normal
        run: |
          dotnet-inspect package System.Text.Json@10.0.0 -v:n > smoke-package-normal.md
          cat smoke-package-normal.md
          grep -q "## Package Info" smoke-package-normal.md
          grep -q "## Dependencies" smoke-package-normal.md
          grep -q "Library" smoke-package-normal.md

      - name: Smoke test - type command (oneline default)
        run: |
          dotnet-inspect type --package System.Text.Json@10.0.0 -t JsonSerializer --oneline > smoke-type.txt
          cat smoke-type.txt
          grep -q "JsonSerializer" smoke-type.txt

      - name: Smoke test - member command (oneline default)
        run: |
          dotnet-inspect member JsonSerializer --package System.Text.Json@10.0.0 -m Serialize --oneline > smoke-member.txt
          cat smoke-member.txt
          grep -q "Serialize" smoke-member.txt

      - name: Smoke test - type command (markdown)
        run: |
          dotnet-inspect type --package System.Text.Json@10.0.0 -v:m -t JsonSerializer > smoke-type.md
          cat smoke-type.md
          grep -q "JsonSerializer" smoke-type.md

      - name: Smoke test - member command (markdown)
        run: |
          dotnet-inspect member JsonSerializer --package System.Text.Json@10.0.0 -v:m -m Serialize > smoke-member.md
          cat smoke-member.md
          grep -q "JsonSerializer" smoke-member.md
          grep -q "Serialize" smoke-member.md

      - name: Smoke test - platform command
        run: |
          dotnet-inspect platform list > smoke-platform.txt || true
          cat smoke-platform.txt

      - name: Validate markdown output
        run: |
          npm install -g markdownlint-cli
          markdownlint smoke-*.md

      - name: Uninstall tool
        run: dotnet tool uninstall --global dotnet-inspect

  # Build RID-specific Native AOT packages built on Linux runners. The
  # win-x64, win-arm64, and osx-arm64 AOT packages are built in the Publish
  # workflow instead, so Windows/macOS runners are only used at release time.
  pack-rid:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-arm64
            os: ubuntu-26.04-arm

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Pack RID-specific package
        run: dotnet pack src/dotnet-inspect -c Release -r ${{ matrix.rid }} -p:OfficialAotBuild=true

      - name: Upload RID package
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.rid }}
          path: artifacts/package/release/*.nupkg
          if-no-files-found: error
