name: CI

on:
  push:
    branches: [main]
  # Deliberately unfiltered by base branch. A base-branch filter decides whether
  # a *stacked* PR gets CI at all: a PR retargeted from `main` onto a long-lived
  # branch silently stops matching, so it reports no checks rather than failing
  # ones -- and "no checks reported" is indistinguishable at a glance from "not
  # run yet", while `ci-required` counts a job that never ran as nothing to
  # block on.
  #
  # An allow list here has to name every prefix a *base* can have, which is every
  # prefix a branch can have, since any branch under review can be stacked on.
  # That is not a list that can be maintained, and each way of getting it wrong
  # is silent: `[main]` alone missed every stacked PR, adding `feature/**` still
  # left `fix/**` uncovered (#3684 opened onto `fix/3628-...` and reported no
  # checks), and adding `fix/**` still left #3558 -- open onto
  # `prototype/wasm-command-ui` -- mergeable with zero checks (#3706).
  #
  # So the filter is gone rather than extended. Every pull request runs CI
  # whatever it targets. The cost is CI on PRs between side branches; the cost
  # of the allow list was PRs that merge with no CI at all and look clean doing
  # it.
  pull_request:
  # Merge queue candidates must report the same `ci-required` check as ordinary
  # PRs. The synthetic head is classified against merge_group.base_sha below.
  merge_group:
    types: [checks_requested]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

# Cancel superseded PR runs (e.g. when an agent pushes again to the same branch)
# so only the latest commit of a PR consumes a full CI run. Pushes to main are
# not cancelled; web-relevant pushes run inspect-web as a post-merge backstop,
# while the other expensive lanes remain PR/merge-queue-only. release.yml builds
# all release packages fresh at publish time and does not consume CI artifacts.
#
# The group keys on the pull request *number*, not `github.head_ref`. Branch
# names are not unique across forks, so two PRs both branched as `patch-1`
# would share a group and cancel each other. That was merely wasteful while CI
# was advisory; once `ci-required` is required, the loser's check would land as
# `cancelled` and block that PR until someone re-ran it by hand.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Plan the validations selected by this exact candidate.
  #
  # This entry job uses the GA image deliberately. Every workflow run waits on
  # it before path-gated jobs can be selected, so preview-image capacity must
  # not serialize the entire PR queue. Specialized jobs below retain
  # ubuntu-26.04 coverage without making it the scheduler for every run.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history. Change detection diffs against github.event.before,
          # which is not always the immediate parent: a push advances main by
          # more than one commit whenever two PRs merge back to back or a
          # batch is pushed. fetch-depth: 2 left that commit outside the
          # shallow clone and the diff died with "Invalid symmetric difference
          # expression", taking the whole run with it.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      - name: Self-test change detection
        shell: bash
        run: dotnet run eng/test-ci-change-detection.cs
        env:
          BASH_ENV: ""

      # Trend rows are reproducible evidence only when their recorded commit
      # landed on main and its source declared the recorded methodology. This
      # job already has the full history needed to prove both, so keep the gate
      # here rather than making test jobs deepen otherwise-shallow checkouts.
      - name: Check EVIL history provenance
        shell: bash
        env:
          # After editing `run`, refresh this colocated acknowledgement with:
          # dotnet run eng/test-ci-change-detection.cs -- --refresh-evil-provenance-pin
          EVIL_PROVENANCE_RUN_SHA256: AFD8804F209E05792867D7776A950AE6B0EA459F32F896782F0C6B794F5A4B76
        run: >
          dotnet run --project tools/DecompilerHarness -c Release --
          --verify-authored-corpus-history

      - name: Plan changes
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          evidence_directory="${RUNNER_TEMP}/ci-plan"
          mkdir -p "$evidence_directory"
          event_name="${GITHUB_EVENT_NAME//_/-}"
          plan=$(
            dotnet run eng/ci-plan.cs -- "$event_name" \
              --base "$CI_BASE_SHA" \
              --candidate "$GITHUB_SHA" \
              --evidence-directory "$evidence_directory" \
              --repository "$GITHUB_WORKSPACE"
          )
          if [[ "$plan" == *$'\n'* ]]; then
            echo "ci-plan emitted more than one line" >&2
            exit 1
          fi
          jq -e '
            type == "object"
            and .schemaVersion == 1
            and .status == "planned"
          ' <<< "$plan" > /dev/null
          printf 'plan=%s\n' "$plan" >> "$GITHUB_OUTPUT"
        env:
          # The runner honors BASH_ENV even with --noprofile and --norc.
          # Clear inherited workflow/job values before executing this gate.
          BASH_ENV: ""
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}

  # Lint markdown files
  markdownlint:
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).validations.markdownlint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: '**/*.md'

  # Upholds the bar in docs/tla-plus-methodology.md for TLA+ models changed by
  # this candidate: SANY parses every selected module, and TLC runs the selected
  # directories' .cfg files to completion. Contract-defining configurations in
  # eng/tla-expected-exit-codes.txt must produce their exact semantic verdict;
  # unlisted legacy configurations retain the coherent-verdict policy because
  # some are negative controls without machine-readable expectations.
  tla-plus:
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).validations.tla
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          # The gate diffs the effective candidate against its event-provided
          # base so it can select only the model directories changed by the PR,
          # push, or merge-group candidate.
          fetch-depth: 0

      - name: Self-test TLA+ runner scope
        shell: bash
        run: eng/test-tla-checks.sh

      # Ubuntu 26.04's default-jre metapackage resolves to OpenJDK 25,
      # matching the Java pin in docs/runbooks/tla-plus-setup.md.
      - name: Install Java
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre

      - name: Cache tla2tools.jar
        id: cache-tla
        uses: actions/cache@v4
        with:
          path: ~/.local/share/tlaplus/tla2tools.jar
          # Include the asset digest so a recreated tagged release cannot
          # reuse cached bytes from the prior asset.
          key: tla2tools-v1.8.0-dbcc75552f21978a

      # Pinned per docs/runbooks/tla-plus-setup.md: v1.8.0 is a GitHub
      # prerelease, so it is never resolved by a "latest" alias -- always
      # fetch this exact tagged asset URL.
      - name: Download tla2tools.jar
        if: steps.cache-tla.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/.local/share/tlaplus
          curl -fLo ~/.local/share/tlaplus/tla2tools.jar \
            https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar

      # A cache key alone is not an integrity check: a substituted release
      # asset served under the same tag, or a poisoned cache entry, would
      # otherwise execute unverified bytecode via the "Run TLA+ checks"
      # step below with no diagnostic. Verify on every run -- cache hits
      # included -- not only right after a fresh download.
      - name: Verify tla2tools.jar checksum
        run: |
          set -euo pipefail
          echo "dbcc75552f21978a4846688b8e23be1a6b6c0b3fcee35d78fec2df167958ec94  $HOME/.local/share/tlaplus/tla2tools.jar" \
            | sha256sum -c -

      - name: Run TLA+ checks
        shell: bash
        env:
          CI_BEFORE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "$CI_BEFORE_SHA" ] \
             || [ "$CI_BEFORE_SHA" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${CI_BEFORE_SHA}^{commit}"; then
            echo "::error::Could not resolve the base commit for scoped TLA+ checks."
            exit 1
          fi
          export TLA_TOOLS_JAR="$HOME/.local/share/tlaplus/tla2tools.jar"
          # Tighter than the script's 600s local-dev default: this repo's
          # shared CI runners are slower than a typical contributor
          # machine, and a per-invocation cap this size still leaves ample
          # room under the job's timeout-minutes even if several configs
          # hit it (a hit is a warning, not a failure -- see
          # eng/run-tla-checks.sh).
          export TLA_CHECK_TIMEOUT_SECONDS=120
          git diff --no-renames --name-only -z "$CI_BEFORE_SHA" HEAD -- |
            eng/run-tla-checks.sh --changed-files0

  inspect-web:
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).validations.inspectWeb
    runs-on: ubuntu-26.04

  # Shipped skills are embedded Markdown resources. A SKILL.md-only PR does
  # not need the full product matrix, but it must still prove that every
  # focused skill is registered and embedded and that every resource resolves.
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: prototypes/inspect-web/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Install .NET 10 runtime (inspect-web test target)
        # The inspect-web test projects target stable net10.0 while this job
        # uses the pinned net11.0 preview SDK. WorkflowContract.ValidateInspectWebSdk
        # requires exactly one setup-dotnet step in this job, so install the
        # extra runtime with dotnetup instead of a second setup-dotnet@v5 step.
        # dotnetup is itself in preview; fall back to dotnet-install.sh on any
        # failure, mirroring dotnet/sdk's own acquisition fallback.
        run: |
          set -e
          if curl -fsSL --retry 3 https://aka.ms/dotnet/dotnetup/daily/get-dotnetup.sh -o /tmp/get-dotnetup.sh \
            && bash /tmp/get-dotnetup.sh --install-dir /tmp/dotnetup \
            && /tmp/dotnetup/dotnetup runtime install aspnetcore@10.0 --install-path "$DOTNET_ROOT" --untracked --no-progress; then
            echo "Installed aspnetcore@10.0 via dotnetup."
          else
            echo "dotnetup acquisition/install failed; falling back to dotnet-install.sh." >&2
            curl -sSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
            chmod +x /tmp/dotnet-install.sh
            /tmp/dotnet-install.sh --channel 10.0 --runtime aspnetcore --install-dir "$DOTNET_ROOT"
          fi

      - name: Install browser Wasm workload
        run: dotnet workload install wasm-experimental

      - name: Run MethodSemantics Browser/Wasm probe
        run: eng/run-method-semantics-platform-probe.sh browser

      - name: Run local-path admission Browser/Wasm probe
        run: eng/run-local-path-admission-platform-probe.sh browser

      - name: Build platform-index generator
        run: dotnet build prototypes/inspect-web/tools/gen-platform-index/genindex.cs

      - name: Build browser frontend
        working-directory: prototypes/inspect-web
        run: |
          npm ci
          npm run analyze
          npm run build
          grep -q '<script type="importmap"></script>' dist/index.html
          grep -Eq '<link rel="preload" id="webassembly"[[:space:]]*/?>' dist/index.html

      - name: Audit shipped browser dependencies
        working-directory: prototypes/inspect-web
        # The runtime libraries are lockfile dependencies, so advisories against the code that
        # reaches a user's browser are visible to `npm audit`. `--audit-level=info` is the
        # strictest setting and is not the default: npm falls back to `low`, which passes a
        # package whose advisories are all `info`. No `--omit=dev`, because that filters by
        # where a package is declared rather than by whether it ships -- Vite is a
        # devDependency and its helpers are in the bundle.
        run: npm audit --audit-level=info

      - name: Check generated inspect-web TypeScript facade for drift
        run: eng/generate-inspect-web-engine-facade.sh --check

      - name: Test shared-runtime multi-facade canary
        run: eng/test-inspect-web-multi-facade-canary.sh

      - name: Typecheck generated ts-jsexport facade
        run: eng/test-ts-jsexport-typescript.sh

      - name: Publish browser app
        run: >
          dotnet publish
          prototypes/inspect-web/engine/InspectWeb.Engine.csproj
          -c Release
          --output artifacts/inspect-web-publish

      - name: Publish MSDL managed API
        run: >
          dotnet publish
          prototypes/inspect-web/msdl-proxy/MsdlProxy.csproj
          -c Release
          --output artifacts/inspect-web-publish/api

      - name: Verify browser site artifact
        shell: bash
        run: |
          set -euo pipefail
          site=artifacts/inspect-web-publish/wwwroot
          api=artifacts/inspect-web-publish/api
          index="$site/index.html"
          test -f "$index"
          test -f "$site/staticwebapp.config.json"
          test -f "$site/inspect-web-engine.js"
          cmp \
            prototypes/inspect-web/engine/wwwroot/inspect-web-engine.js \
            "$site/inspect-web-engine.js"
          test ! -f "$site/inspect-web-engine.ts"
          # The site is deployed from this artifact, so the headers have to be verified
          # where they ship. The toolchain test pins them in the source file; this checks
          # the copy Azure actually reads. Values are compared exactly rather than by
          # prefix -- `max-age=0` starts with `max-age=` and switches HSTS off.
          jq -e '.globalHeaders == {
              "X-Content-Type-Options": "nosniff",
              "Referrer-Policy": "no-referrer",
              "X-Frame-Options": "DENY",
              "Strict-Transport-Security": "max-age=63072000; includeSubDomains"
            }' "$site/staticwebapp.config.json" >/dev/null
          test -f "$api/host.json"
          test -f "$api/functions.metadata"
          test -f "$api/worker.config.json"
          test -f "$api/.azurefunctions/Microsoft.Azure.WebJobs.Extensions.FunctionMetadataLoader.dll"
          jq -e 'any(.[]; .name == "MsdlProxy" and .language == "dotnet-isolated" and any(.bindings[]; .type == "httpTrigger" and .authLevel == "Anonymous" and .methods == ["get"] and .route == "msdl/{pdbFileName}/{symbolKey}"))' "$api/functions.metadata" >/dev/null
          manifest="$site/manifest.json"
          test -f "$manifest"
          jq -e '. as $manifest | type == "object" and (.["index.html"] | type == "object") and all(to_entries[]; (.value | type == "object") and all(((.value.imports // []) + (.value.dynamicImports // []))[]; . as $key | $manifest | has($key)))' "$manifest" >/dev/null
          vite_assets=$(jq -er '[to_entries[].value | .file, (.css[]?), (.assets[]?)] | unique | if length > 0 then join("\n") else error("empty Vite manifest") end' "$manifest")
          while IFS= read -r asset; do
            [[ "$asset" =~ ^assets/([A-Za-z0-9_-][A-Za-z0-9._-]*/)*[A-Za-z0-9_-][A-Za-z0-9._-]*$ ]]
            test -f "$site/$asset"
          done <<< "$vite_assets"
          vite_entry=$(jq -er '.["index.html"].file' "$manifest")
          grep -Fq "src=\"/$vite_entry\"" "$index"
          vite_stylesheets=$(jq -er '.["index.html"].css | if length > 0 then join("\n") else error("missing Vite stylesheet") end' "$manifest")
          while IFS= read -r stylesheet; do
            grep -Fq "href=\"/$stylesheet\"" "$index"
          done <<< "$vite_stylesheets"
          dotnet_module=$(sed -n 's#.*"\./_framework/dotnet\.js": "\./_framework/\([^"]*\.js\)".*#\1#p' "$index" | head -n 1)
          test -n "$dotnet_module"
          test -f "$site/_framework/$dotnet_module"
          for host_only in \
            ILInspector.JsExportSurface \
            ILInspector.TypeScriptGeneration \
            ts-jsexport \
            tsbindgen; do
            if find "$site/_framework" -maxdepth 1 -type f \
              -iname "$host_only.*" -print -quit | grep -q .; then
              echo "Host-only generator artifact reached the browser: $host_only" >&2
              exit 1
            fi
          done
          import_map_line=$(grep -n -m1 '<script type="importmap">' "$index" | cut -d: -f1)
          module_line=$(grep -n -m1 '<script type="module"' "$index" | cut -d: -f1)
          test "$import_map_line" -lt "$module_line"

      - name: Smoke published engine facade
        working-directory: prototypes/inspect-web
        run: >
          node
          scripts/verify-published-engine-facade.ts
          ../../artifacts/inspect-web-publish/wwwroot

      - name: Test browser engine
        run: >
          dotnet run
          --project prototypes/inspect-web/engine.Tests
          -c Release

      - name: Test MSDL managed API
        run: >
          dotnet run
          --project prototypes/inspect-web/msdl-proxy.Tests
          -c Release

      - name: Test inspect-web
        working-directory: prototypes/inspect-web
        run: npm test

      - name: Install Firefox for Annotated Source browser tests
        working-directory: prototypes/inspect-web
        run: npx playwright install --with-deps firefox

      - name: Test Annotated Source in Firefox
        working-directory: prototypes/inspect-web
        run: npm run test:browser

      - name: Test inspect-web promotion validation
        run: dotnet run eng/validate-inspect-web-promotion.cs -- --self-test

      - name: Test annotated-source viewer
        working-directory: prototypes/annotated-source-viewer
        run: npm test

  skill-gate:
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).validations.skillGate
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/*.slnx') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Run embedded skill tests
        shell: bash
        run: |
          set -euo pipefail
          results="$RUNNER_TEMP/skill-tests.xml"
          dotnet run --project src/dotnet-inspect.Tests -c Release -- \
            -class "DotnetInspector.Tests.SkillCommandTests" \
            -xml "$results"
          if ! grep -Eq 'total="[1-9][0-9]*"' "$results"; then
            echo "::error::Skill test filter selected no tests." >&2
            exit 1
          fi

  # Build and run the PR test matrix on Ubuntu 24.04. Windows, macOS, and Ubuntu
  # 26.04 compatibility suites run daily in Deep Inspect, where
  # platform-specific failures do not hold the predominantly Linux and macOS
  # development fleet on the much slower Windows runner.
  #
  # Runs on PRs only. A pull_request build validates the PR merged into the
  # current base, so re-running the full test suite on the push to main is
  # redundant; we skip it there to cut Actions minutes (the test job is the
  # most expensive leg) and to reduce queued-job contention when many agents
  # have PRs in flight at once. Release packages are built by release.yml at
  # publish time, not here.
  #
  # Keep the primary Linux lane on the GA image so ordinary code PRs do not
  # compete for preview-image capacity. Path-gated specialist jobs, Deep
  # Inspect, and release publishing continue to exercise ubuntu-26.04.
  test:
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).validations.test
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_INSPECT_TIPS: q
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/*.slnx') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Build
        run: dotnet build dotnet-inspect.slnx -c Release

      - name: Run MethodSemantics NativeAOT probe
        run: eng/run-method-semantics-platform-probe.sh nativeaot ${{ matrix.rid }}

      - name: Run local-path admission NativeAOT probe
        run: eng/run-local-path-admission-platform-probe.sh nativeaot ${{ matrix.rid }}

      - name: Build package-manifest corpus verifier
        run: dotnet build eng/verify-package-manifest-corpus.cs -c Release

      - name: Prepare PR decompiler corpus
        run: |
          mkdir -p artifacts/decompiler-pr-corpus
          bash eng/prepare-decompiler-pr-corpus.sh artifacts/decompiler-pr-corpus/assemblies.txt

      - name: Run PR decompiler corpus sensor
        id: decompiler_pr_corpus
        continue-on-error: true
        shell: bash
        run: |
          mapfile -t assemblies < artifacts/decompiler-pr-corpus/assemblies.txt
          set +e
          dotnet run --project tools/DecompilerHarness -c Release -- "${assemblies[@]}" \
            --emit-corpus-snapshot artifacts/decompiler-pr-corpus/snapshot.json \
            --diff-corpus-baseline tools/DecompilerHarness/corpus/pr-quick-baseline.json \
            --quality-diff-card \
            --corpus-method-cap 100 \
            --compile-cap 0 \
            --corpus-fidelity-cap 0 \
            --max-examples 3 \
            | tee artifacts/decompiler-pr-corpus/quality-diff-card.md
          status=${PIPESTATUS[0]}
          echo "$status" > artifacts/decompiler-pr-corpus/exit-code.txt
          exit "$status"

      - name: Upload PR decompiler corpus artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: decompiler-pr-corpus
          path: artifacts/decompiler-pr-corpus/
          if-no-files-found: error

      - name: Check PR decompiler corpus result
        if: steps.decompiler_pr_corpus.outcome == 'failure'
        run: exit 1

      # --mdv matters here because this lane runs
      # tests/ILInspector.Metadata.Tests, whose cross-implementation oracle
      # skips without it -- and a skipped oracle is a green leg that compared
      # nothing. Deep Inspect restores the same oracle for its platform lane.
      #
      # continue-on-error lets the rest of the lane still report, so a feed
      # outage does not cost every other result in the job. It does not make
      # the failure survivable: `Check ilasm/ildasm/mdv result` below fails the
      # lane once the tests have run. Losing oracle coverage must be red, not a
      # quietly shorter skip list.
      - name: Install ilasm/ildasm/mdv
        id: iltools
        continue-on-error: true
        shell: bash
        run: eng/restore-iltools.sh --rid ${{ matrix.rid }} --mdv >> "$GITHUB_PATH"

      - name: Run CLI tests (fast)
        run: dotnet run --project src/dotnet-inspect.Tests -c Release -- -trait- "Speed=Slow"

      - name: Run GitHub Packages fixture test
        id: package_fixture
        continue-on-error: true
        shell: bash
        env:
          DOTNET_INSPECT_PACKAGE_FIXTURE_USER: ${{ github.actor }}
          DOTNET_INSPECT_PACKAGE_FIXTURE_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          results="$RUNNER_TEMP/package-fixture-tests.xml"
          dotnet run --project src/dotnet-inspect.Tests -c Release --no-build -- \
            -method '*Package_Manifest_RendersToolManifestRows*' \
            -xml "$results"
          if ! grep -Eq 'total="[1-9][0-9]*"' "$results"; then
            echo "::error::Package fixture test filter selected no tests." >&2
            exit 1
          fi
          if ! grep -Eq '<assembly[^>]+skipped="0"' "$results"; then
            echo "::error::Package fixture test skipped authenticated execution." >&2
            exit 1
          fi

      - name: Run CSharpText tests
        run: dotnet run --project tests/CSharpText.Tests -c Release

      - name: Run artifact contract tests
        run: dotnet run --project src/DotnetInspector.Artifacts.Tests -c Release

      - name: Run row-selection tests
        run: dotnet run --project src/DotnetInspector.RowSelection.Tests -c Release

      - name: Run instruction-substrate tests
        run: dotnet run --project src/ILInspector.Instructions.Tests -c Release

      - name: Run IL diff tests
        run: dotnet run --project src/ILInspector.ILDiff.Tests -c Release

      - name: Run metadata tests
        run: dotnet run --project tests/ILInspector.Metadata.Tests -c Release

      - name: Run fixture catalog tests
        run: dotnet run --project tests/DotnetInspector.Fixtures.Tests -c Release

      - name: Run services tests
        run: dotnet run --project src/DotnetInspector.Services.Tests -c Release

      - name: Run inspection query tests
        run: dotnet run --project src/DotnetInspector.Queries.Tests -c Release

      # NuGetFetch is the HTTP and credential layer. Its live-network tests are tagged
      # [Trait("Network", "Live")] and excluded here: the nuget.org ones would make the gate
      # depend on a third-party service, and the Azure DevOps ones need a private feed and a
      # token that CI — and any fork PR — does not have. Everything that can be proven with an
      # in-memory transport, including the whole credential-mechanism matrix, runs here.
      - name: Run NuGetFetch tests (offline)
        run: dotnet run --project src/NuGetFetch.Tests -c Release -- -trait- "Network=Live"

      # InertText sits below every other project, so a regression here reaches every assembly
      # that prints artifact-derived text. The gates are pure and fast — a full BMP sweep and a
      # round-trip — so they run unconditionally rather than behind a path filter.
      - name: Run InertText tests
        run: dotnet run --project src/InertText.Tests -c Release

      # Fast decompiler unit tests: pass logic, printer, importer facts, identity,
      # and classification regressions. Slow compile-back/recompile, corpus-sweep,
      # and fidelity tests are tagged [Trait("Speed", "Slow")] and excluded here;
      # the full suite (including those) runs in Deep Inspect. Mark any
      # new Roslyn-heavy/recompile test Slow so it stays out of the PR gate.
      - name: Run decompiler unit tests (fast)
        run: dotnet run --project src/ILInspector.Decompiler.Tests -c Release -- -trait- "Speed=Slow"

      - name: Run analysis tests (fast)
        run: dotnet run --project src/ILInspector.Analysis.Tests -c Release -- -trait- "Speed=Slow"

      # The runtime-async compiler switch changes IL lowering without changing
      # whether the fixture builds. Run the focused owner gates so CI proves
      # both lowerings issue equal authenticated JSExport wire facts.
      - name: Run JSExport runtime-async wire gates
        run: |
          set -euo pipefail
          results="$RUNNER_TEMP/jsexport-runtime-async-wire-tests.xml"
          dotnet run --project tests/ILInspector.JsExportSurface.Tests \
            -c Release --no-build -- \
            -method '*Build_ProducesEqualWireFactsAcrossAsyncLoweringsForDirectSerializerResult*' \
            -method '*Build_ProducesEqualWireFactsAcrossAsyncLoweringsForSerializerStoredAcrossSuspension*' \
            -method '*Build_RejectsConditionalSerializerStoreAcrossAsyncLowerings*' \
            -method '*RuntimeAsync*' \
            -xml "$results"
          if ! grep -Eq 'total="[1-9][0-9]*"' "$results"; then
            echo "::error::JSExport runtime-async wire test filters selected no tests." >&2
            exit 1
          fi
          for method in \
            Build_ProducesEqualWireFactsAcrossAsyncLoweringsForDirectSerializerResult \
            Build_ProducesEqualWireFactsAcrossAsyncLoweringsForSerializerStoredAcrossSuspension \
            Build_RejectsConditionalSerializerStoreAcrossAsyncLowerings
          do
            if ! grep -Fq "method=\"$method\"" "$results"; then
              echo "::error::JSExport runtime-async wire gate '$method' did not run." >&2
              exit 1
            fi
          done

      - name: Run ts-jsexport generator acceptance gates
        run: |
          set -euo pipefail
          results="$RUNNER_TEMP/ts-jsexport-generator-tests.xml"
          dotnet run --project tests/ILInspector.JsExportSurface.Tests \
            -c Release --no-build -- \
            -class 'ILInspector.JsExportSurface.Tests.JsonNamingPoliciesTests' \
            -class 'ILInspector.JsExportSurface.Tests.JsExportContextLoaderTests' \
            -class 'ILInspector.JsExportSurface.Tests.TypeScriptFacadeEmitterTests' \
            -class 'ILInspector.JsExportSurface.Tests.TsJsExportContractsTests' \
            -class 'ILInspector.JsExportSurface.Tests.TsJsExportCommandTests' \
            -xml "$results"
          for class in \
            ILInspector.JsExportSurface.Tests.JsonNamingPoliciesTests \
            ILInspector.JsExportSurface.Tests.JsExportContextLoaderTests \
            ILInspector.JsExportSurface.Tests.TypeScriptFacadeEmitterTests \
            ILInspector.JsExportSurface.Tests.TsJsExportContractsTests \
            ILInspector.JsExportSurface.Tests.TsJsExportCommandTests
          do
            if ! grep -Fq "type=\"$class\"" "$results"; then
              echo "::error::ts-jsexport generator gate '$class' selected no tests." >&2
              exit 1
            fi
          done
          negative_results="$RUNNER_TEMP/ts-jsexport-negative-tests.xml"
          dotnet run --project tests/ILInspector.JsExportSurface.Tests \
            -c Release --no-build -- \
            -method '*Emit_DoesNotApplyDictionarySemanticsToLookalikeType*' \
            -method '*Emit_RejectsUnresolvedStructuredProducerWithIntrinsicSpelling*' \
            -method '*GeneratorLoader_ReadsOneImageForMetadataAndBodyEvidence*' \
            -xml "$negative_results"
          for method in \
            Emit_DoesNotApplyDictionarySemanticsToLookalikeType \
            Emit_RejectsUnresolvedStructuredProducerWithIntrinsicSpelling \
            GeneratorLoader_ReadsOneImageForMetadataAndBodyEvidence
          do
            if ! grep -Fq "method=\"$method\"" "$negative_results"; then
              echo "::error::ts-jsexport negative gate '$method' did not run." >&2
              exit 1
            fi
          done

      - name: Run ts-jsexport context NativeAOT gate
        run: eng/test-ts-jsexport-context-aot.sh "${{ matrix.rid }}"

      - name: Run runfaster tests
        run: dotnet run --project src/runfaster.Tests -c Release

      # Fast IL round-trip oracle: focused fixture and handwritten IL cases run
      # in PR CI when the round-trip tests or source dependencies change. The
      # assembly-wide sweep is tagged [Trait("Speed", "Slow")] and runs in
      # Deep Inspect / full local runs.
      - name: Restore vendored ILAssembler
        if: matrix.rid == 'linux-x64' && fromJSON(needs.changes.outputs.plan).validations.ilRoundTrip
        run: bash eng/restore-ilassembler.sh

      - name: Run IL round-trip tests (fast)
        if: matrix.rid == 'linux-x64' && fromJSON(needs.changes.outputs.plan).validations.ilRoundTrip
        run: dotnet run --project tests/DotnetInspector.ILRoundtrip.Tests -c Release -- -trait- "Speed=Slow"

      # Terminal checks: the suites above still report their results when
      # acquisition fails, but the lane must not go green having silently
      # traded external evidence for skips.
      - name: Check ilasm/ildasm/mdv result
        if: steps.iltools.outcome == 'failure'
        run: |
          echo "::error::Restoring ilasm/ildasm/mdv failed, so every test that uses them skipped." >&2
          echo "This lane cannot certify oracle-backed results. See the 'Install ilasm/ildasm/mdv' step." >&2
          exit 1

      - name: Check GitHub Packages fixture result
        if: steps.package_fixture.outcome == 'failure'
        run: |
          echo "::error::The authenticated GitHub Packages fixture test failed." >&2
          echo "This lane cannot certify hosted fixture consumption. See the fixture test step." >&2
          exit 1

  # net10.0 fallback build coverage. The official non-AOT "any" package targets
  # the net10.0 LTS floor (Directory.Build.props), but the full test lane builds
  # net11 only — so net11-only API usage on the fallback path is invisible until
  # an official package build. This job compiles the shipped tool graph against
  # net10.0 so that class of regression is caught on PRs that touch shipped code
  # (#2594). Build-only and fast; the net10.0 targeting pack resolves from the
  # SDK / nuget.org.
  build-net10:
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).validations.buildNet10
    runs-on: ubuntu-26.04
    env:
      DOTNET_INSPECT_TIPS: q
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/*.slnx') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Build tool for net10.0 fallback
        run: dotnet build src/dotnet-inspect -c Release -p:DefaultTargetFramework=net10.0 -p:PublishAot=false

  # Decompiler docket and byte-neutrality gates, pre-merge.
  #
  # These gates carry doc comments asserting they fail CI, but every pre-merge
  # lane runs `-trait- "Speed=Slow"` and they are all Slow, so until now they
  # historically ran only in release.yml and the then-weekly Deep Inspect lane
  # — where they were exceeding the job timeout, and a *cancelled* job does not satisfy Deep
  # Inspect's `if: ... && failure()` notifier. Detection latency was unbounded,
  # not weekly (#3432). Five real regressions (#3489-#3493) accumulated unseen.
  #
  # This job runs the gates whose failures are attributable to a specific
  # fixture and docket entry, as its own job so it never serializes with the
  # hot `test` lane. Currently-open failures are pinned in
  # eng/decompiler-gate-known-red.txt; the checker fails on any unpinned
  # failure, on any pin that starts passing, and on any gate test that neither
  # passes nor fails, so the pin list is a ratchet in both directions rather
  # than a permanent exemption.
  #
  # NOTE: this path-gated job must never be named as a required status check
  # directly. A required check that does not run on a given PR is reported as
  # "Expected" forever and blocks that merge permanently, and this job is
  # skipped on any PR that touches no decompiler-relevant path. Its result
  # reaches `ci-required`, the aggregate job at the end of this file that is
  # intended to serve as the merge gate and be the one context the ruleset
  # requires.
  #
  # SkeletonEmitTests remains a whole-module skeleton check, but #3872 made its
  # eight cases tractable by selecting the asserted method before per-method
  # import/render/recompile work. The skeleton itself is not narrowed; a
  # duplicate-unrelated-type mutation pins that contract.
  #
  # Completeness is case-granular (#3837). Discovery uses pre-enumerated full
  # JSON, and the run's JSON reporter carries the same stable TestCaseUniqueID.
  # The checker requires every discovered ID to start exactly one test. That
  # last condition is what makes the design fail closed: non-serializable theory
  # data falls back to one delayed discovery case that starts several tests, so
  # a set-only case-ID comparison would still be incomplete.
  decompiler-gates:
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).validations.decompilerGates
    runs-on: ubuntu-26.04
    # Job timeout raised 55 -> 65 with the step timeout below (#3827).
    # The two must move together: the design depends on the *step* timeout
    # firing first, with enough of the job budget left for the checker and the
    # artifact upload to still run and fail loudly. Measured on this job: the
    # gate starts around minute 3, so a step that burns its full 45 gives up
    # around minute 48. A 65-minute job leaves ~17 minutes for the checker,
    # artifact upload, and runner-side setup/build variance, preserving the
    # deliberate gap that keeps a hung gate loud instead of cancelling the job.
    # A healthy serialized run finishes in 30m37s.
    timeout-minutes: 65
    env:
      DOTNET_INSPECT_TIPS: q
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      # Caches packages only. Do not add build outputs (artifacts/, bin/, obj/)
      # here. The completeness check compares a discovery listing against XML
      # and JSON execution results, and both steps below run with --no-build
      # against whatever the Build step produced. That comparison is only
      # meaningful because all artifacts provably come from one build: the
      # checkout is fresh, nothing
      # restores binaries, and Build is fail-fast, so neither step can run
      # against a stale or partial binary. Caching build outputs would break
      # that silently -- the gate would still pass, while comparing a listing
      # and a report from different builds.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/*.slnx') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-

      # The gates decompile and recompile the fixture assemblies, so the whole
      # solution must be built: building only the test project leaves the
      # fixtures absent and the gates fail with a FileNotFoundException that
      # reads exactly like a product regression.
      #
      # Deliberately not continue-on-error: the two --no-build steps below
      # depend on this having succeeded.
      - name: Build
        run: dotnet build dotnet-inspect.slnx -c Release

      # Enumerate what the preset selects, without running it. This is the
      # reference the completeness check compares the results against; the
      # report's own summary counters cannot serve, because an honestly
      # truncated report declares its own smaller total and agrees with itself.
      #
      # Uses --gate pre-merge, the same preset as the run below, so the two
      # cannot drift. Sub-second, and not continue-on-error: if discovery fails
      # there is no reference and the gate must not proceed.
      - name: Discover expected gate tests
        run: |
          dotnet run --project src/ILInspector.Decompiler.Tests -c Release --no-build -- \
            --gate pre-merge -preEnumerateTheories -noColor -list full/json \
            > "$RUNNER_TEMP/decompiler-gates-expected.json"

      # continue-on-error so the pinned known-red failures do not fail the job
      # here; eng/check-decompiler-gate.cs decides pass/fail from the report.
      #
      # The step timeout is the point, not a formality. This PR exists because
      # a *job* timeout cancels the job, and a cancelled job runs no further
      # steps and satisfies no `failure()` condition — it fails silently. A
      # step timeout well under the job timeout converts a hang into a failed
      # step that the job survives, so the checker still runs, finds a missing
      # or truncated report, and fails the job loudly. Do not raise this to the
      # job timeout.
      #
      # Serializing the fidelity workload classes (#3827, #3872) removes the
      # Roslyn reference-binding overlap but necessarily raises wall time. The
      # first PR run measured the former 45-test preset at 27m24s on this runner
      # (build 2m38s, discovery 1s, checker 4s, job total 30m37s), up from
      # 21m30s in parallel. The four theory-bearing classes contribute only 42
      # cases in 2.4s locally. SkeletonEmitTests adds eight cases, but method
      # selection reduced that class from 374.25s to 13.31s locally while
      # retaining whole-module emit. That measured serialized preset completed
      # in 729.56s locally. The 45-minute step therefore remains well
      # below the 65-minute job timeout, which is what keeps a hang loud.
      #
      # Re-measure and re-tune both numbers together whenever the preset or its
      # collection topology changes.
      #
      # --no-build is required, not an optimization. Without it `dotnet run`
      # builds implicitly, which would (a) break the guarantee that this run and
      # the discovery listing above describe the same binary, and (b) hide a
      # build failure inside a continue-on-error step, where it would surface
      # only as a missing report.
      - name: Run decompiler gates
        id: gates
        continue-on-error: true
        timeout-minutes: 45
        run: |
          set -o pipefail
          dotnet run --project src/ILInspector.Decompiler.Tests -c Release --no-build -- \
            --gate pre-merge -preEnumerateTheories -noColor -noAutoReporters \
            -reporter json -xml "$RUNNER_TEMP/decompiler-gates.xml" \
            | tee "$RUNNER_TEMP/decompiler-gates-events.jsonl"

      - name: Compare against pinned known-red
        run: |
          dotnet run eng/check-decompiler-gate.cs -- \
            "$RUNNER_TEMP/decompiler-gates.xml" \
            "$RUNNER_TEMP/decompiler-gates-events.jsonl" \
            eng/decompiler-gate-known-red.txt \
            eng/decompiler-gate-expected-classes.txt \
            "$RUNNER_TEMP/decompiler-gates-expected.json"

      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decompiler-gates-report
          path: |
            ${{ runner.temp }}/decompiler-gates.xml
            ${{ runner.temp }}/decompiler-gates-events.jsonl
            ${{ runner.temp }}/decompiler-gates-expected.json
          if-no-files-found: warn

  # Cheap C# Diff harness coverage. Path-gated separately from the full test
  # lane so CSharpDiffHarness/card changes get focused snapshot/baseline JSONL
  # coverage without forcing most PRs through extra work.
  csharp-diff-smoke:
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).validations.csharpDiffSmoke
    runs-on: ubuntu-26.04
    env:
      DOTNET_INSPECT_TIPS: q
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/*.slnx') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Build C# Diff harness and fixtures
        run: |
          dotnet build tools/CSharpDiffHarness/CSharpDiffHarness.csproj -c Release
          dotnet build src/DiffFixtures.V1/DiffFixtures.V1.csproj -c Release
          dotnet build src/DiffFixtures.V2/DiffFixtures.V2.csproj -c Release

      - name: Run C# Diff baseline smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/csharp-diff-smoke
          old=artifacts/bin/DiffFixtures.V1/release/DiffFixtureSample.dll
          new=artifacts/bin/DiffFixtures.V2/release/DiffFixtureSample.dll

          dotnet run --project tools/CSharpDiffHarness -c Release --no-build -- \
            "$old" "$new" \
            --emit-snapshot artifacts/csharp-diff-smoke/snapshot.json \
            --format jsonl \
            --max-examples 0 \
            > artifacts/csharp-diff-smoke/snapshot.jsonl

          dotnet run --project tools/CSharpDiffHarness -c Release --no-build -- \
            "$old" "$new" \
            --diff-baseline tools/CSharpDiffHarness/corpus/diff-fixtures-baseline.json \
            --format jsonl \
            --max-examples 0 \
            > artifacts/csharp-diff-smoke/baseline.jsonl

          cat > /tmp/csharp-diff-mutate-baseline.cs <<'CS'
          using System.Text.Json.Nodes;
          var node = JsonNode.Parse(File.ReadAllText(args[0]))!.AsObject();
          node["Summary"]!["FailureCount"] = 0;
          node["FailureBuckets"] = new JsonArray();
          File.WriteAllText(args[1], node.ToJsonString(new System.Text.Json.JsonSerializerOptions { WriteIndented = true }) + Environment.NewLine);
          CS
          dotnet run /tmp/csharp-diff-mutate-baseline.cs -- \
            artifacts/csharp-diff-smoke/snapshot.json \
            artifacts/csharp-diff-smoke/regression-baseline.json

          set +e
          dotnet run --project tools/CSharpDiffHarness -c Release --no-build -- \
            "$old" "$new" \
            --diff-baseline artifacts/csharp-diff-smoke/regression-baseline.json \
            --format jsonl \
            --max-examples 0 \
            > artifacts/csharp-diff-smoke/regression.jsonl
          status=$?
          set -e
          test "$status" -eq 1

          cat > /tmp/csharp-diff-parse-jsonl.cs <<'CS'
          using System.Text.Json;
          foreach (var path in args)
          {
              foreach (var line in File.ReadLines(path))
              {
                  if (string.IsNullOrWhiteSpace(line))
                      continue;
                  JsonDocument.Parse(line).Dispose();
              }
          }
          CS
          dotnet run /tmp/csharp-diff-parse-jsonl.cs -- \
            artifacts/csharp-diff-smoke/snapshot.jsonl \
            artifacts/csharp-diff-smoke/baseline.jsonl \
            artifacts/csharp-diff-smoke/regression.jsonl

      - name: Upload C# Diff smoke artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: csharp-diff-smoke
          path: artifacts/csharp-diff-smoke/
          if-no-files-found: warn

  # Cheap IL Diff harness coverage. It is path-gated separately from the full
  # test lane so most PRs do no more than their existing build/test work, while
  # IL Diff-specific changes get a focused snapshot/baseline JSONL smoke.
  il-diff-smoke:
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).validations.ilDiffSmoke
    runs-on: ubuntu-26.04
    env:
      DOTNET_INSPECT_TIPS: q
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
