name: PR CI

on:
  # Main pushes enter through main-ci.yml so GitHub can display a distinct
  # workflow name while this file remains the single owner of CI jobs.
  workflow_call:
    inputs:
      event-name:
        required: true
        type: string
      base-sha:
        required: true
        type: string
  # Deliberately unfiltered by base branch. A base-branch filter decides whether
  # a *stacked* PR gets CI at all: a PR retargeted from `main` onto a long-lived
  # branch silently stops matching, so it reports no checks rather than failing
  # ones -- and "no checks reported" is indistinguishable at a glance from "not
  # run yet", while `ci-required` counts a job that never ran as nothing to
  # block on.
  #
  # An allow list here has to name every prefix a *base* can have, which is every
  # prefix a branch can have, since any branch under review can be stacked on.
  # That is not a list that can be maintained, and each way of getting it wrong
  # is silent: `[main]` alone missed every stacked PR, adding `feature/**` still
  # left `fix/**` uncovered (#3684 opened onto `fix/3628-...` and reported no
  # checks), and adding `fix/**` still left #3558 -- open onto
  # `prototype/wasm-command-ui` -- mergeable with zero checks (#3706).
  #
  # So the filter is gone rather than extended. Every pull request runs CI
  # whatever it targets. The cost is CI on PRs between side branches; the cost
  # of the allow list was PRs that merge with no CI at all and look clean doing
  # it.
  pull_request:
  # Merge queue candidates must report the same `ci-required` check as ordinary
  # PRs. The synthetic head is classified against merge_group.base_sha below.
  merge_group:
    types: [checks_requested]

# Least privilege by default. Jobs needing more declare it themselves; a
# job-level block replaces this default rather than adding to it.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

# Cancel superseded PR runs (e.g. when an agent pushes again to the same branch)
# so only the latest commit of a PR consumes a full CI run. Pushes to main are
# not cancelled; web-relevant pushes run inspect-web as a post-merge backstop,
# while the other expensive lanes remain PR/merge-queue-only. release.yml builds
# all release packages fresh at publish time and does not consume CI artifacts.
#
# The group keys on the pull request *number*, not `github.head_ref`. Branch
# names are not unique across forks, so two PRs both branched as `patch-1`
# would share a group and cancel each other. That was merely wasteful while CI
# was advisory; once `ci-required` is required, the loser's check would land as
# `cancelled` and block that PR until someone re-ran it by hand.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Plan the validations selected by this exact candidate.
  #
  # This entry job uses the GA image deliberately. Every workflow run waits on
  # it before path-gated jobs can be selected, so preview-image capacity must
  # not serialize the entire PR queue. Specialized jobs below retain
  # ubuntu-26.04 coverage without making it the scheduler for every run.
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 20
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history. The planner must resolve both exact endpoint commits;
          # a push's before commit is not always the immediate parent.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.100-rc.1.26425.128'

      - name: Self-test change detection
        shell: bash
        run: dotnet run eng/test-ci-change-detection.cs
        env:
          BASH_ENV: ""

      - name: Plan changes
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          evidence_directory="${RUNNER_TEMP}/ci-plan"
          mkdir -p "$evidence_directory"
          case "$CI_EVENT_NAME" in
            pull_request)
              event_name="pull-request"
              base_sha=$(git rev-parse --verify 'HEAD^1')
              ;;
            merge_group)
              event_name="merge-group"
              base_sha="$CI_EVENT_BASE_SHA"
              ;;
            push)
              event_name="push"
              base_sha="$CI_EVENT_BASE_SHA"
              ;;
            *)
              echo "Unsupported CI planning event: $CI_EVENT_NAME" >&2
              exit 1
              ;;
          esac
          plan=$(
            dotnet run eng/ci-plan.cs -- "$event_name" \
              --base "$base_sha" \
              --candidate "$GITHUB_SHA" \
              --evidence-directory "$evidence_directory" \
              --repository "$GITHUB_WORKSPACE"
          )
          if [[ "$plan" == *$'\n'* ]]; then
            echo "ci-plan emitted more than one line" >&2
            exit 1
          fi
          jq -e '
            type == "object"
            and .schemaVersion == 8
            and .status == "planned"
          ' <<< "$plan" > /dev/null
          printf 'plan=%s\n' "$plan" >> "$GITHUB_OUTPUT"
        env:
          # The runner honors BASH_ENV even with --noprofile and --norc.
          # Clear inherited workflow/job values before executing this gate.
          BASH_ENV: ""
          CI_EVENT_NAME: ${{ inputs.event-name || github.event_name }}
          CI_EVENT_BASE_SHA: ${{ inputs.base-sha || github.event.merge_group.base_sha || github.event.before }}

      - name: Upload TLA+ scope evidence
        if: fromJSON(steps.plan.outputs.plan).validations.tla
        uses: actions/upload-artifact@v7
        with:
          name: ${{ fromJSON(steps.plan.outputs.plan).scopes.tla.artifact }}
          path: ${{ runner.temp }}/ci-plan/${{ fromJSON(steps.plan.outputs.plan).scopes.tla.artifact }}
          if-no-files-found: error
          retention-days: 1

      - name: Run markdownlint
        if: fromJSON(steps.plan.outputs.plan).validations.markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: '**/*.md'

      - name: Cache NuGet packages for skill tests
        if: fromJSON(steps.plan.outputs.plan).validations.skillGate && !fromJSON(steps.plan.outputs.plan).validations.test
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/*.slnx') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Run embedded skill tests
        if: fromJSON(steps.plan.outputs.plan).validations.skillGate && !fromJSON(steps.plan.outputs.plan).validations.test
        shell: bash
        run: dotnet run --project tests/DotnetInspect.Cli.Tests -c Release -- --filter-class "DotnetInspect.Cli.Tests.SkillCommandTests"

  # Resolve committed EVIL observations against full Git history in parallel
  # with change planning. The required aggregate waits for both independent
  # gates, while path-gated jobs can start as soon as planning completes.
  provenance:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.100-rc.1.26425.128'

      - name: Check EVIL history provenance
        shell: bash
        env:
          # After editing `run`, refresh this colocated acknowledgement with:
          # dotnet run eng/test-ci-change-detection.cs -- --refresh-evil-provenance-pin
          EVIL_PROVENANCE_RUN_SHA256: AFD8804F209E05792867D7776A950AE6B0EA459F32F896782F0C6B794F5A4B76
        run: >
          dotnet run --project tools/DecompilerHarness -c Release --
          --verify-authored-corpus-history

  # Upholds the bar in docs/tla-plus-methodology.md for TLA+ models changed by
  # this candidate: SANY parses every selected module, and TLC runs the selected
  # directories' .cfg files to completion. Contract-defining configurations in
  # eng/tla-expected-exit-codes.txt must produce their exact semantic verdict;
  # unlisted legacy configurations retain the coherent-verdict policy because
  # some are negative controls without machine-readable expectations.
  tla-plus:
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).validations.tla
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Download TLA+ scope evidence
        uses: actions/download-artifact@v8
        with:
          name: ${{ fromJSON(needs.changes.outputs.plan).scopes.tla.artifact }}
          path: ${{ runner.temp }}/ci-plan

      - name: Self-test TLA+ runner scope
        shell: bash
        run: eng/test-tla-checks.sh

      # Ubuntu 26.04's default-jre metapackage resolves to OpenJDK 25,
      # matching the Java pin in docs/runbooks/tla-plus-setup.md.
      - name: Install Java
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre

      - name: Cache tla2tools.jar
        id: cache-tla
        uses: actions/cache@v6
        with:
          path: ~/.local/share/tlaplus/tla2tools.jar
          # Include the asset digest so a later pin cannot reuse cached bytes
          # from a different build.
          key: tla2tools-v1.8.0-ab323b79802aedc3

      # Pinned per docs/runbooks/tla-plus-setup.md: upstream v1.8.0 is a
      # rolling channel whose prior assets disappear. Fetch the immutable
      # mirrored build instead of the mutable upstream tag.
      - name: Download tla2tools.jar
        if: steps.cache-tla.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/.local/share/tlaplus
          curl -fLo ~/.local/share/tlaplus/tla2tools.jar \
            https://github.com/zactionsz/tla-tools/releases/download/tla2tools-2026.08.11.125311/tla2tools.jar

      # A cache key alone is not an integrity check: substituted release bytes
      # or a poisoned cache entry would otherwise execute unverified bytecode
      # via the "Run TLA+ checks" step below with no diagnostic. Verify on
      # every run -- cache hits included -- not only after a fresh download.
      - name: Verify tla2tools.jar checksum
        run: |
          set -euo pipefail
          echo "ab323b79802aedc3203b3f9af37c6aca3ed43f4e0225b36f2aa77b26de46c05f  $HOME/.local/share/tlaplus/tla2tools.jar" \
            | sha256sum -c -

      - name: Run TLA+ checks
        shell: bash
        env:
          TLA_SCOPE_ARTIFACT: ${{ fromJSON(needs.changes.outputs.plan).scopes.tla.artifact }}
          TLA_SCOPE_FRAMING: ${{ fromJSON(needs.changes.outputs.plan).scopes.tla.framing }}
          TLA_SCOPE_RECORD_COUNT: ${{ fromJSON(needs.changes.outputs.plan).scopes.tla.recordCount }}
          TLA_SCOPE_SHA256: ${{ fromJSON(needs.changes.outputs.plan).scopes.tla.sha256 }}
        run: |
          set -euo pipefail
          if [ "$TLA_SCOPE_ARTIFACT" != "ci-plan-tla-paths0" ]; then
            echo "::error::The TLA+ scope artifact identity is unsupported."
            exit 1
          fi
          if [ "$TLA_SCOPE_FRAMING" != "pathBytesNulTerminated" ]; then
            echo "::error::The TLA+ scope framing is unsupported."
            exit 1
          fi
          scope_file="${RUNNER_TEMP}/ci-plan/${TLA_SCOPE_ARTIFACT}"
          if [ ! -f "$scope_file" ]; then
            echo "::error::The planned TLA+ scope evidence is missing."
            exit 1
          fi
          actual_sha256=$(sha256sum "$scope_file" | cut -d ' ' -f 1)
          if [ "$actual_sha256" != "$TLA_SCOPE_SHA256" ]; then
            echo "::error::The TLA+ scope evidence digest does not match the plan."
            exit 1
          fi
          actual_record_count=$(
            LC_ALL=C tr -cd '\000' < "$scope_file" |
              wc -c |
              tr -d '[:space:]'
          )
          if [ "$actual_record_count" != "$TLA_SCOPE_RECORD_COUNT" ]; then
            echo "::error::The TLA+ scope evidence record count does not match the plan."
            exit 1
          fi
          export TLA_TOOLS_JAR="$HOME/.local/share/tlaplus/tla2tools.jar"
          # Tighter than the script's 600s local-dev default: this repo's
          # shared CI runners are slower than a typical contributor
          # machine, and a per-invocation cap this size still leaves ample
          # room under the job's timeout-minutes even if several configs
          # hit it (a hit is a warning, not a failure -- see
          # eng/run-tla-checks.sh).
          export TLA_CHECK_TIMEOUT_SECONDS=120
          eng/run-tla-checks.sh --changed-files0 < "$scope_file"

  # Keep focused Browser/Wasm platform probes in PR CI. Deep Inspect owns
  # complete engine, facade, canary, browser, and published-application checks.
  # Upholds the build bar in docs/lean-methodology.md for every Lean model:
  # the pinned toolchain, no package dependencies, ignored .lake output, no
  # axiom declarations or sorry, and a clean build with no warnings. All models
  # are checked because the set is small and each builds in seconds.
  lean:
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).validations.lean
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Cache Lean toolchain archive
        id: cache-lean
        uses: actions/cache@v6
        with:
          path: ~/.cache/lean/lean-4.34.1-linux.tar.zst
          # Include the asset digest so a later pin cannot reuse cached bytes
          # from a different build.
          key: lean-4.34.1-linux-47bf4bbd78f70c2e

      - name: Download Lean toolchain archive
        if: steps.cache-lean.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/.cache/lean
          curl -fLo ~/.cache/lean/lean-4.34.1-linux.tar.zst \
            https://github.com/leanprover/lean4/releases/download/v4.34.1/lean-4.34.1-linux.tar.zst

      # Verify on every run, cache hits included, before any byte executes.
      - name: Install Lean toolchain
        run: |
          set -euo pipefail
          echo "47bf4bbd78f70c2e9670598ab7124d92b6efb7330ff33e5fbb4030f6fd72e4e4  $HOME/.cache/lean/lean-4.34.1-linux.tar.zst" \
            | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/lean"
          tar --zstd -xf ~/.cache/lean/lean-4.34.1-linux.tar.zst -C "$RUNNER_TEMP/lean"
          lean_bin=$(dirname "$(find "$RUNNER_TEMP/lean" -maxdepth 3 -path '*/bin/lake' -type f -print -quit)")
          "$lean_bin/lean" --version | grep -F 'version 4.34.1'
          echo "$lean_bin" >> "$GITHUB_PATH"

      - name: Self-test Lean runner
        shell: bash
        run: eng/test-lean-checks.sh

      - name: Run Lean checks
        shell: bash
        run: eng/run-lean-checks.sh

  inspect-web-platform:
    name: inspect-web platform probes
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).validations.inspectWeb
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.100-rc.1.26425.128'

      - name: Install browser Wasm workload
        run: dotnet workload install wasm-experimental

      - name: Run MethodSemantics Browser/Wasm platform probe
        run: eng/run-method-semantics-platform-probe.sh browser

      - name: Run local-path admission Browser/Wasm platform probe
        run: eng/run-local-path-admission-platform-probe.sh browser

  inspect-web-msdl-tests:
    name: inspect-web managed API tests
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).validations.inspectWeb
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.100-rc.1.26425.128'

      - name: Install .NET 10 runtime (inspect-web test target)
        run: |
          set -e
          if curl -fsSL --retry 3 https://aka.ms/dotnet/dotnetup/daily/get-dotnetup.sh -o /tmp/get-dotnetup.sh \
            && bash /tmp/get-dotnetup.sh --install-dir /tmp/dotnetup \
            && /tmp/dotnetup/dotnetup runtime install aspnetcore@10.0 --install-path "$DOTNET_ROOT" --untracked --no-progress; then
            echo "Installed aspnetcore@10.0 via dotnetup."
          else
            echo "dotnetup acquisition/install failed; falling back to dotnet-install.sh." >&2
            curl -sSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
            chmod +x /tmp/dotnet-install.sh
            /tmp/dotnet-install.sh --channel 10.0 --runtime aspnetcore --install-dir "$DOTNET_ROOT"
          fi

      - name: Test Inspect Web managed API
        run: dotnet run --project tests/MsdlProxy.Tests -c Release

      - name: Publish Inspect Web managed API
        run: >
          dotnet publish
          src/MsdlProxy/MsdlProxy.csproj
          -c Release
          --output artifacts/inspect-web-api

      - name: Verify Inspect Web managed API artifact
        shell: bash
        run: |
          set -euo pipefail
          api=artifacts/inspect-web-api
          test -f "$api/host.json"
          test -f "$api/functions.metadata"
          test -f "$api/worker.config.json"
          test -f "$api/.azurefunctions/Microsoft.Azure.WebJobs.Extensions.FunctionMetadataLoader.dll"
          jq -e 'any(.[]; .name == "MsdlProxy" and .language == "dotnet-isolated" and any(.bindings[]; .type == "httpTrigger" and .authLevel == "Anonymous" and .methods == ["get"] and .route == "msdl/{pdbFileName}/{symbolKey}"))' "$api/functions.metadata" >/dev/null

  inspect-web:
    name: inspect-web
    needs:
      - changes
      - inspect-web-platform
      - inspect-web-msdl-tests
    if: >-
      always() &&
      fromJSON(needs.changes.outputs.plan).validations.inspectWeb
    runs-on: ubuntu-24.04
    steps:
      - name: Require every inspect-web job
        env:
          RESULTS: ${{ toJSON(needs) }}
        shell: bash
        run: |
          jq -e '
            [to_entries[] | select(.key != "changes") | .value.result] as $results
            | ($results | length) == 2
            and all($results[]; . == "success")
          ' <<< "$RESULTS"

  # The always-selected changes job checks repository line endings. The slow
  # migration inventory runs in the daily Deep Inspect test lane.
  # Build the full Release solution and run a bounded PR smoke. The complete
  # CLI, contract, analysis, networking, and package suites run daily in Deep
  # Inspect. This lane keeps compile coverage and a few direct integration
  # canaries while the daily lane owns exhaustive test selection.
  test:
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).validations.test
    runs-on: ubuntu-24.04
    env:
      DOTNET_INSPECT_TIPS: q
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.100-rc.1.26425.128'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/*.slnx') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Build
        run: dotnet build dotnet-inspect.slnx -c Release

      - name: Validate dependency policy
        run: dotnet run --project eng/DependencyPolicy -c Release --no-build

      - name: Run CLI route smoke
        run: >-
          dotnet run --project tests/DotnetInspect.Cli.Tests -c Release
          --no-build --
          --filter-class 'DotnetInspect.Cli.Tests.WorkspacePacketCommandTests'
          --filter-class 'DotnetInspect.Cli.Tests.CliRowSelectionLoweringTests'
          --minimum-expected-tests 2

      - name: Run embedded skill tests
        if: fromJSON(needs.changes.outputs.plan).validations.skillGate
        shell: bash
        run: dotnet run --project tests/DotnetInspect.Cli.Tests -c Release --no-build -- --filter-class "DotnetInspect.Cli.Tests.SkillCommandTests"

      - name: Run inspection query smoke
        run: >-
          dotnet run --project tests/DotnetInspector.Queries.Tests -c Release
          --no-build --
          --filter-class 'DotnetInspector.Queries.Tests.InspectionDefinitionTests'
          --filter-class 'DotnetInspector.Queries.Tests.InspectionWorkspaceTests'
          --filter-class 'DotnetInspector.Queries.Tests.PackageAssemblyQueryPlanningTests'
          --filter-class 'DotnetInspector.Queries.Tests.PackageDependencyEvidenceQueryTests'
          --filter-class 'DotnetInspector.Queries.Tests.WorkspaceRealizationTests'
          --filter-class 'DotnetInspector.Queries.Tests.TypeFindPopulationSelectionTests'
          --filter-class 'DotnetInspector.Queries.Tests.IntegrationCensusTests'
          --filter-class 'DotnetInspector.Queries.Tests.ViewFacetRegistryTests'
          --filter-not-trait "Speed=Slow" --minimum-expected-tests 300

      - name: Run InertText tests
        run: dotnet run --project tests/InertText.Tests -c Release --no-build

      - name: Build package-manifest corpus verifier
        run: dotnet build eng/verify-package-manifest-corpus.cs -c Release

  # Pull-request and merge-group candidates validate dependency policy in the
  # full test job above. Pushes to main need a focused second look at the
  # composed tree: two independently green PRs can introduce a forbidden edge
  # only when both are present, and the full test job intentionally skips
  # post-merge runs.
  dependency-policy:
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).validations.dependencyPolicy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.100-rc.1.26425.128'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/*.slnx') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Build
        run: dotnet build dotnet-inspect.slnx -c Release

      - name: Validate dependency policy
        run: dotnet run --project eng/DependencyPolicy -c Release --no-build

  # Focused decompiler tests run beside the bounded test job. Daily Deep
  # Inspect owns the complete non-corpus suite and bounded compile-back receipt.
  # This path-gated job reaches the required check through `ci-required`.
  decompiler-gates:
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).validations.decompilerGates
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      DOTNET_INSPECT_TIPS: q
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.100-rc.1.26425.128'

      # Build the fast test hosts and their declared fixture graphs. The
      # parallel test job retains the full Release solution build.
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/*.slnx') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Build fast decompiler test graphs
        run: |
          dotnet build tests/ILInspector.Decompiler.Tests -c Release
          dotnet build tests/DecompilerHarness.Tests -c Release

      - name: Install ilasm/ildasm for decompiler tests
        id: iltools_decompiler
        continue-on-error: true
        shell: bash
        run: eng/restore-iltools.sh --rid linux-x64 >> "$GITHUB_PATH"

      # Pass logic, printer, importer facts, identity, and classification
      # regressions. Roslyn-heavy, compile-back, corpus, fidelity, determinism,
      # and broad integration tests are Speed=Slow and run daily.
      - name: Run decompiler unit tests (fast)
        run: dotnet run --project tests/ILInspector.Decompiler.Tests -c Release --no-build -- --gate fast

      - name: Run DecompilerHarness tests
        run: dotnet run --project tests/DecompilerHarness.Tests -c Release --no-build

      - name: Check decompiler test ilasm/ildasm result
        if: always() && steps.iltools_decompiler.outcome == 'failure'
        run: |
          echo "::error::Restoring ilasm/ildasm failed, so decompiler tests that use them skipped." >&2
          echo "This lane cannot certify oracle-backed results. See the decompiler tool installation step." >&2
          exit 1


  # Cheap C# Diff harness coverage. Path-gated separately from the full test
  # lane so CSharpDiffHarness/card changes get focused snapshot/baseline JSONL
  # coverage without forcing most PRs through extra work.
  csharp-diff-smoke:
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).validations.csharpDiffSmoke
    runs-on: ubuntu-26.04
    env:
      DOTNET_INSPECT_TIPS: q
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.100-rc.1.26425.128'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/*.slnx') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Build C# Diff harness and fixtures
        run: |
          dotnet build tools/CSharpDiffHarness/CSharpDiffHarness.csproj -c Release
          dotnet build fixtures/diff/DiffFixtures.V1/DiffFixtures.V1.csproj -c Release
          dotnet build fixtures/diff/DiffFixtures.V2/DiffFixtures.V2.csproj -c Release

      - name: Run C# Diff baseline smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/csharp-diff-smoke
          old=artifacts/bin/DiffFixtures.V1/release/DiffFixtureSample.dll
          new=artifacts/bin/DiffFixtures.V2/release/DiffFixtureSample.dll

          dotnet run --project tools/CSharpDiffHarness -c Release --no-build -- \
            "$old" "$new" \
            --emit-snapshot artifacts/csharp-diff-smoke/snapshot.json \
            --format jsonl \
            --max-examples 0 \
            > artifacts/csharp-diff-smoke/snapshot.jsonl

          dotnet run --project tools/CSharpDiffHarness -c Release --no-build -- \
            "$old" "$new" \
            --diff-baseline tools/CSharpDiffHarness/corpus/diff-fixtures-baseline.json \
            --format jsonl \
            --max-examples 0 \
            > artifacts/csharp-diff-smoke/baseline.jsonl

          cat > /tmp/csharp-diff-mutate-baseline.cs <<'CS'
          using System.Text.Json.Nodes;
          var node = JsonNode.Parse(File.ReadAllText(args[0]))!.AsObject();
          node["Summary"]!["FailureCount"] = 0;
          node["FailureBuckets"] = new JsonArray();
          File.WriteAllText(args[1], node.ToJsonString(new System.Text.Json.JsonSerializerOptions { WriteIndented = true }) + Environment.NewLine);
          CS
          dotnet run /tmp/csharp-diff-mutate-baseline.cs -- \
            artifacts/csharp-diff-smoke/snapshot.json \
            artifacts/csharp-diff-smoke/regression-baseline.json

          set +e
          dotnet run --project tools/CSharpDiffHarness -c Release --no-build -- \
            "$old" "$new" \
            --diff-baseline artifacts/csharp-diff-smoke/regression-baseline.json \
            --format jsonl \
            --max-examples 0 \
            > artifacts/csharp-diff-smoke/regression.jsonl
          status=$?
          set -e
          test "$status" -eq 1

          cat > /tmp/csharp-diff-parse-jsonl.cs <<'CS'
          using System.Text.Json;
          foreach (var path in args)
          {
              foreach (var line in File.ReadLines(path))
              {
                  if (string.IsNullOrWhiteSpace(line))
                      continue;
                  JsonDocument.Parse(line).Dispose();
              }
          }
          CS
          dotnet run /tmp/csharp-diff-parse-jsonl.cs -- \
            artifacts/csharp-diff-smoke/snapshot.jsonl \
            artifacts/csharp-diff-smoke/baseline.jsonl \
            artifacts/csharp-diff-smoke/regression.jsonl

      - name: Upload C# Diff smoke artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: csharp-diff-smoke
          path: artifacts/csharp-diff-smoke/
          if-no-files-found: warn

  # Cheap IL Diff harness coverage. It is path-gated separately from the full
  # test lane so most PRs do no more than their existing build/test work, while
  # IL Diff-specific changes get a focused snapshot/baseline JSONL smoke.
  il-diff-smoke:
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).validations.ilDiffSmoke
    runs-on: ubuntu-26.04
    env:
      DOTNET_INSPECT_TIPS: q
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.100-rc.1.26425.128'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/*.slnx') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Build IL Diff harness and fixtures
        run: |
          dotnet build tools/IlDiffHarness/IlDiffHarness.csproj -c Release
          dotnet build fixtures/diff/DiffFixtures.V1/DiffFixtures.V1.csproj -c Release
          dotnet build fixtures/diff/DiffFixtures.V2/DiffFixtures.V2.csproj -c Release

      - name: Run IL Diff baseline smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/il-diff-smoke
          old=artifacts/bin/DiffFixtures.V1/release/DiffFixtureSample.dll
          new=artifacts/bin/DiffFixtures.V2/release/DiffFixtureSample.dll

          dotnet run --project tools/IlDiffHarness -c Release --no-build -- \
            "$old" "$new" \
            --emit-snapshot artifacts/il-diff-smoke/snapshot.json \
            --format jsonl \
            --max-examples 0 \
            > artifacts/il-diff-smoke/snapshot.jsonl

          dotnet run --project tools/IlDiffHarness -c Release --no-build -- \
            "$old" "$new" \
            --diff-baseline artifacts/il-diff-smoke/snapshot.json \
            --format jsonl \
            --max-examples 0 \
            > artifacts/il-diff-smoke/exact.jsonl

          cat > /tmp/il-diff-mutate-baseline.cs <<'CS'
          using System.Text.Json.Nodes;
          var node = JsonNode.Parse(File.ReadAllText(args[0]))!.AsObject();
          node["Summary"]!["FailureCount"] = 0;
          node["FailureBuckets"] = new JsonArray();
          File.WriteAllText(args[1], node.ToJsonString(new System.Text.Json.JsonSerializerOptions { WriteIndented = true }) + Environment.NewLine);
          CS
          dotnet run /tmp/il-diff-mutate-baseline.cs -- \
            artifacts/il-diff-smoke/snapshot.json \
            artifacts/il-diff-smoke/regression-baseline.json

          set +e
          dotnet run --project tools/IlDiffHarness -c Release --no-build -- \
            "$old" "$new" \
            --diff-baseline artifacts/il-diff-smoke/regression-baseline.json \
            --format jsonl \
            --max-examples 0 \
            > artifacts/il-diff-smoke/regression.jsonl
          status=$?
          set -e
          test "$status" -eq 1

          cat > /tmp/il-diff-parse-jsonl.cs <<'CS'
          using System.Text.Json;
          foreach (var path in args)
          {
              foreach (var line in File.ReadLines(path))
              {
                  if (string.IsNullOrWhiteSpace(line))
                      continue;
                  JsonDocument.Parse(line).Dispose();
              }
          }
          CS
          dotnet run /tmp/il-diff-parse-jsonl.cs -- \
            artifacts/il-diff-smoke/snapshot.jsonl \
            artifacts/il-diff-smoke/exact.jsonl \
            artifacts/il-diff-smoke/regression.jsonl

      - name: Upload IL Diff smoke artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: il-diff-smoke
          path: artifacts/il-diff-smoke/
          if-no-files-found: warn

  # Pack on Ubuntu to validate the pointer and any fallback packages. The daily test lane
  # owns the RID-specific AOT pack and local tool install/smoke.
  # This is NOT the source of release artifacts
  # (release.yml builds those itself at publish time), so it runs only on PRs
  # that touch build/packaging configuration. Most PRs (e.g. decompiler raises)
  # skip it, which removes packaging work from the hot PR path.
  pack:
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).validations.pack
    runs-on: ubuntu-26.04
    env:
      DOTNET_INSPECT_TIPS: q
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.100-rc.1.26425.128'

      - name: Pack pointer package
        # SelfContained=true forces the pack TFM segment to 'any', so the pointer
        # manifest lands at tools/any/any/DotnetToolSettings.xml instead of
        # tools/netX.0/any/. This makes the pointer TFM-agnostic: any SDK that
        # understands RID-specific tools can read it, regardless of TFM. The
        # pointer carries no implementation, so SelfContained pulls in no runtime.
        # RID-specific packages are built by their dedicated steps; disabling
        # inner RID packs keeps this step pointer-only on .NET 11 Preview 7+.
        run: dotnet pack src/DotnetInspect.Cli -c Release -p:SelfContained=true -p:OfficialBuild=true -p:CreateRidSpecificToolPackages=false -p:DotnetInspectWebsiteUrl=https://dotnet-inspect.net

      - name: Upload pointer package
        uses: actions/upload-artifact@v7
        with:
          name: package-pointer
          path: artifacts/package/release/*.nupkg
          if-no-files-found: error

      - name: Pack any (non-AOT) package
        # TFM is pinned to net10.0 structurally via Directory.Build.props
        # (OfficialBuild + non-AOT) so this fallback stays installable on the LTS
        # runtime even though dev/AOT builds use the latest runtime. See issue #240.
        run: dotnet pack src/DotnetInspect.Cli -c Release -r any -p:PublishAot=false -p:OfficialBuild=true -p:DotnetInspectWebsiteUrl=https://dotnet-inspect.net

      - name: Upload any package
        uses: actions/upload-artifact@v7
        with:
          name: package-any
          path: artifacts/package/release/*.nupkg
          if-no-files-found: error


  # The one check the `main` ruleset is meant to require, and the only one that
  # safely can be.
  #
  # Every other job here is path-gated, so none of them can be required
  # directly: a required check that does not run on a given PR is reported as
  # "Expected" forever and blocks the merge permanently. This job always runs
  # and collapses the others into one result, so the ruleset has exactly one
  # stable context to name.
  #
  # Adding the `required_status_checks` rule is a repository-settings change
  # applied once this job exists on `main`; requiring it earlier would block
  # every open PR with no way forward.
  #
  # Three details carry the whole contract, and each is easy to get backwards:
  #
  # 1. `if: always()` is mandatory. Without it this job inherits the default
  #    `success()` condition, is skipped the moment any dependency fails, and a
  #    skipped required check does not block a merge -- the failure it exists to
  #    catch would be exactly what silences it.
  #
  # 2. `skipped` must pass for path-gated jobs but not for `changes`, and
  #    `cancelled` must never pass. Path-gated jobs are skipped on most PRs and
  #    that is correct. `changes` supplies every gate, so skipping it silently
  #    skips the entire selected set. A cancelled job is a job that hit its timeout,
  #    and this repository has already been burned by that distinction twice:
  #    the Deep Inspect notifier stayed silent because a cancelled job satisfies
  #    neither `failure()` nor a failed conclusion (#3432), and seven decompiler
  #    test classes sat at a 45-minute timeout unnoticed (#3489-#3493).
  #
  # 3. The check is an allow list, not a deny list. Only `success` and `skipped`
  #    pass for path-gated jobs; only `success` passes for `changes`. Anything
  #    else blocks. A deny list of `failure|cancelled` would admit any result
  #    state GitHub adds later, which is the fail-open direction.
  #
  # `changes` is in `needs` deliberately. If it fails, every downstream job is
  # skipped, so a check that looked only at the gated jobs would see nothing but
  # `skipped` and pass a PR on which no test ran at all. `changes` reporting
  # `failure` or `skipped` is what closes that path.
  #
  # Like `changes`, this always-run terminal gate uses the GA image so preview
  # capacity cannot leave an otherwise-complete PR waiting for its required
  # status. Path-gated jobs retain ubuntu-26.04 coverage.
  ci-required:
    needs:
      - changes
      - provenance
      - inspect-web-platform
      - inspect-web-msdl-tests
      - inspect-web
      - test
      - dependency-policy
      - tla-plus
      - lean
      # Path-gated jobs report `skipped` when their input class is absent; all
      # expensive jobs except inspect-web and dependency-policy skip on pushes
      # to main. The host-analysis guard step also skips on pushes. That
      # passes the gate by design; the allow list below distinguishes "correctly
      # not run" from "ran and failed".
      - decompiler-gates
      - csharp-diff-smoke
      - il-diff-smoke
      - pack
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      # Defined once and consumed by both the self-test and the real check, so
      # the thing proven non-vacuous is the same thing that gates the merge.
      RESULT_FILTER: >-
        to_entries[]
        | select(
            ((.key == "changes" or .key == "provenance")
              and .value.result != "success")
            or
            (.key != "changes" and .key != "provenance"
              and .value.result != "success"
              and .value.result != "skipped")
          )
        | "\(.key)=\(.value.result)"
    steps:
      - uses: actions/checkout@v7

      # A hand-maintained `needs` list is an allow list, and an allow list that
      # nothing checks goes stale silently: add a job to this workflow, forget
      # this line, and the merge gate stops covering it while still reporting
      # green. That is the same shape as #3584, where a one-directional docket
      # un-gated 46 fixture rows. So the workflow's own job list drives the
      # required set, and both directions fail -- a job missing from `needs`
      # and a `needs` entry naming a job that no longer exists.
      - name: Verify this gate depends on every other job
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          python3 -I -c '
          import json, os, sys, yaml
          with open(".github/workflows/ci.yml") as f:
              workflow = yaml.safe_load(f)
          jobs = set(workflow["jobs"])
          jobs.discard("ci-required")
          needs = set(json.loads(os.environ["NEEDS"]))
          missing = sorted(jobs - needs)
          extra = sorted(needs - jobs)
          forbidden = sorted(
              key for key in (
                  "if",
                  "continue-on-error",
                  "defaults",
                  "env",
                  "container",
                  "strategy")
              if key in workflow["jobs"]["changes"])
          self_tests = [
              step for step in workflow["jobs"]["changes"].get("steps", [])
              if isinstance(step, dict)
              and step.get("name") == "Self-test change detection"
          ]
          self_test_errors = []
          if len(self_tests) != 1:
              self_test_errors.append(
                  "expected one Self-test change detection step, "
                  f"found {len(self_tests)}")
          else:
              self_test = self_tests[0]
              if self_test.get("run") != "dotnet run eng/test-ci-change-detection.cs":
                  self_test_errors.append(
                      "Self-test change detection must run the C# gate")
              if self_test.get("shell") != "bash":
                  self_test_errors.append(
                      "Self-test change detection must use shell: bash")
              expected_env = {"BASH_ENV": ""}
              if self_test.get("env") != expected_env:
                  self_test_errors.append(
                      "Self-test change detection must clear only BASH_ENV")
              forbidden_step = sorted(
                  key for key in (
                      "if",
                      "continue-on-error",
                      "working-directory")
                  if key in self_test)
              if forbidden_step:
                  self_test_errors.append(
                      "Self-test change detection must not declare: "
                      + ", ".join(forbidden_step))
          if missing:
              print("::error::ci-required does not depend on: " + ", ".join(missing))
          if extra:
              print("::error::ci-required depends on unknown jobs: " + ", ".join(extra))
          if forbidden:
              print("::error::changes job must not declare: " + ", ".join(forbidden))
          for error in self_test_errors:
              print("::error::" + error)
          sys.exit(
              1 if missing or extra or forbidden or self_test_errors else 0)
          '
          echo "Gate covers every job in the workflow."

      # A gate that accepted everything would be indistinguishable from a green
      # run, so the filter's discrimination is asserted rather than assumed.
      # This is that assertion: if the filter stops selecting bad results, this
      # step fails even when every real job is green.
      - name: Self-test the result filter
        shell: bash
        run: |
          set -euo pipefail
          probe='{"changes":{"result":"skipped"},"provenance":{"result":"skipped"},"ok":{"result":"success"},"gated":{"result":"skipped"},"broke":{"result":"failure"},"timeout":{"result":"cancelled"},"future":{"result":"neutral"}}'
          got=$(printf '%s' "$probe" | jq -r "$RESULT_FILTER" | paste -sd, -)
          expected='changes=skipped,provenance=skipped,broke=failure,timeout=cancelled,future=neutral'
          if [ "$got" != "$expected" ]; then
            echo "::error::Result filter no longer discriminates. Expected [$expected], got [$got]."
            exit 1
          fi
          echo "Filter discriminates correctly: [$got]"

      - name: Verify no required job failed or was cancelled
        shell: bash
        env:
          # Passed through the environment rather than interpolated into the
          # script body so job outputs can never terminate the shell string.
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS"
          blocking=$(printf '%s' "$NEEDS" | jq -r "$RESULT_FILTER")
          if [ -n "$blocking" ]; then
            echo "::error::CI is not green; these jobs did not succeed or skip:"
            printf '%s\n' "$blocking"
            exit 1
          fi
          echo "All required jobs succeeded or were correctly skipped."
