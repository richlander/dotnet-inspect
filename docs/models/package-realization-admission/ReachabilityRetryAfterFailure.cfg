\* is the negation of retryAfterFailureWitness; TLC's counterexample proves a
\* demand can Admit(d) for an exact request that some earlier demand already
\* observed as "Failed" -- i.e. failures are not cached, and retry is
\* reachable. See PackageRealizationAdmission.tla's "REACHABILITY PROBES"
\* section for why this is checked this way instead of a `<>` PROPERTY.
