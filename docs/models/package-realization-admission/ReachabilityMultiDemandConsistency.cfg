\* This probe is EXPECTED to report a violation. NoMultiDemandConsistencyObserved
\* is the negation of consistentOutcomeWitness; TLC's counterexample proves a
\* exact request can succeed with more than one demand attached (admitting plus
\* at least one joiner) and both receive the same realization identity -- the
\* single-flight join actually shares one outcome, not merely a single-demand
\* success. See PackageRealizationAdmission.tla's "REACHABILITY PROBES"
\* section for why this is checked this way instead of a `<>` PROPERTY.
