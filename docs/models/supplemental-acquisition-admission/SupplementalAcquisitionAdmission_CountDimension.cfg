SPECIFICATION Spec

CONSTANTS
  Supplementals = {s1, s2}
  SmallSupplemental = s1
  LargeSupplemental = s2
  RequiredCount = 0
  RequiredBytes = 0
  MaxArtifacts = 2
  MaxArtifactBytes = 4
  MaxRetainedBytes = 4
