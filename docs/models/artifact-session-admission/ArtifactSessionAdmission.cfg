SPECIFICATION Spec

CONSTANTS
  Demands = {d1, d2, d3}
  Generations = {g1, g2}

INVARIANTS
  TypeOK
  AdmissionCoherence
  DisposalPreventsPublication
  PublishSafetyWitnessHolds
  LeaseSafetyWitnessHolds
  OutcomeStableWitnessHolds
  NoUnauthorizedPublication

PROPERTIES
  EveryAdmissionEventuallyTerminates
  WaitingDemandsEventuallyResolve
  LeasesEventuallyRelease

\* Idle, fully resolved, and fully released is a valid terminal state for
\* this bounded model (it is not an always-live server); deadlock here
\* means "nothing more to check," not a stuck design.
CHECK_DEADLOCK FALSE
