SPECIFICATION Spec

CONSTANTS
  Demands = {d1, d2, d3}
  Generations = {g1, g2}
  EnablePendingCancellation = TRUE
  EnableDrainingCancellation = TRUE
  EnforcePendingCancellationRequest = TRUE
  EnforceAttachedCancellationRequest = TRUE

INVARIANTS
  TypeOK
  AdmissionCoherence
  WaiterGenerationInvariant
  DisposalPreventsPublication
  PublishSafetyWitnessHolds
  LeaseSafetyWitnessHolds
  OutcomeStableWitnessHolds
  AuthorizedOutcomeWitnessHolds
  CancellationRequestCoherence
  CancelledDemandsWereRequested
  CancelledDemandsAreDetached
  PendingCancellationGuardWitnessHolds
  AttachedCancellationGuardWitnessHolds
  ScenarioCancellationRequestsAreRecorded
  PendingCancellationWitnessHolds
  DrainingCancellationWitnessHolds

PROPERTIES
  EveryAdmissionEventuallyTerminates
  WaitingDemandsEventuallyResolve
  PendingDemandsEventuallyAttachOrResolve
  CancellationRequestsEventuallyCancel
  IncompatiblePendingCancellationEventuallyCompletes
  PostDisposalDrainingCancellationEventuallyCompletes
  DisposalEventuallyReleasesLeases

\* Idle, fully resolved, and fully released is a valid terminal state for
\* this bounded model (it is not an always-live server); deadlock here
\* means "nothing more to check," not a stuck design.
CHECK_DEADLOCK FALSE
