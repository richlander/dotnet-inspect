\* Demonstrates a partial fix is insufficient: TakeSnapshot/Snapshot are
\* atomic (lock-guarded read), but RecordDeletion still performs two
\* independent Interlocked calls. A reader can still observe a deletion
\* mid-flight (bytes done, directory not yet done), attributing it to an
\* earlier report than the directory count that follows. TLC must violate
\* NoTornAccounting.
SPECIFICATION Spec

CONSTANTS
  MaxDeletions = 2
  AllowTornWrite = TRUE
  AllowTornRead = FALSE

INVARIANTS
  NoTornAccounting

CONSTRAINT
  StateConstraint

CHECK_DEADLOCK FALSE
