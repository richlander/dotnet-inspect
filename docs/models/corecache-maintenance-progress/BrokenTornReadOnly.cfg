\* Demonstrates a partial fix is insufficient: RecordDeletion is atomic
\* (lock-guarded write), but TakeSnapshot/Snapshot still perform two
\* independent Interlocked.Exchange calls. A new deletion can still complete
\* between a reader's two sub-steps, so tearing survives. TLC must violate
\* NoTornAccounting.
SPECIFICATION Spec

CONSTANTS
  MaxDeletions = 2
  AllowTornWrite = FALSE
  AllowTornRead = TRUE

INVARIANTS
  NoTornAccounting

CONSTRAINT
  StateConstraint

CHECK_DEADLOCK FALSE
