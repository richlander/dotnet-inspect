\* RecordDeletion and TakeSnapshot each touched _bytesFreed and
\* _directoriesDeleted with two independent Interlocked calls. No longer
\* describes shipped behavior (see Safety.cfg); retained as a negative
\* control. TLC must violate NoTornAccounting.
SPECIFICATION Spec

CONSTANTS
  MaxDeletions = 2
  AllowTornWrite = TRUE
  AllowTornRead = TRUE

INVARIANTS
  NoTornAccounting

CONSTRAINT
  StateConstraint

CHECK_DEADLOCK FALSE
