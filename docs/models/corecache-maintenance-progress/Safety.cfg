\* Matches shipped CoreCache.cs's CacheMaintenanceProgress: a single lock
\* guards all four methods, so RecordDeletion/Record write and
\* Snapshot/TakeSnapshot read _bytesFreed and _directoriesDeleted as one
\* atomic step.
SPECIFICATION Spec

CONSTANTS
  MaxDeletions = 2
  AllowTornWrite = FALSE
  AllowTornRead = FALSE

INVARIANTS
  TypeOK
  NoTornAccounting

CONSTRAINT
  StateConstraint

CHECK_DEADLOCK FALSE
