\* Bounded liveness gate for maintenance that becomes stale while a
\* relation-backed route is replaced. One intent and one maintenance request
\* retain the relevant blocking, rebuilding, regathering, and admission paths.

SPECIFICATION Spec

CONSTANTS
  MaxIntent = 1
  MaxMaintenance = 1
  MaxSynchronization = 2
  IntentKinds = {"subject"}
  Subjects = {"subjectA"}
  Routes = {"directRoute", "relatedRoute"}
  DirectRoute = "directRoute"
  RelatedRoute = "relatedRoute"
  InitialSubject = "subjectA"
  SessionId = "navigationSession"
  ForeignSessionId = "otherSession"

INVARIANTS
  TypeOK
  InstalledRouteUsesCurrentRelation
  MaintenancePublicationMatchesSemanticChange
  MaintenanceAdmissionDiscipline
  MaintenanceRegatherDiscipline
  MaintenanceRequestOrder

PROPERTIES
  MaintenanceEventuallyDrains
  EveryQueuedRequestIsAdmitted
  BlockedMaintenanceResumes
  MaintenanceResumesAfterAbort
  StaleBasisMaintenanceResumes

CHECK_DEADLOCK FALSE
