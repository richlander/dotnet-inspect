\* TLC configuration for retained versus stateless navigation execution.
\* Three operations are enough to reach a stale consumer authority; two
\* session lenses and one caller-only lens are enough to tell a lens derived
\* from the installed snapshot from one derived from supplied data.  The
\* supplied prior-state domain covers caller, foreign, and stale same-session
\* snapshots, and three operations are enough to show one operation's outcome
\* not standing in for another's.

SPECIFICATION Spec

CONSTANTS
  MaxCommands = 3
  SessionLenses = {"apiLens", "referencesLens"}
  ForeignLenses = {"callerLens"}
  SessionId = "navigationSession"
  ForeignSessionId = "otherSession"

INVARIANTS
  TypeOK
  InstalledSnapshotIsSessionCustody
  OnlyRetainedExecutionInstalls
  RetainedPriorStateIsInstalledSnapshot
  OperationAndResultAreCorrelated
  NonApplyStepsPreserveInstalledSnapshot
  RetainedRejectionHasExactAuthorityAndInstallsNothing
  RetainedCommittedLensEqualsInstalledLens
  StatelessIssuesNoRetainedAuthority
  ExactCurrentAuthority
  StaleOrForeignAuthorityNeverExecutes

PROPERTIES
  EveryCommandResolves
  EffectEventuallyConsumed
  SuppliedRetainedPriorStateIsAlwaysRejected

\* A behaviour that has submitted every operation and consumed its last
\* effect has nothing left to do.
CHECK_DEADLOCK FALSE
