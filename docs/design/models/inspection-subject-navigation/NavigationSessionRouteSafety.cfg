\* Focused safety gate for route publication and exact relation currentness.
\* Maintenance and synchronization are disabled because their independent
\* contracts remain covered by NavigationSession.cfg.

SPECIFICATION Spec

CONSTANTS
  MaxIntent = 2
  MaxMaintenance = 1
  MaxSynchronization = 2
  IntentKinds = {"subject", "lens", "coordinate", "restoration"}
  Subjects = {"subjectA"}
  Routes = {"directRoute", "relatedRoute"}
  DirectRoute = "directRoute"
  RelatedRoute = "relatedRoute"
  InitialSubject = "subjectA"
  SessionId = "navigationSession"
  ForeignSessionId = "otherSession"

INVARIANTS
  TypeOK
  InstalledRouteUsesCurrentRelation
  RouteOnlyChangeAdvancesRevision
  StaleRelationActionIsRejected
  MaintenancePublicationMatchesSemanticChange

CHECK_DEADLOCK FALSE
