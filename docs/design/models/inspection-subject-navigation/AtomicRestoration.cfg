\* TLC configuration for canonical navigation restoration.
\* Two intents are enough for supersession, two subjects and two lenses are
\* enough to tell a committed pair from a partially installed one, and one
\* other participant is enough to make the commit a real coordination.
\* Navigation's own subject and lens halves can each fail independently, so
\* failure before either half, after the subject half, and after the lens
\* half are all reachable at these bounds.

SPECIFICATION Spec

CONSTANTS
  MaxIntent = 2
  Subjects = {"typeSubject", "librarySubject"}
  Lenses = {"apiLens", "referencesLens"}
  Peers = {"canonicalPeer"}
  PriorSubject = "priorSubject"
  PriorLens = "priorLens"

INVARIANTS
  TypeOK
  NoPartialInstallation
  VisiblePairIsLastCommit
  CommitRequiresReadyParticipantsAndCurrentIntent
  NoSupersededCommit
  FailedPreparationNeverVisible
  PreparationIsInvisible
  LiveAttemptHasNoSettlement
  FailedAttemptSettlesAsAborted
  CommittedAttemptWasNeitherFailedNorSuperseded
  VisiblePairComesFromACommittedAttempt

PROPERTIES
  EveryAttemptSettles
  FailedAttemptsAbort
  HalfFailedAttemptsSettle

\* A behaviour that has issued every intent and settled every attempt has
\* nothing left to do.
CHECK_DEADLOCK FALSE
