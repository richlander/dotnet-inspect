\* TLC configuration for atomic navigation preparation.
\* Two intents are enough for supersession, while two subjects and two lenses
\* distinguish an exact requested pair from a mismatched prepared result.

SPECIFICATION Spec

CONSTANTS
  MaxIntent = 2
  Subjects = {"typeSubject", "librarySubject"}
  Lenses = {"apiLens", "referencesLens"}
  NoSubject = "noSubject"
  NoLens = "noLens"

INVARIANTS
  TypeOK
  PreparationRequiresReadyPairAndCurrentIntent
  PreparedPairEqualsRequestedPayload
  NoSupersededPreparationResult
  FailedPreparationNeverPrepared
  PreparationIsInvisibleUntilPublished

PROPERTIES
  EveryAttemptSettles
  FailedAttemptsAbort

\* A behaviour that has issued every intent and settled every attempt has
\* nothing left to do.
CHECK_DEADLOCK FALSE
