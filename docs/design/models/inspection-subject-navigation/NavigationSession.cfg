\* TLC configuration for the retained navigation session model.
\* Two explicit intents and two standalone maintenance requests are enough to
\* exercise supersession, request-order admission, abort, and stale authority.

SPECIFICATION Spec

CONSTANTS
  MaxIntent = 2
  MaxMaintenance = 2
  MaxEffectEpoch = 6
  IntentKinds = {"subject", "lens", "coordinate", "restoration"}
  SnapshotValues = {"snapshotA", "snapshotB"}
  InitialSnapshot = "snapshotA"
  SessionId = "navigationSession"
  ForeignSessionId = "otherSession"

INVARIANTS
  TypeOK
  LatestIntentSafety
  ExactCurrentAuthority
  MaintenanceAdmissionDiscipline
  MaintenanceRegatherDiscipline
  MaintenanceRequestOrder
  NoStaleVisibleEffect
  UnavailableRevisionMatchesSnapshotChange
  ConsumerSynchronizationShape
  ConsumerVisibleEffectSynchronizes
  AcknowledgementRequiresConsumerSynchronization
  SynchronizationAuthorityIsCurrent

PROPERTIES
  ExplicitWorkEventuallyResolves
  EveryExplicitIntentSettles
  EffectEventuallyConsumed
  MaintenanceEventuallyDrains
  EveryQueuedRequestIsAdmitted
  BlockedMaintenanceResumes
  MaintenanceResumesAfterAbort
  StaleBasisMaintenanceResumes

\* A behaviour that has issued every intent, drained the queue, and consumed
\* its last effect has nothing left to do.  Termination is the intended end
\* state here, not a defect.
CHECK_DEADLOCK FALSE
