SPECIFICATION Spec

CONSTANTS
  RequestA = r1
  RequestB = r2
  LensA = lensA
  LensB = lensB
  InvalidLens = invalidLens
  QueryA = queryA
  QueryB = queryB
  QueryC = queryC
  ForeignQuery = foreignQuery
  ContextA = contextA
  ContextB = contextB
  AllowForeignLensBinding = FALSE
  PublishCancelledSuccess = FALSE
  RetainContextAfterTerminal = FALSE
  DisposeContextOnCancel = FALSE
  BorrowOtherRequestPlan = FALSE

INVARIANTS
  TypeOK
  LensBindingsUseOnlyDomainQueries
  RejectedLensesStayUnbound
  PlanMatchesOwnDemand
  PlansUseOnlyDomainQueries
  BorrowedContextOnlyWhileRunning
  CompositionNeverDisposesContext
