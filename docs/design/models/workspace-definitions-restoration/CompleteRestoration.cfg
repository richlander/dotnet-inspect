\* TLC configuration for complete Workspace Definitions restoration.

SPECIFICATION Spec

CONSTANTS
  MaxIntent = 2
  Participants = {"workspace", "navigation", "query"}
  PayloadA = "packetA"
  PayloadB = "packetB"
  NoPayload = "noPayload"
  NoToken = 0
  AllowCanonicalizationFailure = TRUE
  Mutation = "None"

INVARIANTS
  TypeOK
  PreflightRequiresAdmission
  CommitRequiresEveryParticipantAndCanonicalCandidate
  CommittedSnapshotCorrelatesExactRequest
  CommitRelationMatchesPreparedCandidate
  InstalledSnapshotIsAtomic
  EveryPublishedSnapshotIsAtomic
  FailedAttemptNeverCommits
  SupersededAttemptNeverCommits
  UnprojectableCandidateNeverCommits
  PreparationIsInvisibleUntilCommit
  AbortRetainsInstalledSnapshotAndRevision
  StaleCompletionCannotInstall

PROPERTIES
  EveryAttemptSettles
  EveryFailedAttemptSettlesWithoutCommit

CHECK_DEADLOCK FALSE
