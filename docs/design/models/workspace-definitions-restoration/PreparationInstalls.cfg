\* Deliberate defect: participant preparation replaces installed state before
\* any committed result exists.

SPECIFICATION Spec

CONSTANTS
  MaxIntent = 2
  Participants = {"workspace", "navigation", "query"}
  PayloadA = "packetA"
  PayloadB = "packetB"
  NoPayload = "noPayload"
  NoToken = 0
  AllowProjectionFailure = TRUE
  Mutation = "PreparationInstalls"

INVARIANTS
  TypeOK
  PreflightRequiresAdmission
  CommitRequiresEveryParticipantAndPublishableCandidate
  CommittedSnapshotCorrelatesExactRequest
  CommitRelationMatchesPreparedCandidate
  InstalledSnapshotIsAtomic
  EveryPublishedSnapshotIsAtomic
  FailedAttemptNeverCommits
  SupersededAttemptNeverCommits
  ProjectionFailureNeverCommits
  PreparationIsInvisibleUntilCommit
  AbortRetainsInstalledSnapshotAndRevision
  StaleCompletionCannotInstall

CHECK_DEADLOCK FALSE
