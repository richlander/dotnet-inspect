\* Mutation: a retired version token becomes current again for a new answer.
CHECK_DEADLOCK FALSE

CONSTANTS
    StateOne = stateOne
    StateTwo = stateTwo
    StateThree = stateThree
    VersionOne = versionOne
    VersionTwo = versionTwo
    VersionThree = versionThree
    AnswerOne = answerOne
    AnswerTwo = answerTwo
    AnswerThree = answerThree
    NoVersion = noVersion
    NoAnswer = noAnswer
    VersionMode = "ReuseVersionOne"
    AssociationMode = "Atomic"
    FinalValidationMode = "Policy"
    SideEffectMode = "Policy"

SPECIFICATION Spec

INVARIANT CommittedAnswerBelongsToCapturedVersion
