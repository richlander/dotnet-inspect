\* Mutation: version reuse makes a stale cache entry current again.
CHECK_DEADLOCK FALSE

CONSTANTS
    StateOne = stateOne
    StateTwo = stateTwo
    StateThree = stateThree
    VersionOne = versionOne
    VersionTwo = versionTwo
    VersionThree = versionThree
    AnswerOne = answerOne
    AnswerTwo = answerTwo
    AnswerThree = answerThree
    NoVersion = noVersion
    NoAnswer = noAnswer
    VersionMode = "ReuseVersionOne"
    AssociationMode = "Atomic"
    FinalValidationMode = "Policy"
    SideEffectMode = "Policy"

SPECIFICATION Spec

INVARIANT CachedAnswerNotCommittedAfterStateChange
