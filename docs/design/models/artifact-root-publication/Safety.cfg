SPECIFICATION SafetySpec

CONSTANTS
  RootA = rootA
  RootB = rootB
  RootC = rootC
  RootD = rootD
  PreparationOne = preparationOne
  PreparationTwo = preparationTwo
  EnableObservers = FALSE
  EnableCallerRelease = TRUE
  EnableRetry = TRUE
  EnableLeaseDrain = FALSE
  AllowYieldingCommit = FALSE
  AllowRefusedParticipantPublish = FALSE
  AllowRetiredRootEntry = FALSE
  AllowReceiptReuse = FALSE
  AllowParticipantReuse = FALSE
  AllowReleaseDuringPublishing = FALSE
  AllowConsumptionBeforeShapeValidation = FALSE
  AllowOmittedDeadlineSettlement = FALSE
  AllowRetirementToCutLease = FALSE
  AllowSynthesizedCompositionIdentity = FALSE
  EnforceCheckPrecedence = TRUE

INVARIANTS
  TypeOK
  MalformedPlanReleasesNoReceipt
  GateRefusalIsFirstApplicable
  ApplicabilityRefusalReleasesEveryListedBatch
  RefusedParticipantPublishesNothing
  HalfStateIsNeverGateVisible
  PublishedReceiptWasNotCallerReleased
  ReceiptPublishesAtMostOnce
  ReceiptOutcomeIsExactlyOneTerminal
  LogicalPublicationIsSingleUse
  CancellationNeverLeavesASwappedPointer
  DiscardedCandidateIdentityNeverBecomesCurrent
  PublishedResultImpliesCompleteSwap

PROPERTIES
  CommitPublishesExactlyTheReservedComposition
  CompositionIdentityAdvancesOnEveryPhysicalChange

CHECK_DEADLOCK FALSE
