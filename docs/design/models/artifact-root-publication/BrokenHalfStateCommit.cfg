SPECIFICATION SafetySpec

CONSTANTS
  RootA = rootA
  RootB = rootB
  RootC = rootC
  RootD = rootD
  PreparationOne = preparationOne
  PreparationTwo = preparationTwo
  EnableObservers = TRUE
  EnableCallerRelease = FALSE
  EnableRetry = FALSE
  EnableLeaseDrain = FALSE
  AllowYieldingCommit = TRUE
  AllowRefusedParticipantPublish = FALSE
  AllowRetiredRootEntry = FALSE
  AllowReceiptReuse = FALSE
  AllowParticipantReuse = FALSE
  AllowReleaseDuringPublishing = FALSE
  AllowConsumptionBeforeShapeValidation = FALSE
  AllowOmittedDeadlineSettlement = FALSE
  AllowRetirementToCutLease = FALSE
  AllowSynthesizedCompositionIdentity = FALSE
  EnforceCheckPrecedence = TRUE

INVARIANTS
  HalfStateIsNeverGateVisible
  OldOrNewCompositionIsObserved

CHECK_DEADLOCK FALSE
