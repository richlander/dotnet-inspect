\* Reachability witness: this must fail after one request starts the flight,
\* a same-version rejected request joins it, and that follower consumes the
\* version the flight published.
CONSTANTS
    Requests = {requestOne, requestTwo}
    RequestOne = requestOne
    RequestTwo = requestTwo
    NoRequest = noRequest
    InitialVersion = 1
    RequestOneVersion = 2
    RequestTwoVersion = 3
    MaxVersion = 3
    RefreshMode = "SingleFlight"
    AcquisitionMode = "CurrentVersionOnly"
    ConsumptionMode = "ReadOnly"
    PublicationMode = "MonotonicPublish"

CHECK_DEADLOCK FALSE

SPECIFICATION Spec

INVARIANT JoinAndFollowerConsumptionNotObserved
