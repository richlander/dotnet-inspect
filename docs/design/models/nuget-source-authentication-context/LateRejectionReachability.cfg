\* Reachability witness: this must fail after a request sends the episode's
\* version, the flight publishes a newer version, and only then does the
\* server reject the version that request observed.
CONSTANTS
    Requests = {requestOne, requestTwo}
    RequestOne = requestOne
    RequestTwo = requestTwo
    NoRequest = noRequest
    InitialVersion = 1
    RequestOneVersion = 2
    RequestTwoVersion = 3
    MaxVersion = 3
    RefreshMode = "SingleFlight"
    AcquisitionMode = "CurrentVersionOnly"
    ConsumptionMode = "ReadOnly"
    PublicationMode = "MonotonicPublish"

CHECK_DEADLOCK FALSE

SPECIFICATION Spec

INVARIANT LateRejectionNotObserved
