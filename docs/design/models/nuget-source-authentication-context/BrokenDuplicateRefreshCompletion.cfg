\* Mutation: the same removal of single-flight admission, checked only against
\* the per-episode completion claim so the run proceeds past the duplicate
\* start and reaches two provider completions. Named property:
\* AtMostOneProviderCompletion.
CONSTANTS
    Requests = {requestOne, requestTwo}
    RequestOne = requestOne
    RequestTwo = requestTwo
    NoRequest = noRequest
    InitialVersion = 1
    RequestOneVersion = 2
    RequestTwoVersion = 3
    MaxVersion = 3
    RefreshMode = "DuplicateAcquisition"
    AcquisitionMode = "CurrentVersionOnly"
    ConsumptionMode = "ReadOnly"
    PublicationMode = "MonotonicPublish"

CHECK_DEADLOCK FALSE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    AtMostOneProviderCompletion
