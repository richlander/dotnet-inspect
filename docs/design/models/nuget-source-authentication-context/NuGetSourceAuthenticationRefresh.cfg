\* Specified refresh policy: one flight per episode, current-version-only
\* acquisition, read-only consumption, and monotonic publication.
CONSTANTS
    Requests = {requestOne, requestTwo}
    RequestOne = requestOne
    RequestTwo = requestTwo
    NoRequest = noRequest
    InitialVersion = 1
    RequestOneVersion = 2
    RequestTwoVersion = 3
    MaxVersion = 3
    RefreshMode = "SingleFlight"
    AcquisitionMode = "CurrentVersionOnly"
    ConsumptionMode = "ReadOnly"
    PublicationMode = "MonotonicPublish"

CHECK_DEADLOCK FALSE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    AtMostOneProviderAcquisition
    AtMostOneProviderCompletion
    WaitingRequestsShareActiveAcquisition
    FollowersDoNotRunTheirOwnProviderWork
    DoneRequestsConsumedCurrentVersion

PROPERTIES
    StaleObservedRequestCannotAcquire
    StaleObservedConsumptionIsReadOnly
    CredentialVersionNeverRegresses
    AvailableRefreshEventuallyCompletes
    StaleObservedRequestsEventuallyConsume
