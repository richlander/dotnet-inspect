\* Mutation: a same-version rejected follower starts its own provider work
\* instead of joining the running flight. Named property:
\* AtMostOneProviderAcquisition.
CONSTANTS
    Requests = {requestOne, requestTwo}
    RequestOne = requestOne
    RequestTwo = requestTwo
    NoRequest = noRequest
    InitialVersion = 1
    RequestOneVersion = 2
    RequestTwoVersion = 3
    MaxVersion = 3
    RefreshMode = "DuplicateAcquisition"
    AcquisitionMode = "CurrentVersionOnly"
    ConsumptionMode = "ReadOnly"
    PublicationMode = "MonotonicPublish"

CHECK_DEADLOCK FALSE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    AtMostOneProviderAcquisition
