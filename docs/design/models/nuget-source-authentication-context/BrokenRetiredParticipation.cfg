\* Mutation: removing the live-context participation gate must be detected by
\* event-time retired-context authority witnesses.
CONSTANTS
    Contexts = {privateSource, anonymousSource}
    ContextOne = privateSource
    ContextTwo = anonymousSource
    Requests =
        {privateFirst, privateConcurrent, privateLater, anonymousFirst,
         anonymousLater, unassociated, ineligible, outOfScope, gallery}
    ContextOneFirst = privateFirst
    ContextOneConcurrent = privateConcurrent
    ContextOneLater = privateLater
    ContextTwoFirst = anonymousFirst
    ContextTwoLater = anonymousLater
    UnassociatedRequest = unassociated
    IneligibleRequest = ineligible
    OutOfScopeRequest = outOfScope
    GalleryRequest = gallery
    SharedScope = sharedScope
    ForeignScope = foreignScope
    NoContext = noContext
    NoRequest = noRequest
    NoCredential = noCredential
    ParticipationMode = "AllowRetired"
    ContextTwoSendMode = "Unrestricted"
    CredentialSelectionMode = "ContextBound"
    PublicationMode = "LiveOnly"

CHECK_DEADLOCK FALSE

SPECIFICATION Spec

INVARIANT AllRetiredParticipationViolationsNotObserved
