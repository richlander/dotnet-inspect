\* Mutation: consuming the newer cached version writes the consuming request's
\* older observation back over the cache. Named property:
\* StaleObservedConsumptionIsReadOnly.
CONSTANTS
    Requests = {requestOne, requestTwo}
    RequestOne = requestOne
    RequestTwo = requestTwo
    NoRequest = noRequest
    InitialVersion = 1
    RequestOneVersion = 2
    RequestTwoVersion = 3
    MaxVersion = 3
    RefreshMode = "SingleFlight"
    AcquisitionMode = "CurrentVersionOnly"
    ConsumptionMode = "ConsumeWritesObservedVersion"
    PublicationMode = "MonotonicPublish"

CHECK_DEADLOCK FALSE

SPECIFICATION Spec

INVARIANT TypeOK

PROPERTY StaleObservedConsumptionIsReadOnly
