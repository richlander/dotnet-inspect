\* Mutation: overlapping flights publish their own candidate verbatim, so a
\* late completion can lower the cached version. This needs both the removed
\* single-flight admission and clobbering publication, which is why the model
\* keeps them as separate modes. Named property:
\* CredentialVersionNeverRegresses.
CONSTANTS
    Requests = {requestOne, requestTwo}
    RequestOne = requestOne
    RequestTwo = requestTwo
    NoRequest = noRequest
    InitialVersion = 1
    RequestOneVersion = 2
    RequestTwoVersion = 3
    MaxVersion = 3
    RefreshMode = "DuplicateAcquisition"
    AcquisitionMode = "CurrentVersionOnly"
    ConsumptionMode = "ReadOnly"
    PublicationMode = "ClobberPublish"

CHECK_DEADLOCK FALSE

SPECIFICATION Spec

INVARIANT TypeOK

PROPERTY CredentialVersionNeverRegresses
