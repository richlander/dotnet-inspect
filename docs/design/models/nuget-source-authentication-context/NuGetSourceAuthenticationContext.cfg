CONSTANTS
    Contexts = {privateSource, anonymousSource}
    ContextOne = privateSource
    ContextTwo = anonymousSource
    Requests =
        {privateFirst, privateConcurrent, privateLater, anonymousFirst,
         anonymousLater, unassociated, ineligible, outOfScope, gallery}
    ContextOneFirst = privateFirst
    ContextOneConcurrent = privateConcurrent
    ContextOneLater = privateLater
    ContextTwoFirst = anonymousFirst
    ContextTwoLater = anonymousLater
    UnassociatedRequest = unassociated
    IneligibleRequest = ineligible
    OutOfScopeRequest = outOfScope
    GalleryRequest = gallery
    SharedScope = sharedScope
    ForeignScope = foreignScope
    NoContext = noContext
    NoRequest = noRequest
    NoCredential = noCredential
    ParticipationMode = "LiveOnly"
    ContextTwoSendMode = "Unrestricted"
    CredentialSelectionMode = "ContextBound"
    PublicationMode = "LiveOnly"

CHECK_DEADLOCK FALSE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    ContextCredentialsAreIsolated
    RetiredContextsHaveNoCredential
    PopulatedRetirementIsSound
    PostRetirementRequestCannotUsePlugin
    NoRetiredCacheRead
    NoRetiredChallengeAuthorization
    NoRetiredAcquisitionStart
    NoRetiredAcquisitionJoin
    NoRetiredCredentialUse
    NoRetiredPublication
    CredentialUseIsAuthorized
    CacheReadsStayContextBound
    AcquisitionStartsAreAuthorized
    WaitersStayInTheirContext
    PublicationIsAuthorized
    AtMostOneAcquisitionPerContext
    CrossContextAcquisitionDoesNotBlock
    ContextTwoCannotConsumeContextOneCredential
    ExcludedRequestsDoNotParticipate
    GalleryDoesNotParticipate

PROPERTIES
    AvailableAcquisitionsEventuallyComplete
    AdmittedAuthorizedChallengesEventuallySettle
