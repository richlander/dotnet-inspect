\* Counterexample: construction publishes without merging rejections that share
\* a contributor. An earlier revision of this model could not detect this: with
\* no notion of which machines ought to share a component, component agreement
\* held vacuously. C5_SharedRejectionsMerge is the invariant that closed it.
\* Expected: C5_SharedRejectionsMerge is violated.

SPECIFICATION Spec

CONSTANTS
    MachineCount = 3
    FailureMode = "Total"
    MergeMode = "Component"
    FinishMode = "AllowUnmerged"
    MaxBudget = 3

INVARIANT C5_SharedRejectionsMerge
