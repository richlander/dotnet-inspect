\* A publication records its keys without joining the components they reach.
\* Expected: C5_ComponentsEqualGraphClosure is violated.

SPECIFICATION Spec

CONSTANTS
    KeyCount = 3
    EvidenceCount = 2
    MaxPublications = 3
    MergeMode = "NewOnly"
    FreezeMode = "Aggregate"

INVARIANT C5_ComponentsEqualGraphClosure
