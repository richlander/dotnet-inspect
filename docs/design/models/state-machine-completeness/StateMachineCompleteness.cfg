\* Success scenario: budget suffices for every machine, so both a completed
\* index and a Malformed failure are reachable. BudgetExceeded is not
\* reachable here; BudgetExhaustion.cfg covers it.

SPECIFICATION Spec

CONSTANTS
    MachineCount = 3
    MaxRejections = 3
    FailureMode = "Total"
    MergeMode = "Component"
    FinishMode = "Guarded"
    MaxBudget = 4

INVARIANTS
    TypeOK
    C1_Totality
    C2_FailureIsTyped
    C3_FailureRejectsAll
    C5_ComponentsAgree
    C5_SharedRejectionsMerge
    C5_EvidenceIsFirstDiscovered

PROPERTIES
    FailureIsAbsorbing
    EventuallyTerminal
