\* Counterexample: a row construction never reached is published as Absent,
\* which is exactly what a machine with no claim looks like. This is the
\* faithful form of a lost row -- a real index publishes no "unclassified"
\* marker -- and it is why C1 is stated against an independent recount.
\* Expected: C1_Totality is violated.

SPECIFICATION Spec

CONSTANTS
    MachineCount = 3
    FailureMode = "Total"
    MergeMode = "Component"
    FinishMode = "DropAsAbsent"
    MaxBudget = 3

INVARIANT C1_Totality
