\* Counterexample: whole-module failure leaves results that construction had
\* already recorded, producing a partial shape where C3 requires a total one.
\* This is the round-19 bug from #4835, found in TLC in under a second.
\* Expected: C3_FailureRejectsAll is violated.

SPECIFICATION Spec

CONSTANTS
    MachineCount = 3
    MaxRejections = 3
    FailureMode = "PreserveClassified"
    MergeMode = "Component"
    FinishMode = "Guarded"
    MaxBudget = 4

INVARIANT C3_FailureRejectsAll
