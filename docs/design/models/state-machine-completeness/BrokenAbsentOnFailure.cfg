\* Counterexample: a failed module reports Absent, which is precisely what an
\* empty successful index looks like. C2 exists to forbid it.
\* Expected: C2_FailureIsTyped is violated.

SPECIFICATION Spec

CONSTANTS
    MachineCount = 3
    FailureMode = "ReportAbsent"
    MergeMode = "Component"
    FinishMode = "Guarded"
    MaxBudget = 3

INVARIANT C2_FailureIsTyped
