\* Failure scenario: budget is smaller than the machine count, so construction
\* cannot classify every machine and BudgetExceeded becomes reachable. The
\* same invariants must hold on that path.
SPECIFICATION Spec

CONSTANTS
    MachineCount = 3
    FailureMode = "Total"
    MergeMode = "Component"
    FinishMode = "Guarded"
    MaxBudget = 2

INVARIANTS
    TypeOK
    C1_Totality
    C2_FailureIsTyped
    C3_FailureRejectsAll
    C5_ComponentsAgree
    C5_EvidenceIsFirstDiscovered
    C5_SharedRejectionsMerge

PROPERTIES
    FailureIsAbsorbing
    EventuallyTerminal
