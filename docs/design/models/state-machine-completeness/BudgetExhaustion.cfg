\* The budget cannot classify every machine, forcing BudgetExceeded.

SPECIFICATION Spec

CONSTANTS
    MachineCount = 3
    MaxBudget = 2
    FailureMode = "Total"
    FailureMutationMode = "Stable"
    FinishMode = "Guarded"

INVARIANTS
    TypeOK
    C2_FailureIsTyped
    C3_FailureRejectsAll

\* C1 is intentionally absent: MaxBudget < MachineCount makes Built
\* unreachable in this scenario, so C1's antecedent would be false.

PROPERTIES
    FailureIsAbsorbing
    EventuallyTerminal
