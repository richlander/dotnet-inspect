\* Counterexample: the merged kind follows the order the merges happened in
\* rather than the order the claims were discovered, so merging (a,b) and
\* (b,a) can disagree. Production is order-derived but not order-dependent
\* in this sense: it seeds from the first component it appended.
\* Expected: C5_EvidenceIsFirstDiscovered is violated.

SPECIFICATION Spec

CONSTANTS
    MachineCount = 3
    FailureMode = "Total"
    MergeMode = "LeftArgument"
    FinishMode = "Guarded"
    MaxBudget = 3

INVARIANT C5_EvidenceIsFirstDiscovered
