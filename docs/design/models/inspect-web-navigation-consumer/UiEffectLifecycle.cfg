\* Two intents are enough for one result to become stale between deferred
\* effects. Surface destruction and remount exercise lifetime separation.

SPECIFICATION Spec

CONSTANTS
  MaxIntents = 2
  MaxSurfaceEpoch = 3
  MaxSynchronizationRequests = 2
  EnforceCurrentEffect = TRUE
  EnforceCompleteAcknowledge = TRUE
  EnforceDestroyAbandon = TRUE
  EnforceInstallFirst = TRUE
  EnforcePersistentFocus = TRUE
  EnforceDeferredFocus = TRUE
  EnforceReplacementAbandon = TRUE
  EnforceDispositionInstall = TRUE
  EnforceAbandonPreservesDebt = TRUE
  EnforceRemountSynchronization = TRUE
  EnforceDebtClearOnAcknowledge = TRUE
  EnforceSynchronizationCorrelation = TRUE
  EnforceRequestCapacity = TRUE

INVARIANTS
  TypeOK
  ReturnedShape
  NoUnauthorizedVisibleEffect
  AcknowledgeOnlyAfterEffects
  DestroyAbandonsReturnedAuthority
  SnapshotInstallsBeforeDependentEffects
  DeferredFocusRunsOnlyInFocusEffect
  FocusRemainsOnMountedElement
  ReplacementAbandonsOutgoingAuthority
  DispositionControlsInstallation
  AbandonmentPreservesSynchronizationDebt
  AcknowledgeClearsSynchronizationDebt
  SynchronizationRequestShape
  SynchronizationResponseMatchesRequestLifetime

PROPERTIES
  EveryReturnedAuthoritySettles
  EverySubmittedIntentSettles
  EveryOutstandingDebtRequestsSynchronization
  EverySynchronizationRequestSettles

CHECK_DEADLOCK FALSE
