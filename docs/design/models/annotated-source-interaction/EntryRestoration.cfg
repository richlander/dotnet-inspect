\* TLC configuration for Annotated Source browser-history entries.
SPECIFICATION Spec

CONSTANTS
  Members = {"MemberA", "MemberB"}
  MaxEntries = 3
  MaxLocalRevision = 1

INVARIANTS
  TypeOK
  VisibleEntryIsCurrent
  EntryIdsAreUnique
  LocalStateChangesDoNotNavigate
  ModeChangesReplaceCurrentEntry
  SuccessfulNavigationIsFreshAndSticky
  BackAndForwardRestoreExactEntries
  FailedNavigationRetainsHistory
