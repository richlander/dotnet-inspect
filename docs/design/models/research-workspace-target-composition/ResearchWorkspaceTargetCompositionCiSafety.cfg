\* CI-bounded safety exploration over successful owner inputs.
CHECK_DEADLOCK FALSE

CONSTANTS
    Facade = facade
    Target = target
    Other = other
    Before = before
    After = after
    GroupBefore = groupBefore
    GroupAfter = groupAfter
    QueryOperation = queryOperation
    QueryQuestion = queryQuestion
    ResearchOperation = researchOperation
    ReceiptBefore = receiptBefore
    ReceiptAfter = receiptAfter
    ForeignReceipt = foreignReceipt
    QueryRootId = queryRoot
    QueryTerminalSelectedId = queryTerminalSelected
    QueryTerminalOppositeId = queryTerminalOpposite
    ResearchRootId = researchRoot
    ResearchTerminalSelectedId = researchTerminalSelected
    ResearchTerminalOppositeId = researchTerminalOpposite
    FreshResearchId = freshResearch
    AttemptRootId = attemptRoot
    AttemptTerminalSelectedId = attemptTerminalSelected
    AttemptTerminalOppositeId = attemptTerminalOpposite
    FreshAttemptId = freshAttempt
    DomainRootId = domainRoot
    DomainTerminalSelectedId = domainTerminalSelected
    DomainTerminalOppositeId = domainTerminalOpposite
    DomainOtherSelectedId = domainOtherSelected
    CensusRootId = censusRoot
    CensusTerminalSelectedId = censusTerminalSelected
    CensusTerminalOppositeId = censusTerminalOpposite
    CensusOtherSelectedId = censusOtherSelected
    InitialBinding = bindingInitial
    ReplacementBinding = bindingReplacement
