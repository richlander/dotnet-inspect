\* Tolerant liveness with disruptive environment actions enabled.
CONSTANTS
    Processes = {p1, p2}
    Callers = {c1, c2, c3, c4}
    Process1 = p1
    Process2 = p2
    Process1Callers = {c1, c2}
    Process2Callers = {c3, c4}
    RetryCallers = {c2, c4}
    MaxAttempts = 2
    NoOwner = noOwner
    PublicationMode = "AtomicRename"
    InitialTargetStates = {"Absent", "Invalid"}
    EvictNonSuccess = TRUE
    ScriptedFirstAttempts = {p1}
    FirstAttemptOutcomes = {"Failure", "FactoryCancelled"}
    AllowAttemptFailure = TRUE
    AllowFactoryCancellation = TRUE
    AllowCallerCancellation = TRUE
    AllowCrash = TRUE
    AllowRenameFailure = TRUE

SPECIFICATION Spec

PROPERTIES
    WaitingCallersSettle
    PublisherConvergesOnWinner
