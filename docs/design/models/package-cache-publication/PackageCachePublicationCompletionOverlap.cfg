\* NoReplacementCompletionOverlap when attempt 2 starts after attempt 1 is
\* removed but before its outer task publishes its outcome.
CONSTANTS
    Processes = {p1, p2}
    Callers = {c1, c2, c3, c4, c5, c6}
    Process1 = p1
    Process2 = p2
    Process1Callers = {c1, c2, c3}
    Process2Callers = {c4, c5, c6}
    RetryCallers = {c3, c6}
    MaxAttempts = 2
    NoOwner = noOwner
    PublicationMode = "AtomicRename"
    InitialTargetStates = {"Absent"}
    EvictNonSuccess = TRUE
    ScriptedFirstAttempts = {}
    FirstAttemptOutcomes = {"Failure"}
    AllowAttemptFailure = FALSE
    AllowFactoryCancellation = FALSE
    AllowCallerCancellation = FALSE
    AllowCrash = FALSE
    AllowRenameFailure = FALSE

SPECIFICATION Spec

INVARIANT NoReplacementCompletionOverlap
