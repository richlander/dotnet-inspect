\* Quiet liveness with both shared non-success outcomes.
CONSTANTS
    Processes = {p1, p2}
    Callers = {c1, c2, c3, c4, c5, c6}
    Process1 = p1
    Process2 = p2
    Process1Callers = {c1, c2, c3}
    Process2Callers = {c4, c5, c6}
    RetryCallers = {c3, c6}
    MaxAttempts = 2
    NoOwner = noOwner
    PublicationMode = "AtomicRename"
    InitialTargetStates = {"Absent"}
    EvictNonSuccess = TRUE
    ScriptedFirstAttempts = {p1, p2}
    FirstAttemptOutcomes = {"Failure", "FactoryCancelled"}
    AllowAttemptFailure = FALSE
    AllowFactoryCancellation = FALSE
    AllowCallerCancellation = FALSE
    PropagateCallerCancellation = FALSE
    AllowCrash = FALSE
    AllowRenameFailure = FALSE

SPECIFICATION Spec

PROPERTIES
    WaitingCallersSettle
    NonSuccessAttemptEventuallySucceeds
    PublisherConvergesOnWinner
