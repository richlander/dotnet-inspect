\* Mutation: caller cancellation propagates into its shared task and peer
\* waiters, which must violate CallerCancellationIsLocal.
CONSTANTS
    Processes = {p1, p2}
    Callers = {c1, c2, c3, c4, c5, c6}
    Process1 = p1
    Process2 = p2
    Process1Callers = {c1, c2, c3}
    Process2Callers = {c4, c5, c6}
    RetryCallers = {c3, c6}
    MaxAttempts = 2
    NoOwner = noOwner
    PublicationMode = "AtomicRename"
    InitialTargetStates = {"Absent"}
    EvictNonSuccess = TRUE
    ScriptedFirstAttempts = {}
    FirstAttemptOutcomes = {"Failure"}
    AllowAttemptFailure = FALSE
    AllowFactoryCancellation = FALSE
    AllowCallerCancellation = TRUE
    PropagateCallerCancellation = TRUE
    AllowCrash = FALSE
    AllowRenameFailure = FALSE

SPECIFICATION Spec

INVARIANT CallerCancellationIsLocal
