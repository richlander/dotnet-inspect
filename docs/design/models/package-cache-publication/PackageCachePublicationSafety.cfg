\* Full bounded safety exploration.
CONSTANTS
    Processes = {p1, p2}
    Callers = {c1, c2, c3, c4, c5, c6}
    Process1 = p1
    Process2 = p2
    Process1Callers = {c1, c2, c3}
    Process2Callers = {c4, c5, c6}
    RetryCallers = {c3, c6}
    MaxAttempts = 2
    NoOwner = noOwner
    PublicationMode = "AtomicRename"
    InitialTargetStates = {"Absent", "Invalid"}
    EvictNonSuccess = TRUE
    ScriptedFirstAttempts = {p1}
    FirstAttemptOutcomes = {"Failure", "FactoryCancelled"}
    AllowAttemptFailure = TRUE
    AllowFactoryCancellation = TRUE
    AllowCallerCancellation = TRUE
    AllowCrash = TRUE
    AllowRenameFailure = TRUE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    FinalPathIsAtomic
    TargetOwnerIsConsistent
    AtMostOnePublisher
    RegistryContainsOnlyPendingTasks
    SingleRegisteredAcquisitionPerProcess
    ObservedOutcomeMatchesJoinedTask
    ReturnedOnlyFromCompleteTarget
    JoinedCallersAgree
