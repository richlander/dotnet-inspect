\* Full bounded pinned-payload safety and liveness.
CHECK_DEADLOCK FALSE

CONSTANTS
    AuthorityOne = authorityOne
    AuthorityTwo = authorityTwo
    PrimaryRoute = primaryRoute
    FallbackRoute = fallbackRoute
    PeerRoute = peerRoute
    NoAuthority = noAuthority
    OperationKind = "Pinned"
    BindingMode = "Association"
    CompletionMode = "AllAuthorities"
    DeadlineMode = "Terminal"
    FailureMode = "Visible"

SPECIFICATION Spec

INVARIANTS
    TypeOK
    AdoptedResultsKeepAssociation
    AbsentResultsKeepAssociation
    TerminalFailureResultsKeepAssociation
    TerminalFailuresRemainVisible
    OperationTimeoutIsTerminal
    PayloadKeepsReportingAuthority
    PayloadPublishesBeforeOperationTimeout

PROPERTY AggregateSettles
